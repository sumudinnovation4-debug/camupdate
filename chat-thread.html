// ---- Global incoming-call ring (every page that loads this guard) ----
(async () => {
  const { data: { session } } = await window.sb.auth.getSession();
  if (!session || window.location.pathname.endsWith('call.html')) return;

  let ringAudio = null;
  function startRingtone() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const beep = () => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 660; g.gain.value = 0.08;
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + 0.7);
      };
      beep();
      ringAudio = { ctx, loop: setInterval(beep, 1600) };
    } catch (_) {}
  }
  function stopRingtone() {
    if (!ringAudio) return;
    clearInterval(ringAudio.loop);
    try { ringAudio.ctx.close(); } catch (_) {}
    ringAudio = null;
  }

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  window.sb.channel(`ring-${session.user.id}`)
    .on('broadcast', { event: 'incoming' }, ({ payload }) => {
      if (document.getElementById('incomingCallOverlay')) return; // already ringing
      const name = payload.callerName || 'Camplugie user';
      const overlay = document.createElement('div');
      overlay.id = 'incomingCallOverlay';
      overlay.className = 'incoming-call';
      overlay.innerHTML = `
        <div class="avatar">${esc(name.slice(0, 2).toUpperCase())}</div>
        <h2>${esc(name)}</h2>
        <p>${payload.video ? 'Incoming video call…' : 'Incoming Camplugie call…'}</p>
        <div class="row">
          <button class="call-ctl end" id="declineCallBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.42 12.42 0 0 0 3.81.61 2 2 0 0 1 2 2V21a2 2 0 0 1-2 2h-1C7.61 23 1 16.39 1 8V7a2 2 0 0 1 2-2h3.5a2 2 0 0 1 2 2 12.42 12.42 0 0 0 .61 3.81 2 2 0 0 1-.45 2.11z"/></svg>
            <span>Decline</span>
          </button>
          <button class="call-ctl accept" id="acceptCallBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span>Answer</span>
          </button>
        </div>`;
      document.body.appendChild(overlay);
      startRingtone();
      if (navigator.vibrate) navigator.vibrate([400, 250, 400, 250, 400]);

      const cleanup = () => { stopRingtone(); overlay.remove(); if (navigator.vibrate) navigator.vibrate(0); };

      document.getElementById('acceptCallBtn').addEventListener('click', () => {
        cleanup();
        window.location.href = `call.html?peer=${payload.callerId}&name=${encodeURIComponent(name)}` +
          `&role=callee&channel=${payload.callChannel}&mode=${payload.video ? 'video' : 'audio'}&auto=1`;
      });

      document.getElementById('declineCallBtn').addEventListener('click', async () => {
        const ch = window.sb.channel(payload.callChannel);
        await ch.subscribe();
        ch.send({ type: 'broadcast', event: 'signal', payload: { kind: 'declined', from: session.user.id } });
        setTimeout(() => window.sb.removeChannel(ch), 500);
        cleanup();
      });

      setTimeout(() => { if (document.body.contains(overlay)) cleanup(); }, 35000);
    })
    .subscribe();
})();
</script>
<script>
const SYSTEM_PREFIX = '\u{1F512}SYSTEM:'; // centered system pills

const C = window.CPChat;

let myUserId = null;
let myName = 'Someone';
let convo = null;
let otherUserId = null;
let otherUserName = '';
let isSeller = false;

let messages = [];            // live message list (ordered)
const byId = new Map();       // id -> message
let replyTo = null;           // message being replied to
let editing = null;           // message being edited
let presence = null;
let scroller = null;
let firstUnreadId = null;
let msgChannel = null;

const $ = (id) => document.getElementById(id);
const box = $('threadMessages');

/* ============ rendering ============ */

function decorate(m) {
  m._mine = m.sender_id === myUserId;
  if (m.reply_to && byId.has(m.reply_to)) {
    const p = byId.get(m.reply_to);
    m.reply_to_content = p.media_url ? (p.media_type?.startsWith('image') ? '📷 Photo' : p.media_type?.startsWith('audio') ? '🎤 Voice note' : '📎 Attachment') : p.content;
    m.reply_to_name = p.sender_id === myUserId ? 'You' : otherUserName;
  }
  return m;
}

function render() {
  if (!messages.length) {
    box.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text3);font-size:13px;">Say hi 👋 — this is the start of your conversation.</div>`;
    return;
  }
  let html = '';
  let lastDay = null;
  let prev = null;

  messages.forEach((m) => {
    const day = C.dayLabel(m.created_at);
    if (day !== lastDay) { html += `<div class="thread-date-sep"><span>${day}</span></div>`; lastDay = day; prev = null; }

    if (firstUnreadId && m.id === firstUnreadId) {
      html += `<div class="unread-sep"><span>UNREAD MESSAGES</span></div>`;
    }

    if ((m.content || '').startsWith(SYSTEM_PREFIX)) {
      html += `<div class="thread-system-msg"><span>${C.esc(m.content.slice(SYSTEM_PREFIX.length))}</span></div>`;
      prev = null;
      return;
    }

    // "grouped" = same sender within 3 minutes, so bubbles tuck together like WhatsApp
    const grouped = prev && prev.sender_id === m.sender_id &&
      (new Date(m.created_at) - new Date(prev.created_at)) < 180000;

    html += C.rowHtml(m, { mine: m._mine, grouped });
    prev = m;
  });

  html += `<div class="typing-row" id="typingRow" style="display:none">
    <div class="typing-bubble"><i></i><i></i><i></i></div></div>`;

  box.innerHTML = html;
}

/* ============ loading ============ */

async function loadMessages(convoId) {
  const { data, error } = await window.sb.from('messages')
    .select('*').eq('conversation_id', convoId).order('created_at', { ascending: true }).limit(500);

  if (error) {
    console.error('Load messages error:', error);
    box.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text3);font-size:13px;">Couldn't load messages.</div>`;
    return;
  }

  messages = data || [];
  byId.clear();
  messages.forEach(m => byId.set(m.id, m));
  messages.forEach(decorate);

  // Where the unread divider goes: first message from them I haven't read.
  const firstUnread = messages.find(m => !m._mine && !m.read_at);
  firstUnreadId = firstUnread ? firstUnread.id : null;

  render();
  scroller.toBottom(false);
  markTheirsRead();
}

// Mark everything they sent as read → their side flips to blue ticks.
async function markTheirsRead() {
  const unread = messages.filter(m => !m._mine && !m.read_at);
  if (!unread.length) return;
  const now = new Date().toISOString();
  unread.forEach(m => { m.read_at = now; });
  await window.sb.from('messages').update({ read_at: now, delivered_at: now })
    .eq('conversation_id', convo.id).neq('sender_id', myUserId).is('read_at', null);
}

// Mark messages they sent while I had the thread open as delivered.
async function markDelivered() {
  await window.sb.from('messages').update({ delivered_at: new Date().toISOString() })
    .eq('conversation_id', convo.id).neq('sender_id', myUserId).is('delivered_at', null);
}

/* ============ realtime ============ */

function subscribeToMessages(convoId) {
  msgChannel = window.sb.channel(`messages-${convoId}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `conversation_id=eq.${convoId}` }, ({ new: m }) => {
      if (byId.has(m.id)) return;
      // Replace my optimistic copy if this is the real row coming back.
      const pendingIdx = messages.findIndex(x => x._pending && x.content === m.content && x.sender_id === m.sender_id);
      if (pendingIdx !== -1) { byId.delete(messages[pendingIdx].id); messages.splice(pendingIdx, 1); }
      byId.set(m.id, m);
      messages.push(decorate(m));
      render();
      scroller.onIncoming(m.sender_id === myUserId);
      if (m.sender_id !== myUserId) { markTheirsRead(); ping(); }
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: `conversation_id=eq.${convoId}` }, ({ new: m }) => {
      const i = messages.findIndex(x => x.id === m.id);
      if (i === -1) return;
      messages[i] = decorate(Object.assign(messages[i], m));
      byId.set(m.id, messages[i]);
      render();
    })
    .subscribe();
}

// Tiny receive blip — same idea as WhatsApp's incoming tone, no asset needed.
function ping() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.05;
    o.start(); o.stop(ctx.currentTime + 0.09);
  } catch (_) {}
}

/* ============ sending ============ */

async function sendMessage(extra = {}) {
  const input = $('messageInput');
  const content = (extra.content !== undefined ? extra.content : input.value).trim();
  if ((!content && !extra.media_url) || !convo) return;

  if (editing) {
    const id = editing.id; editing = null; clearReplyBar();
    input.value = ''; input.style.height = 'auto';
    await window.sb.from('messages').update({ content, edited_at: new Date().toISOString() }).eq('id', id);
    return;
  }

  if (extra.content === undefined) { input.value = ''; input.style.height = 'auto'; }
  updateSendIcon();

  const payload = {
    conversation_id: convo.id,
    sender_id: myUserId,
    content,
    created_at: new Date().toISOString(),
    reply_to: replyTo ? replyTo.id : null,
    media_url: extra.media_url || null,
    media_type: extra.media_type || null,
    media_duration: extra.media_duration || null,
  };

  // Optimistic bubble with the clock tick, exactly like WhatsApp.
  const tempId = 'tmp-' + Math.random().toString(36).slice(2);
  const optimistic = decorate(Object.assign({ id: tempId, _pending: true }, payload));
  messages.push(optimistic); byId.set(tempId, optimistic);
  clearReplyBar();
  render(); scroller.toBottom(true);

  const { data: sent, error } = await window.sb.from('messages').insert(payload).select('*').single();

  const i = messages.findIndex(m => m.id === tempId);
  if (error) {
    console.error('Send error:', error);
    if (i !== -1) { messages.splice(i, 1); byId.delete(tempId); render(); }
    alert('Could not send — check your connection and try again.');
    if (!extra.media_url) { input.value = content; updateSendIcon(); }
    return;
  }

  if (i !== -1) { messages.splice(i, 1); byId.delete(tempId); }
  if (!byId.has(sent.id)) { byId.set(sent.id, sent); messages.push(decorate(sent)); }
  render(); scroller.toBottom(true);

  const preview = content || (payload.media_type?.startsWith('image') ? '📷 Photo' : payload.media_type?.startsWith('audio') ? '🎤 Voice note' : '📎 Attachment');
  await window.sb.from('conversations').update({ last_message: preview, last_message_at: new Date().toISOString() }).eq('id', convo.id);

  fetch('/api/notify-message', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ conversation_id: convo.id, message_id: sent.id }),
  }).catch(err => console.error('notify-message failed:', err));
}

/* ============ reply / edit bar ============ */

function showReplyBar(m, mode = 'reply') {
  const bar = $('composerReply');
  $('replyName').textContent = mode === 'edit' ? 'Editing message' : (m._mine ? 'You' : otherUserName);
  $('replyText').textContent = m.media_url ? '📎 Attachment' : (m.content || '').slice(0, 80);
  bar.classList.add('show');
  $('messageInput').focus();
}
function clearReplyBar() {
  replyTo = null; editing = null;
  $('composerReply').classList.remove('show');
}

/* ============ composer wiring ============ */

const input = $('messageInput');
C.autoGrow(input);

function updateSendIcon() {
  const hasText = input.value.trim().length > 0;
  $('sendIcon').outerHTML = hasText
    ? '<svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>'
    : '<svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>';
}

input.addEventListener('input', () => {
  updateSendIcon();
  presence?.typing(myName);
});

// Desktop: Enter sends, Shift+Enter makes a new line. Mobile keyboard: newline.
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer:fine)').matches) {
    e.preventDefault(); sendMessage();
  }
});

$('cancelReplyBtn').addEventListener('click', () => { clearReplyBar(); if (editing) { input.value = ''; updateSendIcon(); } });

/* ---- send button: text send, or hold-to-record a voice note ---- */
const recorder = C.makeRecorder();
let holdTimer = null;

async function stopAndSendVoice() {
  $('recBar').classList.remove('show');
  $('composerPill').style.display = '';
  $('sendBtn').classList.remove('recording');
  const out = await recorder.stop();
  updateSendIcon();
  if (!out) return;
  try {
    showUpload('Sending voice note…');
    const up = await C.uploadFile(out.file, myUserId);
    hideUpload();
    sendMessage({ content: '', media_url: up.url, media_type: 'audio/webm', media_duration: out.seconds });
  } catch (err) { hideUpload(); alert(err.message || 'Could not send voice note.'); }
}

$('sendBtn').addEventListener('click', async () => {
  if (recorder.active) return stopAndSendVoice();
  if (input.value.trim()) return sendMessage();

  // No text → start recording a voice note
  try {
    $('composerPill').style.display = 'none';
    $('recBar').classList.add('show');
    $('sendBtn').classList.add('recording');
    $('sendIcon').outerHTML = '<svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    await recorder.start((sec) => { $('recTime').textContent = C.mmss(sec); });
  } catch (err) {
    $('composerPill').style.display = ''; $('recBar').classList.remove('show'); $('sendBtn').classList.remove('recording'); updateSendIcon();
    alert('Microphone permission is needed for voice notes.');
  }
});

$('recCancel').addEventListener('click', () => {
  recorder.cancel();
  $('recBar').classList.remove('show'); $('composerPill').style.display = ''; $('sendBtn').classList.remove('recording');
  updateSendIcon();
});

/* ---- attachments ---- */
const picker = $('filePicker');
$('attachBtn').addEventListener('click', (e) => { e.stopPropagation(); $('attachMenu').classList.toggle('show'); });
document.addEventListener('click', () => $('attachMenu').classList.remove('show'));
$('attachMenu').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-pick]'); if (!btn) return;
  const kind = btn.dataset.pick;
  picker.accept = kind === 'image' ? 'image/*' : kind === 'video' ? 'video/*' : '*/*';
  picker.click();
});

function showUpload(t) { const p = $('uploadPill'); p.textContent = t; p.classList.add('show'); }
function hideUpload() { $('uploadPill').classList.remove('show'); }

picker.addEventListener('change', async () => {
  const file = picker.files[0]; picker.value = '';
  if (!file) return;
  if (file.size > 25 * 1024 * 1024) { alert('That file is over 25MB — try a smaller one.'); return; }
  try {
    showUpload('Uploading…');
    const ready = await C.compressImage(file);
    const up = await C.uploadFile(ready, myUserId);
    hideUpload();
    sendMessage({ content: input.value.trim(), media_url: up.url, media_type: up.type });
    input.value = ''; updateSendIcon();
  } catch (err) {
    hideUpload();
    alert(err.message?.includes('Bucket') ? 'Media bucket missing — create a public bucket called "chat-media" in Supabase Storage.' : (err.message || 'Upload failed'));
  }
});

/* ============ message actions ============ */

C.wireActionSheet(box, (id) => byId.get(id), async (action, id) => {
  const m = byId.get(id); if (!m) return;

  if (action === 'reply') { replyTo = m; showReplyBar(m); return; }
  if (action === 'copy') {
    try { await navigator.clipboard.writeText(m.content || m.media_url || ''); } catch (_) {}
    return;
  }
  if (action === 'edit') { editing = m; input.value = m.content || ''; updateSendIcon(); showReplyBar(m, 'edit'); return; }
  if (action === 'delete') {
    if (!confirm('Delete this message for everyone?')) return;
    await window.sb.from('messages').update({ is_deleted: true, content: '', media_url: null }).eq('id', id);
    return;
  }
  if (action.startsWith('react:')) {
    const emoji = action.slice(6);
    const reactions = Object.assign({}, m.reactions || {});
    const list = new Set(reactions[emoji] || []);
    list.has(myUserId) ? list.delete(myUserId) : list.add(myUserId);
    if (list.size) reactions[emoji] = [...list]; else delete reactions[emoji];
    await window.sb.from('messages').update({ reactions }).eq('id', id);
  }
});

// Tap a quoted reply → jump to the original
box.addEventListener('click', (e) => {
  const q = e.target.closest('[data-jump]'); if (!q) return;
  const row = box.querySelector(`.msg-row[data-mid="${q.dataset.jump}"]`);
  if (!row) return;
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  row.querySelector('.msg-bubble').style.outline = '2px solid var(--accent)';
  setTimeout(() => { const b = row.querySelector('.msg-bubble'); if (b) b.style.outline = ''; }, 1200);
});

C.wireVoicePlayback(box);
C.wireLightbox(box);

/* ============ listing / escrow (unchanged marketplace logic) ============ */

async function renderListingChip(listing) {
  const chip = $('threadListingChip');
  if (!listing) { chip.innerHTML = ''; $('deliveryRow').innerHTML = ''; $('escrowBox').innerHTML = ''; return; }

  const { data: escrow } = await window.sb.from('escrow_orders').select('*')
    .eq('listing_id', listing.id).eq('conversation_id', convo.id)
    .order('created_at', { ascending: false }).limit(1).maybeSingle();

  const dealStarted = !!escrow;
  const dealDone = escrow && escrow.status === 'released';
  const canRequestDelivery = escrow && ['paid_escrow', 'released'].includes(escrow.status) && myUserId === escrow.buyer_id;

  chip.innerHTML = `
    <div class="thread-listing-chip">
      <a class="info" href="listing.html?id=${listing.id}">🛍️ ${C.esc(listing.title)} · ${window.CP.fmtNaira(listing.price)}</a>
      ${dealDone ? `<span class="thread-sold-tag">✅ Deal complete</span>`
        : dealStarted ? `<span class="thread-sold-tag">🔒 In progress</span>`
        : (isSeller ? `<button class="mark-sold-btn" id="markSoldBtn">Start transaction</button>` : '')}
    </div>`;

  const deliveryRow = $('deliveryRow');
  if (isSeller) deliveryRow.innerHTML = '';
  else if (canRequestDelivery) deliveryRow.innerHTML = `<div class="request-delivery-row"><a href="swift.html?listing=${listing.id}">🛵 Request delivery</a></div>`;
  else if (dealStarted) deliveryRow.innerHTML = `<div class="request-delivery-row"><span class="disabled-hint">🔒 Delivery unlocks once payment is confirmed</span></div>`;
  else deliveryRow.innerHTML = '';

  if (isSeller && !dealStarted) $('markSoldBtn').addEventListener('click', startTransaction);
  if (dealStarted) renderEscrowBox(listing, escrow); else $('escrowBox').innerHTML = '';
}

function lockLocation(promptLabel) {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('Location not supported on this device.'));
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude: lat, longitude: lng } = pos.coords;
        if (!confirm(`${promptLabel}\n\nLock in your current location (${lat.toFixed(5)}, ${lng.toFixed(5)}) for this deal?`)) return reject(new Error('Location not confirmed'));
        resolve({ lat, lng });
      },
      () => reject(new Error('Could not get your location — check permissions.'))
    );
  });
}

async function startTransaction() {
  if (!confirm(`Start a transaction for "${convo.listings.title}" with this buyer? You'll be asked to confirm your handover location.`)) return;
  let loc;
  try { loc = await lockLocation('This will be shown as the pickup/handover point.'); }
  catch (e) { alert(e.message); return; }

  const amount_kobo = window.CPPay.nairaToKobo(convo.listings.price);
  const commission_kobo = Math.round(amount_kobo * 0.05);
  const { error } = await window.sb.from('escrow_orders').insert({
    kind: 'item', conversation_id: convo.id, listing_id: convo.listings.id,
    buyer_id: convo.buyer_id, seller_id: myUserId,
    amount_kobo, commission_kobo, payout_kobo: amount_kobo - commission_kobo,
    pickup_lat: loc.lat, pickup_lng: loc.lng, status: 'awaiting_payment',
  });
  if (error) { console.error('Start transaction error:', error); alert('Could not start the transaction — try again.'); return; }

  await window.sb.from('messages').insert({
    conversation_id: convo.id, sender_id: myUserId,
    content: `${SYSTEM_PREFIX}✅ Transaction started — location locked in, waiting for payment`,
    created_at: new Date().toISOString(),
  });
  renderListingChip(convo.listings);
}

async function renderEscrowBox(listing, escrow) {
  const boxEl = $('escrowBox');
  if (!escrow) { boxEl.innerHTML = ''; return; }
  const isBuyer = myUserId === escrow.buyer_id;
  let html = '';

  if (escrow.status === 'awaiting_payment') {
    html = isBuyer
      ? `<div class="request-delivery-row"><button class="mark-sold-btn" id="payNowBtn">💳 Pay ${window.CP.fmtNaira(listing.price)} to escrow</button></div>`
      : `<div class="request-delivery-row"><span class="disabled-hint">⏳ Waiting for buyer to pay</span></div>`;
  } else if (escrow.status === 'paid_escrow') {
    html = `<div class="request-delivery-row" style="flex-direction:column;align-items:stretch;gap:6px">
      <span class="disabled-hint">🔒 ${window.CP.fmtNaira(listing.price)} held in escrow</span>
      ${isBuyer ? `<button class="mark-sold-btn" id="confirmReceivedBtn">✅ Confirm received</button>` : ''}
      <button class="mark-sold-btn" id="cancelRefundBtn" style="background:var(--danger)">Cancel &amp; refund buyer</button>
    </div>`;
  } else if (escrow.status === 'released') {
    html = `<div class="request-delivery-row"><span class="disabled-hint">✅ Paid out to seller — deal complete</span></div>`;
  } else if (escrow.status === 'refunded') {
    html = `<div class="request-delivery-row"><span class="disabled-hint">↩️ Refunded to buyer</span></div>`;
  }
  boxEl.innerHTML = html;

  $('payNowBtn')?.addEventListener('click', async (e) => {
    const btn = e.target; btn.disabled = true; btn.textContent = 'Locking in your location…';
    try {
      const loc = await lockLocation('This will be shown as your delivery/dropoff point.');
      await window.sb.from('escrow_orders').update({ dropoff_lat: loc.lat, dropoff_lng: loc.lng }).eq('id', escrow.id);
      const { data: { session } } = await window.sb.auth.getSession();
      btn.textContent = 'Opening payment…';
      await window.CPPay.payEscrowOrder({ escrowOrderId: escrow.id, amountKobo: escrow.amount_kobo, email: session.user.email });
      renderListingChip(listing);
    } catch (err) { alert(err.message || 'Payment failed'); btn.disabled = false; btn.textContent = `💳 Pay ${window.CP.fmtNaira(listing.price)} to escrow`; }
  });

  $('confirmReceivedBtn')?.addEventListener('click', async (e) => {
    if (!confirm('Confirm you received the item? This releases payment to the seller.')) return;
    e.target.disabled = true; e.target.textContent = 'Releasing payment…';
    try { await window.CPPay.confirmReceived(escrow.id); renderListingChip(listing); }
    catch (err) { alert(err.message || 'Could not release payment'); e.target.disabled = false; }
  });

  $('cancelRefundBtn')?.addEventListener('click', async (e) => {
    if (!confirm('Cancel this deal and refund the buyer?')) return;
    e.target.disabled = true; e.target.textContent = 'Refunding…';
    try { await window.CPPay.cancelAndRefundEscrow(escrow.id); renderListingChip(listing); }
    catch (err) { alert(err.message || 'Refund failed'); e.target.disabled = false; }
  });
}

/* ============ boot ============ */

async function loadConversation(userId) {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { box.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text3);font-size:13px;">No conversation specified.</div>`; return; }

  const { data, error } = await window.sb.from('conversations')
    .select('*, listings(id, title, price, status, sold_to), buyer:profiles!conversations_buyer_id_fkey(id, username, full_name, avatar_url, last_seen_at), seller:profiles!conversations_seller_id_fkey(id, username, full_name, avatar_url, last_seen_at)')
    .eq('id', id).single();

  if (error || !data) { box.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text3);font-size:13px;">Couldn't load this conversation.</div>`; return; }

  convo = data;
  isSeller = data.seller_id === userId;
  const other = data.buyer_id === userId ? data.seller : data.buyer;
  otherUserId = other?.id || null;
  otherUserName = other?.full_name || other?.username || 'Camplugie user';

  $('threadName').textContent = otherUserName;
  $('threadStatus').textContent = C.lastSeen(other?.last_seen_at);
  const av = document.querySelector('.thread-header-info .avatar');
  if (other?.avatar_url) av.innerHTML = `<img src="${C.esc(other.avatar_url)}" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
  else av.textContent = window.CP.initials(otherUserName);

  renderListingChip(data.listings);
  await loadMessages(id);
  await markDelivered();
  subscribeToMessages(id);

  // Presence + typing for this thread
  presence = C.makePresence(`thread-presence-${id}`, myUserId, {
    onSync(state) {
      const online = Object.keys(state).some(k => k !== myUserId);
      const el = $('threadStatus');
      if (el.classList.contains('typing')) return;
      el.classList.toggle('online', online);
      el.textContent = online ? 'online' : C.lastSeen(other?.last_seen_at);
    },
    onTyping(p) {
      const el = $('threadStatus');
      const row = $('typingRow');
      if (p.typing) {
        el.classList.add('typing'); el.classList.remove('online');
        el.textContent = 'typing…';
        if (row) { row.style.display = 'flex'; scroller.nearBottom() && scroller.toBottom(true); }
      } else {
        el.classList.remove('typing');
        el.textContent = 'online';
        el.classList.add('online');
        if (row) row.style.display = 'none';
      }
    },
  });
}

document.addEventListener('cp-ready', (e) => {
  myUserId = e.detail.user.id;
  myName = e.detail.profile?.full_name || e.detail.profile?.username || 'Someone';
  scroller = C.makeScroller($('chatScroll'), $('scrollBottomBtn'));
  updateSendIcon();
  loadConversation(myUserId);
});

// Keep my own "last seen" fresh + clear typing when I leave.
window.addEventListener('beforeunload', () => {
  presence?.stopTyping(myName);
  if (myUserId) window.sb.from('profiles').update({ last_seen_at: new Date().toISOString() }).eq('id', myUserId);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && convo) markTheirsRead();
});

// Mobile keyboard opening shouldn't hide the latest message.
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => { scroller?.nearBottom() && scroller.toBottom(false); });
}
