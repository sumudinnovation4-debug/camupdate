<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camplugie — Groups</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Clash+Display:wght@500;600;700&family=Satoshi:wght@400;500;700;900&display=swap');

/* ===== Design tokens (matches Camplugie's existing dark theme) ===== */
:root {
  --brand: #A78BFA;
  --brand-dark: #7C3AED;
  --brand-soft: rgba(167, 139, 250, 0.14);
  --accent: #FBBF24;
  --accent-soft: rgba(251, 191, 36, 0.14);
  --money: #34D399;
  --danger: #FB7185;

  --bg: #090714;
  --bg-gradient: radial-gradient(circle at 20% -10%, rgba(124,58,237,0.34), transparent 36%), linear-gradient(180deg, #0E0A1D 0%, #090714 100%);
  --surface: #12101D;
  --surface2: #1A1729;
  --surface3: #242039;
  --border: rgba(255,255,255,0.10);

  --text: #F8F6FF;
  --text2: #C9C3DE;
  --text3: #8D86AA;

  --nav-h: 58px;
  --bottom-h: 68px;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 14px 38px rgba(0,0,0,0.28);
  --shadow-lg: 0 24px 80px rgba(0,0,0,0.48);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg-gradient), var(--bg);
  color: var(--text);
  font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
}
h1, h2, h3, h4, .display {
  font-family: 'Clash Display', 'Satoshi', sans-serif;
  margin: 0;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
img { max-width: 100%; display: block; }

.app-shell {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  padding-bottom: calc(var(--bottom-h) + var(--safe-bottom) + 10px);
}

/* ===== Header ===== */
.cp-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(var(--safe-top) + 14px) 16px 12px;
  background: rgba(9, 7, 20, 0.88);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.cp-header-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cp-logo {
  width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(124,58,237,0.35);
}
.cp-logo img { width: 100%; height: 100%; object-fit: cover; }
.cp-header-text { min-width: 0; }
.cp-header-text .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.cp-header-text .brand-sub {
  font-size: 11.5px; color: var(--text3); font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cp-header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.icon-btn {
  position: relative;
  width: 38px; height: 38px; border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-badge {
  position: absolute; top: -4px; right: -4px;
  min-width: 16px; height: 16px; padding: 0 3px;
  border-radius: 999px;
  background: var(--danger);
  color: #fff;
  font-size: 10px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--bg);
}

/* ===== Search ===== */
.cp-search-wrap { padding: 14px 16px 4px; }
.cp-search {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0 16px;
  height: 44px;
}
.cp-search svg { width: 17px; height: 17px; color: var(--text3); flex-shrink: 0; }
.cp-search input {
  flex: 1; border: none; background: none; outline: none;
  font: inherit; font-size: 14.5px; color: var(--text);
  min-width: 0;
}
.cp-search input::placeholder { color: var(--text3); }

/* ===== Category chips ===== */
.cp-chiprow {
  display: flex; gap: 8px;
  overflow-x: auto; scrollbar-width: none;
  padding: 12px 16px 4px;
}
.cp-chiprow::-webkit-scrollbar { display: none; }
.cp-chip {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  border-radius: 999px;
  padding: 9px 16px;
  font-size: 13.5px; font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.cp-chip.active { background: var(--accent); color: #1A1200; border-color: var(--accent); }

/* ===== Promo banner ===== */
.cp-promo {
  margin: 14px 16px 0;
  border-radius: var(--radius);
  padding: 22px 20px;
  background: linear-gradient(135deg, var(--brand-dark), var(--brand) 120%);
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.cp-promo::after {
  content: '🎓';
  position: absolute;
  right: -6px; bottom: -18px;
  font-size: 92px;
  opacity: 0.16;
  transform: rotate(-8deg);
}
.cp-promo h2 {
  font-size: 21px; font-weight: 700; line-height: 1.25;
  color: #fff; max-width: 78%; position: relative; z-index: 1;
}
.cp-promo p {
  margin: 6px 0 16px; font-size: 13px; color: rgba(255,255,255,0.82);
  position: relative; z-index: 1;
}
.cp-promo-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: #12101D; color: var(--accent);
  border: none; border-radius: 10px;
  padding: 10px 16px;
  font-size: 13.5px; font-weight: 700;
  cursor: pointer;
  position: relative; z-index: 1;
}

/* ===== Yard teaser ===== */
.cp-yard-teaser {
  margin: 14px 16px 0;
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 13px 14px;
  cursor: pointer;
}
.cp-yard-avatars { display: flex; flex-shrink: 0; }
.cp-yard-avatars span {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  border: 2px solid var(--surface);
  margin-left: -10px;
}
.cp-yard-avatars span:first-child { margin-left: 0; }
.cp-yard-teaser-text { flex: 1; min-width: 0; }
.cp-yard-teaser-text .title { font-size: 13.5px; font-weight: 700; }
.cp-yard-teaser-text .sub { font-size: 11.5px; color: var(--text3); margin-top: 1px; }
.cp-yard-teaser .chev { color: var(--text3); flex-shrink: 0; }
.cp-yard-teaser .chev svg { width: 18px; height: 18px; }

/* ===== Section header ===== */
.cp-section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 22px 16px 10px;
}
.cp-section-head h3 { font-size: 16px; font-weight: 700; }
.cp-section-head a { font-size: 12.5px; font-weight: 700; color: var(--accent); }

/* ===== Featured sellers ===== */
.cp-sellers-row {
  display: flex; gap: 16px;
  overflow-x: auto; scrollbar-width: none;
  padding: 4px 16px 6px;
}
.cp-sellers-row::-webkit-scrollbar { display: none; }
.cp-seller {
  flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
  width: 64px; text-align: center;
}
.cp-seller-av {
  width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  border: 2px solid var(--brand);
}
.cp-seller span { font-size: 11px; color: var(--text2); font-weight: 600; line-height: 1.2; }

/* ===== Store grid / product cards ===== */
.cp-store-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 6px 16px 8px;
}
.store-card {
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  padding: 0;
  display: flex;
  flex-direction: column;
  transition: transform .12s ease;
}
.store-card:active { transform: scale(0.97); }
.store-card-media {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
  overflow: hidden;
}
.store-like {
  position: absolute; top: 8px; right: 8px;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(9,7,20,.55);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.store-like svg { width: 15px; height: 15px; }
.store-card-body { padding: 10px 11px 12px; }
.store-price { font-weight: 800; font-size: 16px; color: var(--text); }
.store-title {
  font-size: 12.5px; color: var(--text2); margin: 3px 0 9px; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.store-seller { display: flex; align-items: center; gap: 6px; }
.store-av {
  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
}
.store-seller-name { font-size: 11px; color: var(--text3); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Bottom nav ===== */
.cp-bottom-nav {
  position: fixed;
  left: 50%; transform: translateX(-50%);
  bottom: 0;
  width: 100%; max-width: 480px;
  height: calc(var(--bottom-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(18, 16, 29, 0.92);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-around;
  z-index: 30;
}
.cp-nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: var(--text3);
  font-size: 10.5px; font-weight: 600;
  cursor: pointer; padding: 6px 10px;
}
.cp-nav-item svg { width: 22px; height: 22px; }
.cp-nav-item.active { color: var(--accent); }
.cp-nav-fab {
  width: 46px; height: 46px; border-radius: 14px;
  background: var(--accent);
  color: #1A1200;
  display: flex; align-items: center; justify-content: center;
  margin-top: -18px;
  box-shadow: 0 8px 20px rgba(251,191,36,0.4);
  border: 4px solid var(--bg);
  cursor: pointer;
}
.cp-nav-fab svg { width: 22px; height: 22px; }

@media (min-width: 481px) {
  .cp-bottom-nav { border-radius: 20px 20px 0 0; }
}

/* ===== Shared page header (non-home pages) ===== */
.cp-page-header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: calc(var(--safe-top) + 14px) 16px 12px;
  background: rgba(9, 7, 20, 0.88);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.cp-page-header h1 { font-size: 18px; font-weight: 700; }
.cp-page-header .brand-sub { font-size: 11.5px; color: var(--text3); font-weight: 500; margin-top: 1px; }

/* ===== Post / feed card (Yard) ===== */
.post-card {
  margin: 12px 16px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}
.post-card.pinned { background: linear-gradient(135deg, var(--brand-dark), var(--brand) 130%); border: none; }
.post-card.pinned .post-meta, .post-card.pinned .post-body { color: rgba(255,255,255,0.9); }
.post-card.pinned .post-name { color: #fff; }
.post-eyebrow {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  color: rgba(255,255,255,0.85);
  margin-bottom: 10px;
}
.post-author { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: #fff; overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.post-name { font-weight: 700; font-size: 14px; }
.post-meta { font-size: 12px; color: var(--text3); margin-top: 1px; }
.post-body { font-size: 14px; line-height: 1.5; color: var(--text2); }
.post-actions { display: flex; align-items: center; gap: 18px; margin-top: 12px; }
.post-action { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; color: var(--text3); background: none; border: none; cursor: pointer; }
.post-action svg { width: 16px; height: 16px; }
.post-action.active { color: var(--accent); }

.cp-fab {
  position: fixed; right: 20px; bottom: calc(var(--bottom-h) + var(--safe-bottom) + 16px);
  width: 52px; height: 52px; border-radius: 16px;
  background: var(--accent); color: #1A1200;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 24px rgba(251,191,36,0.4);
  border: none; cursor: pointer; z-index: 25;
  left: 50%; margin-left: 178px;
}
.cp-fab svg { width: 24px; height: 24px; }

/* ===== Chat list (Chat page) ===== */
.chat-search-wrap { padding: 12px 16px 6px; }
.chat-list { padding: 4px 0 12px; }
.chat-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.chat-row .avatar { width: 50px; height: 50px; font-size: 15px; position: relative; }
.chat-row-text { flex: 1; min-width: 0; }
.chat-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chat-row-top .name { font-weight: 700; font-size: 14.5px; }
.chat-row-top .time { font-size: 11px; color: var(--text3); flex-shrink: 0; }
.chat-row-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 3px; }
.chat-row-bottom .preview {
  font-size: 13px; color: var(--text3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chat-unread {
  min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px;
  background: var(--accent); color: #1A1200;
  font-size: 10.5px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.chat-listing-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 700; color: var(--brand);
  background: var(--brand-soft); border-radius: 6px; padding: 2px 6px; margin-top: 4px;
}

/* ===== Profile ===== */
.profile-cover {
  height: 110px;
  background: linear-gradient(135deg, var(--brand-dark), var(--brand) 130%);
  position: relative;
}
.profile-head { padding: 0 16px; margin-top: -38px; }
.profile-avatar {
  width: 84px; height: 84px; border-radius: 50%;
  border: 4px solid var(--bg);
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 800; color: #fff; overflow: hidden;
}
.profile-name-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.profile-name-row h2 { font-size: 19px; }
.verified-badge { width: 16px; height: 16px; background: #2563EB; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 9px; flex-shrink: 0; }
.profile-handle { font-size: 13px; color: var(--text3); margin-top: 2px; }
.profile-bio { font-size: 13.5px; color: var(--text2); margin-top: 8px; line-height: 1.5; }
.profile-stats { display: flex; gap: 22px; margin-top: 14px; padding: 0 16px; }
.profile-stat { }
.profile-stat b { font-size: 16px; font-weight: 800; display: block; }
.profile-stat span { font-size: 11.5px; color: var(--text3); }
.profile-actions { display: flex; gap: 10px; padding: 16px 16px 4px; }
.btn {
  font: inherit; font-size: 13.5px; font-weight: 700; border-radius: 12px;
  padding: 11px 14px; cursor: pointer; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-primary { background: var(--brand); color: #fff; border: none; flex: 1; }
.btn-ghost { background: var(--surface2); color: var(--text); }
.profile-menu { padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
.profile-menu-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 13px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
}
.profile-menu-item svg { width: 18px; height: 18px; color: var(--text3); flex-shrink: 0; }
.profile-menu-item .chev { margin-left: auto; width: 16px; height: 16px; color: var(--text3); }

/* ===== Create listing (Sell) ===== */
.form-wrap { padding: 16px; }
.type-toggle { display: flex; gap: 8px; margin-bottom: 18px; }
.type-toggle .btn { flex: 1; background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.type-toggle .btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text2); margin-bottom: 7px; }
.form-input, .form-textarea, .form-select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px 14px; font: inherit; font-size: 14px; color: var(--text); outline: none;
}
.form-textarea { resize: vertical; min-height: 90px; }
.upload-box {
  border: 1.5px dashed var(--border); border-radius: var(--radius-sm);
  padding: 26px 14px; text-align: center; color: var(--text3); font-size: 13px; font-weight: 600;
  cursor: pointer;
}
.upload-box svg { width: 26px; height: 26px; margin: 0 auto 8px; }
.upload-box.has-photos { padding: 14px; }
.photo-preview-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.photo-thumb { position: relative; width: 72px; height: 72px; border-radius: 10px; overflow: hidden; background: var(--surface2); }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-thumb .remove-photo-btn {
  position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%;
  background: rgba(9,7,20,.75); color: #fff; border: none; font-size: 12px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.photo-thumb .upload-progress {
  position: absolute; inset: 0; background: rgba(9,7,20,.6); color: #fff; font-size: 10.5px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.form-submit { width: 100%; background: var(--accent); color: #1A1200; border: none; border-radius: var(--radius-sm); padding: 15px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 6px; }

/* ===== Public profile view ===== */
.pv-message-btn { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; width: calc(100% - 32px); max-width: 448px; z-index: 20; }

/* ===== Auth ===== */
.auth-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: calc(var(--safe-top) + 32px) 24px 32px; display: flex; flex-direction: column; }
.auth-logo { width: 56px; height: 56px; border-radius: 16px; overflow: hidden; margin-bottom: 18px; box-shadow: 0 8px 22px rgba(124,58,237,0.4); }
.auth-logo img { width: 100%; height: 100%; object-fit: cover; }
.auth-shell h1 { font-size: 25px; font-weight: 700; }
.auth-shell .auth-sub { font-size: 14px; color: var(--text3); margin-top: 6px; }
.auth-tabs { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin: 24px 0 22px; }
.auth-tab { flex: 1; border: none; background: none; color: var(--text3); font: inherit; font-size: 13.5px; font-weight: 700; padding: 10px; border-radius: 9px; cursor: pointer; }
.auth-tab.active { background: var(--brand); color: #fff; }
.auth-view { display: none; flex-direction: column; gap: 16px; }
.auth-view.active { display: flex; }
.auth-foot { margin-top: 22px; text-align: center; font-size: 13px; color: var(--text3); }
.auth-foot a { color: var(--accent); font-weight: 700; }
.password-field { position: relative; }
.password-field .form-input { padding-right: 42px; }
.password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px; }
.password-toggle svg { width: 17px; height: 17px; }

/* University picker */
.uni-picker { position: relative; }
.uni-picker-input {
  display: flex; align-items: center; gap: 10px;
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px 14px; cursor: pointer;
}
.uni-picker-input input { flex: 1; border: none; background: none; outline: none; font: inherit; font-size: 14px; color: var(--text); }
.uni-picker-input svg { width: 16px; height: 16px; color: var(--text3); flex-shrink: 0; }
.uni-list {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30;

}
.uni-list.open { display: block; }
.uni-option { padding: 12px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; border-bottom: 1px solid var(--border); }
.uni-option:last-child { border-bottom: none; }
.uni-option:hover { background: var(--surface2); }
.uni-locked {
  display: flex; align-items: center; gap: 10px;
  background: var(--brand-soft); border: 1px solid var(--brand); border-radius: var(--radius-sm);

}
.uni-locked svg { width: 16px; height: 16px; color: var(--brand); flex-shrink: 0; }
.uni-locked .name { font-size: 14px; font-weight: 700; flex: 1; }
.uni-locked .note { font-size: 11px; color: var(--text3); }
.field-hint { font-size: 11.5px; color: var(--text3); margin-top: 6px; line-height: 1.4; }

/* ===== Notifications (Chats + Activity) ===== */
.notif-tabs { display: flex; gap: 6px; padding: 10px 16px 4px; }
.notif-tab {
  flex: 1; text-align: center; border: none; background: var(--surface2); color: var(--text2);
  font: inherit; font-size: 13px; font-weight: 700; padding: 10px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); position: relative;
}
.notif-tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.notif-tab .dot { position: absolute; top: 6px; right: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
.notif-panel { display: none; }
.notif-panel.active { display: block; }

.activity-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
}
.activity-icon {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  background: var(--surface2);
}
.activity-icon.money { background: rgba(52,211,153,0.16); }
.activity-icon.social { background: var(--brand-soft); }
.activity-text { flex: 1; font-size: 13.5px; color: var(--text2); line-height: 1.4; }
.activity-text b { color: var(--text); }
.activity-time { font-size: 11.5px; color: var(--text3); margin-top: 3px; }
.activity-row.unread { background: var(--brand-soft); }

/* ===== Landing page ===== */
.landing {
  max-width: 480px; margin: 0 auto; min-height: 100vh;
  background: radial-gradient(circle at 30% 0%, rgba(255,255,255,0.10), transparent 45%), linear-gradient(160deg, #6D28D9 0%, #7C3AED 42%, #9333EA 100%);
  padding: calc(var(--safe-top) + 16px) 20px 40px;
  position: relative; overflow: hidden;
}
.landing::before {
  content: '🎓'; position: absolute; top: 8%; left: -6%; font-size: 130px; opacity: 0.06; transform: rotate(-12deg);
}
.landing::after {
  content: '🎓'; position: absolute; bottom: 30%; right: -8%; font-size: 150px; opacity: 0.05; transform: rotate(10deg);
}
.landing-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: relative; z-index: 1; }
.landing-pill {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.14); color: #fff;
  border-radius: 999px; padding: 9px 14px; font-size: 12.5px; font-weight: 700;
  white-space: nowrap;
}
.landing-login { color: #fff; font-size: 14px; font-weight: 700; padding: 9px 6px; }
.landing-google-sm {
  display: flex; align-items: center; gap: 8px;
  background: #fff; color: var(--brand-dark);
  border-radius: 999px; padding: 9px 16px; font-size: 12.5px; font-weight: 700;
  white-space: nowrap; border: none; cursor: pointer;
}
.landing-google-sm img, .landing-google-lg img { width: 16px; height: 16px; }

.landing-hero { text-align: center; margin-top: 28px; position: relative; z-index: 1; }
.landing-hero img { width: 168px; margin: 0 auto; }

.landing-headline {
  font-size: 27px; font-weight: 800; color: #fff; text-align: center;
  line-height: 1.25; margin-top: 36px; position: relative; z-index: 1;
}
.landing-sub {
  font-size: 14.5px; color: rgba(255,255,255,0.82); text-align: center; line-height: 1.6;
  margin-top: 14px; position: relative; z-index: 1;
}
.landing-google-lg {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; background: #fff; color: var(--brand-dark);
  border: none; border-radius: 999px; padding: 16px; margin-top: 24px;
  font-size: 15px; font-weight: 800; cursor: pointer; position: relative; z-index: 1;
  box-shadow: 0 10px 26px rgba(0,0,0,0.2);
}

.landing-stats {
  display: flex; margin-top: 28px; background: rgba(255,255,255,0.10);
  border-radius: 18px; padding: 20px 10px; position: relative; z-index: 1;
}
.landing-stat { flex: 1; text-align: center; }
.landing-stat b { display: block; font-size: 21px; font-weight: 800; color: #fff; }
.landing-stat span { font-size: 12px; color: rgba(255,255,255,0.75); }

.landing-section-title {
  font-size: 20px; font-weight: 800; color: #fff; text-align: center;
  margin-top: 40px; position: relative; z-index: 1;
}
.landing-feature {
  display: flex; align-items: center; gap: 14px;
  background: rgba(255,255,255,0.08); border-radius: 16px;
  padding: 15px 16px; margin-top: 12px; position: relative; z-index: 1;
}
.landing-feature-icon {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  background: rgba(255,255,255,0.14);
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.landing-feature-text b { display: block; color: #fff; font-size: 14.5px; font-weight: 700; }
.landing-feature-text span { color: rgba(255,255,255,0.7); font-size: 12.5px; }

.landing-foot { text-align: center; margin-top: 34px; position: relative; z-index: 1; }
.landing-foot a { color: #fff; font-weight: 700; font-size: 13.5px; }

/* ===== Settings ===== */
.settings-section { padding: 18px 16px 4px; }
.settings-section-title { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.settings-group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.settings-row {
  display: flex; align-items: center; gap: 12px;
  padding: 14px; border-bottom: 1px solid var(--border);
}
.settings-row:last-child { border-bottom: none; }
.settings-row-text { flex: 1; min-width: 0; }
.settings-row-text b { display: block; font-size: 14px; font-weight: 700; }
.settings-row-text span { font-size: 12px; color: var(--text3); }
.settings-row .chev { width: 16px; height: 16px; color: var(--text3); flex-shrink: 0; }
.settings-row.link { cursor: pointer; }
.settings-row.danger b { color: var(--danger); }

.switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch-track {
  position: absolute; inset: 0; background: var(--surface3); border-radius: 999px; cursor: pointer;
  transition: background .15s;
}
.switch-track::before {
  content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px;
  background: #fff; border-radius: 50%; transition: transform .15s;
}
.switch input:checked + .switch-track { background: var(--brand); }
.switch input:checked + .switch-track::before { transform: translateX(18px); }

/* ===== Market (full browse page) ===== */
.market-tabs {
  display: flex; gap: 6px; padding: 12px 16px 4px;
  overflow-x: auto; scrollbar-width: none;
}
.market-tabs::-webkit-scrollbar { display: none; }
.market-tab {
  flex-shrink: 0; border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  font: inherit; font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 999px; cursor: pointer;
}
.market-tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.market-sort-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 2px; }
.market-sort-row select { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 12.5px; }
.market-count { font-size: 12px; color: var(--text3); }

/* ===== Swift ===== */
.swift-banner {
  margin: 14px 16px 0; padding: 13px 14px; border-radius: var(--radius-sm);
  background: rgba(251,191,36,0.12); border: 1px solid var(--accent); color: var(--accent);
  font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 8px;
}
.swift-card {
  margin: 14px 16px 0; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
}
.swift-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.swift-card p { font-size: 13px; color: var(--text2); margin: 0 0 12px; line-height: 1.5; }
.swift-status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700;
  border-radius: 999px; padding: 5px 12px; margin-bottom: 10px;
}
.swift-pin-row { display: flex; gap: 10px; margin-top: 10px; }
.swift-pin { flex: 1; background: var(--surface2); border-radius: 10px; padding: 10px; text-align: center; }
.swift-pin b { display: block; font-size: 18px; letter-spacing: .1em; }
.swift-pin span { font-size: 10.5px; color: var(--text3); }
.transport-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.transport-pill {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
}
.transport-pill.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.swift-toggle-row { display: flex; align-items: center; justify-content: space-between; }
.swift-earnings-row { display: flex; gap: 12px; margin-top: 14px; }
.swift-earnings-row div { flex: 1; background: var(--surface2); border-radius: 12px; padding: 12px; text-align: center; }
.swift-earnings-row b { display: block; font-size: 17px; font-weight: 800; }
.swift-earnings-row span { font-size: 11px; color: var(--text3); }
.order-req-card {
  background: var(--surface2); border-radius: 12px; padding: 12px; margin-top: 10px;
}
.order-req-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
.order-req-sub { font-size: 12px; color: var(--text3); margin-top: 3px; }
.order-req-actions { display: flex; gap: 8px; margin-top: 10px; }
.order-req-actions .btn { flex: 1; padding: 9px; font-size: 12.5px; }
.star-row { display: flex; gap: 6px; margin: 10px 0; }
.star-btn { background: none; border: none; font-size: 26px; cursor: pointer; opacity: .35; padding: 0; }
.star-btn.active { opacity: 1; }
.pin-entry-row { display: flex; gap: 8px; margin-top: 10px; }
.pin-entry-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 11px; font: inherit; font-size: 16px; letter-spacing: .2em; text-align: center; color: var(--text); }
.pin-entry-row button { flex-shrink: 0; }

/* ===== Listing detail ===== */
.listing-media {
  width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;
  font-size: 90px; position: relative;
}
.listing-body { padding: 18px 16px; }
.listing-price { font-size: 26px; font-weight: 800; }
.listing-title { font-size: 17px; font-weight: 700; margin-top: 6px; }
.listing-badges { display: flex; gap: 6px; margin-top: 8px; }
.listing-badge { font-size: 11px; font-weight: 700; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; color: var(--text2); }
.listing-desc { font-size: 13.5px; color: var(--text2); line-height: 1.6; margin-top: 14px; }
.listing-seller-row {
  display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.listing-seller-row .info { flex: 1; }
.listing-seller-row b { font-size: 13.5px; display: block; }
.listing-seller-row span { font-size: 11.5px; color: var(--text3); }
.listing-actions { display: flex; gap: 10px; margin-top: 18px; }
.listing-actions .btn { flex: 1; padding: 13px; font-size: 14px; }

/* ===== Swift map + dispute ===== */
.swift-map { width: 100%; height: 180px; border-radius: var(--radius-sm); overflow: hidden; margin-top: 12px; background: var(--surface2); }
.swift-report-btn {
  margin-top: 12px; width: 100%; background: none; border: 1px solid var(--danger); color: var(--danger);
  border-radius: var(--radius-sm); padding: 11px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
}
.locate-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
  border-radius: 10px; padding: 11px 12px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
}

/* ===== Admin ===== */
.admin-denied { text-align: center; padding: 60px 24px; color: var(--text3); }
.admin-stats-row { display: flex; gap: 10px; padding: 14px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.admin-stats-row::-webkit-scrollbar { display: none; }
.admin-stat-card { flex-shrink: 0; min-width: 108px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px; }
.admin-stat-card b { display: block; font-size: 20px; font-weight: 800; }
.admin-stat-card span { font-size: 11px; color: var(--text3); }
.admin-tabs { display: flex; gap: 6px; padding: 14px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.admin-tabs::-webkit-scrollbar { display: none; }
.admin-tab { flex-shrink: 0; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); font: inherit; font-size: 12.5px; font-weight: 700; padding: 9px 14px; border-radius: 999px; cursor: pointer; position: relative; }
.admin-tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.admin-tab .count { position: absolute; top: -6px; right: -6px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 800; min-width: 16px; height: 16px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
.admin-panel { display: none; padding: 12px 16px 4px; }
.admin-panel.active { display: block; }
.admin-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 14px; margin-bottom: 10px; }
.admin-item-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; font-weight: 700; }
.admin-item-sub { font-size: 12px; color: var(--text3); margin-top: 3px; }
.admin-item-body { font-size: 13px; color: var(--text2); margin-top: 8px; line-height: 1.5; }
.admin-item-actions { display: flex; gap: 8px; margin-top: 10px; }
.admin-item-actions .btn { flex: 1; padding: 9px; font-size: 12.5px; }
.admin-item-actions.wrap { flex-wrap: wrap; }
.admin-pill-btn {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  border-radius: 999px; padding: 7px 12px; font-size: 11.5px; font-weight: 700; cursor: pointer;
}
.admin-pill-btn.on { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
.admin-pill-btn.danger { color: var(--danger); }
.admin-pill-btn.danger.on { background: rgba(251,113,133,0.14); border-color: var(--danger); }
.admin-search-wrap { padding: 12px 16px 4px; }
.admin-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.admin-badge-tag { font-size: 9.5px; font-weight: 800; border-radius: 6px; padding: 2px 6px; text-transform: uppercase; letter-spacing: .02em; }
.admin-badge-tag.admin { background: rgba(167,139,250,0.18); color: var(--brand); }
.admin-badge-tag.ambassador { background: rgba(251,191,36,0.18); color: var(--accent); }
.admin-badge-tag.verified { background: rgba(52,211,153,0.18); color: var(--money); }
.admin-badge-tag.banned { background: rgba(251,113,133,0.18); color: var(--danger); }
.admin-empty { text-align: center; padding: 30px 10px; color: var(--text3); font-size: 13px; }

/* ===== Groups & Calls ===== */
.groups-search-wrap { padding: 12px 16px 4px; display: flex; gap: 8px; }
.group-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.group-avatar { width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0; background: linear-gradient(135deg, var(--brand), var(--brand-dark)); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.group-row-text { flex: 1; min-width: 0; }
.group-row-text b { font-size: 13.5px; display: block; }
.group-row-text span { font-size: 12px; color: var(--text3); }
.group-join-btn { background: var(--brand); color: #fff; border: none; border-radius: 999px; padding: 7px 14px; font-size: 11.5px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
.call-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.call-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; background: var(--surface2); flex-shrink: 0; }
.call-row-text { flex: 1; min-width: 0; }
.call-row-text b { font-size: 13.5px; display: block; }
.call-row-text span { font-size: 12px; color: var(--text3); }
.call-row-text span.missed { color: var(--danger); }
.call-time { font-size: 11px; color: var(--text3); }
.call-notice { margin: 12px 16px; background: var(--brand-soft); color: var(--brand); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 12px; font-weight: 600; line-height: 1.5; }

/* ===== Feedback ===== */
.fb-star-picker { display: flex; gap: 8px; margin: 6px 0 16px; }
.fb-star-picker button { background: none; border: none; font-size: 30px; opacity: .3; cursor: pointer; padding: 0; }
.fb-star-picker button.active { opacity: 1; }
.fb-toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.fb-toggle-row .settings-row-text b { font-size: 13.5px; }
.fb-toggle-row .settings-row-text span { font-size: 11.5px; color: var(--text3); }
.fb-filter-row { display: flex; gap: 6px; padding: 14px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.fb-filter-row::-webkit-scrollbar { display: none; }
.fb-filter-chip { flex-shrink: 0; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); font: inherit; font-size: 12.5px; font-weight: 700; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.fb-filter-chip.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.fb-card { margin: 10px 16px 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; }
.fb-card-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.fb-card-top .cat { font-size: 11px; font-weight: 700; color: var(--text3); }
.fb-status { font-size: 10px; font-weight: 800; border-radius: 999px; padding: 3px 8px; text-transform: capitalize; }

.fb-status.reviewed { background: rgba(37,99,235,0.14); color: #60A5FA; }

.fb-card h4 { font-size: 14.5px; font-weight: 700; margin-top: 6px; }
.fb-card p { font-size: 13px; color: var(--text2); margin: 6px 0 0; line-height: 1.5; }
.fb-card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.fb-upvote-btn { display: flex; align-items: center; gap: 5px; background: var(--surface2); border: 1px solid var(--border); color: var(--text2); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }

.fb-stars-sm { color: var(--accent); font-size: 12px; }

/* ===== Ambassador ===== */
.amb-hero {
  margin: 14px 16px 0; border-radius: var(--radius); padding: 22px 20px;
  background: linear-gradient(135deg, var(--brand-dark), var(--brand) 130%);
  position: relative; overflow: hidden;
}

.amb-code { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: .05em; }

.amb-share-row { display: flex; gap: 8px; margin-top: 14px; position: relative; z-index: 1; }
.amb-share-row button { flex: 1; background: rgba(255,255,255,.14); color: #fff; border: none; border-radius: 10px; padding: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }

// Shared Supabase client — loaded on every page after the Supabase UMD script.
// Uses the same project as the React app (public anon key, safe to expose client-side; RLS enforces access).
const SUPABASE_URL = 'https://zgzamthhfykhjaldosvb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnemFtdGhoZnlraGphbGRvc3ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0Nzc2NjksImV4cCI6MjA5NDA1MzY2OX0.YpH9Zn2a2XVDZnZIlWd4d4CxhUbkURZ_H7Yegw9vih4';

window.sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Shared select strings — mirrors src/lib/listings.js and src/lib/posts.js

window.CP.POST_SELECT = '*, profiles!posts_author_id_fkey(id, username, full_name, avatar_url, is_hub, is_hub_service)';

window.CP.fmtNaira = (n) => '₦' + Number(n || 0).toLocaleString();

window.CP.timeAgo = (iso) => {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 604800) return Math.floor(s / 86400) + 'd';
  return new Date(iso).toLocaleDateString();
};

window.CP.initials = (name) => (name || 'U').slice(0, 2).toUpperCase();
window.CP.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));


/**
 * Opens (or creates) a direct conversation between the current user and
 * otherUserId, checking both buyer/seller directions so two people never end
 * up with duplicate threads. Pass listingId to tie it to a specific item.
 * Returns the conversation id, then the caller should redirect to
 * chat-thread.html?id=<id>.
 */
window.CP.openOrCreateConversation = async function (meId, otherUserId, listingId = null) {
  if (!meId || !otherUserId || meId === otherUserId) return null;

  let existingQuery = window.sb.from('conversations').select('id')
    .or(`and(buyer_id.eq.${meId},seller_id.eq.${otherUserId}),and(buyer_id.eq.${otherUserId},seller_id.eq.${meId})`);
  existingQuery = listingId ? existingQuery.eq('listing_id', listingId) : existingQuery.is('listing_id', null);

  const { data: existing } = await existingQuery.maybeSingle();
  if (existing) return existing.id;

  const { data: created, error } = await window.sb.from('conversations')
    .insert({ buyer_id: meId, seller_id: otherUserId, listing_id: listingId })
    .select('id').single();

  if (error) { console.error('Conversation create error:', error); return null; }
  return created.id;
};

<script>
// Include on every protected page (Home, Yard, Notifications, Profile, Create).
// Redirects to auth.html if there's no session, loads the user's profile
// (university is locked in from signup), and fires 'cp-ready' once done.
(async () => {
  const { data: { session } } = await window.sb.auth.getSession();

  if (!session) {
    window.location.href = 'auth.html';
    return;
  }

  window.CP_USER = session.user;

  const { data: profile, error } = await window.sb
    .from('profiles')
    .select('*, universities(id, name)')
    .eq('id', session.user.id)
    .single();

  if (error) console.error('Profile load error:', error);
  window.CP_PROFILE = profile || null;

  // Banned accounts get bounced everywhere except the banned-notice page itself.
  const isBannedPage = window.location.pathname.endsWith('banned.html');
  if (!isBannedPage && profile?.is_banned) {
    window.location.href = 'banned.html';
    return;
  }

  // Google sign-ins skip the signup form's university step — send them to
  // onboarding until a school is locked in. (Skip this check on the
  // onboarding page itself to avoid a redirect loop.)
  const isOnboardingPage = window.location.pathname.endsWith('onboarding.html');
  if (!isOnboardingPage && profile && !profile.university_id) {
    window.location.href = 'onboarding.html';
    return;
  }

  // Fill in university name wherever it's referenced in the header
  const uniName = profile?.universities?.name || profile?.institution_name || 'Your Campus';
  document.querySelectorAll('[data-uni-name]').forEach(el => { el.textContent = uniName; });

  // Keep "last seen" fresh so chat headers can show online / last-seen.
  window.sb.from('profiles').update({ last_seen_at: new Date().toISOString() })
    .eq('id', session.user.id).then(() => {}, () => {});

  document.dispatchEvent(new CustomEvent('cp-ready', { detail: { user: session.user, profile } }));
})();

// Sign out helper, wired up from Profile page
window.CP_signOut = async () => {
  await window.sb.auth.signOut();
  window.location.href = 'auth.html';
};

// ---- Global incoming-call ring (every page that loads this guard) ----
(async () => {
  const { data: { session } } = await window.sb.auth.getSession();
  if (!session || window.location.pathname.endsWith('call.html')) return;

  let ringAudio = null;
  function startRingtone() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const beep = () => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 660; g.gain.value = 0.08;
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + 0.7);
      };
      beep();
      ringAudio = { ctx, loop: setInterval(beep, 1600) };
    } catch (_) {}
  }
  function stopRingtone() {
    if (!ringAudio) return;
    clearInterval(ringAudio.loop);
    try { ringAudio.ctx.close(); } catch (_) {}
    ringAudio = null;
  }

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  window.sb.channel(`ring-${session.user.id}`)
    .on('broadcast', { event: 'incoming' }, ({ payload }) => {
      if (document.getElementById('incomingCallOverlay')) return; // already ringing
      const name = payload.callerName || 'Camplugie user';
      const overlay = document.createElement('div');
      overlay.id = 'incomingCallOverlay';
      overlay.className = 'incoming-call';
      overlay.innerHTML = `
        <div class="avatar">${esc(name.slice(0, 2).toUpperCase())}</div>
        <h2>${esc(name)}</h2>
        <p>${payload.video ? 'Incoming video call…' : 'Incoming Camplugie call…'}</p>
        <div class="row">
          <button class="call-ctl end" id="declineCallBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.42 12.42 0 0 0 3.81.61 2 2 0 0 1 2 2V21a2 2 0 0 1-2 2h-1C7.61 23 1 16.39 1 8V7a2 2 0 0 1 2-2h3.5a2 2 0 0 1 2 2 12.42 12.42 0 0 0 .61 3.81 2 2 0 0 1-.45 2.11z"/></svg>
            <span>Decline</span>
          </button>
          <button class="call-ctl accept" id="acceptCallBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span>Answer</span>
          </button>
        </div>`;
      document.body.appendChild(overlay);
      startRingtone();
      if (navigator.vibrate) navigator.vibrate([400, 250, 400, 250, 400]);

      const cleanup = () => { stopRingtone(); overlay.remove(); if (navigator.vibrate) navigator.vibrate(0); };

      document.getElementById('acceptCallBtn').addEventListener('click', () => {
        cleanup();
        window.location.href = `call.html?peer=${payload.callerId}&name=${encodeURIComponent(name)}` +
          `&role=callee&channel=${payload.callChannel}&mode=${payload.video ? 'video' : 'audio'}&auto=1`;
      });

      document.getElementById('declineCallBtn').addEventListener('click', async () => {
        const ch = window.sb.channel(payload.callChannel);
        await ch.subscribe();
        ch.send({ type: 'broadcast', event: 'signal', payload: { kind: 'declined', from: session.user.id } });
        setTimeout(() => window.sb.removeChannel(ch), 500);
        cleanup();
      });

      setTimeout(() => { if (document.body.contains(overlay)) cleanup(); }, 35000);
    })
    .subscribe();
})();
</script>
<script>
let myUserId = null;
let myUniversityId = null;

document.querySelectorAll('.groups-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.groups-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const mine = btn.dataset.tab === 'mine';
    document.getElementById('myGroupsPanel').style.display = mine ? 'block' : 'none';
    document.getElementById('discoverPanel').style.display = mine ? 'none' : 'block';
    if (!mine) loadDiscover();
  });
});

async function loadMyGroups() {
  const panel = document.getElementById('myGroupsPanel');

  const { data: memberRows, error: memberErr } = await window.sb
    .from('group_members').select('group_id').eq('user_id', myUserId);
  if (memberErr) { console.error('loadMyGroups (group_members):', memberErr); panel.innerHTML = `<div class="admin-empty">Couldn't load your groups. (${CP.esc(memberErr.message || memberErr.code || 'unknown error')})</div>`; return; }

  const groupIds = (memberRows || []).map(r => r.group_id);
  let groups = [];
  if (groupIds.length) {
    const { data: groupRows, error: groupErr } = await window.sb
      .from('groups').select('id, name, description, avatar_url, member_count').in('id', groupIds);
    if (groupErr) { console.error('loadMyGroups (groups):', groupErr); panel.innerHTML = `<div class="admin-empty">Couldn't load your groups. (${CP.esc(groupErr.message || groupErr.code || 'unknown error')})</div>`; return; }
    groups = groupRows || [];
  }

  if (!groups.length) { panel.innerHTML = `<div class="admin-empty">You haven't joined any groups yet — check Discover or create one.</div>`; return; }

  panel.innerHTML = groups.map(g => `
    <div class="group-row" data-id="${g.id}">
      <div class="avatar">${g.avatar_url ? `<img src="${g.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:14px">` : window.CP.initials(g.name)}</div>
      <div class="group-row-text"><b>${CP.esc(g.name)}</b><span>${g.member_count || 1} members</span></div>
    </div>
  `).join('');

  panel.querySelectorAll('.group-row').forEach(row => {
    row.addEventListener('click', () => { window.location.href = `group-thread.html?id=${row.dataset.id}`; });
  });
}

async function loadDiscover() {
  const panel = document.getElementById('discoverPanel');
  panel.innerHTML = `<div class="admin-empty">Loading…</div>`;
  const { data: myGroupIds } = await window.sb.from('group_members').select('group_id').eq('user_id', myUserId);
  const joinedIds = (myGroupIds || []).map(r => r.group_id);

  const { data, error } = await window.sb
    .from('groups').select('id, name, description, avatar_url, member_count')
    .eq('university_id', myUniversityId).eq('is_active', true).eq('is_private', false)
    .order('member_count', { ascending: false }).limit(30);

  if (error) { console.error(error); panel.innerHTML = `<div class="admin-empty">Couldn't load groups.</div>`; return; }
  const groups = (data || []).filter(g => !joinedIds.includes(g.id));
  if (!groups.length) { panel.innerHTML = `<div class="admin-empty">No public groups to discover right now.</div>`; return; }

  panel.innerHTML = groups.map(g => `
    <div class="group-discover-card" data-id="${g.id}">
      <div class="avatar">${g.avatar_url ? `<img src="${g.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">` : window.CP.initials(g.name)}</div>
      <div class="info"><b>${CP.esc(g.name)}</b><span>${g.member_count || 1} members</span></div>
      <button class="join-group-btn">Join</button>
    </div>
  `).join('');

  panel.querySelectorAll('.join-group-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const groupId = e.target.closest('.group-discover-card').dataset.id;
      btn.disabled = true; btn.textContent = 'Joining…';
      const { error } = await window.sb.from('group_members').upsert(
        { group_id: groupId, user_id: myUserId, role: 'member', can_send_messages: true },
        { onConflict: 'group_id,user_id', ignoreDuplicates: true }
      );
      if (error) { console.error(error); alert('Could not join.'); btn.disabled = false; btn.textContent = 'Join'; return; }
      window.location.href = `group-thread.html?id=${groupId}`;
    });
  });
}

// ---- Join by invite code ----
document.getElementById('joinCodeBtn').addEventListener('click', async () => {
  const code = document.getElementById('inviteCodeInput').value.trim();
  if (!code) return;
  const { data: group, error } = await window.sb.from('groups').select('id').eq('invite_code', code).maybeSingle();
  if (error || !group) { alert('Invalid invite code.'); return; }
  await window.sb.from('group_members').upsert(
    { group_id: group.id, user_id: myUserId, role: 'member', can_send_messages: true },
    { onConflict: 'group_id,user_id', ignoreDuplicates: true }
  );
  window.location.href = `group-thread.html?id=${group.id}`;
});

// ---- Create group ----
document.getElementById('createGroupBtn').addEventListener('click', () => { document.getElementById('createGroupOverlay').style.display = 'flex'; });
document.getElementById('cancelCreateGroup').addEventListener('click', () => { document.getElementById('createGroupOverlay').style.display = 'none'; });

document.getElementById('createGroupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('grpName').value.trim();
  const description = document.getElementById('grpDesc').value.trim();
  const isPrivate = document.getElementById('grpPrivate').checked;
  if (!name) return;

  const inviteCode = `camplugie${Math.floor(10000 + Math.random() * 90000)}`;
  const { data: group, error } = await window.sb.from('groups').insert({
    name, description, creator_id: myUserId, university_id: myUniversityId,
    is_private: isPrivate, invite_code: inviteCode, is_active: true, member_count: 1,
    created_at: new Date().toISOString(),
  }).select().single();

  if (error) { console.error(error); alert('Could not create group.'); return; }

  // Add the creator as a member. Falls back to plainer rows if optional columns or the
  // unique constraint behind upsert are missing; group-thread.html repairs anything left.
  const memberAttempts = [
    { group_id: group.id, user_id: myUserId, role: 'creator', can_send_messages: true, can_add_members: true, can_remove_members: true },
    { group_id: group.id, user_id: myUserId, role: 'creator', can_send_messages: true },
    { group_id: group.id, user_id: myUserId, role: 'creator' },
  ];
  for (const row of memberAttempts) {
    const { error: mErr } = await window.sb.from('group_members').insert(row);
    if (!mErr || mErr.code === '23505') break;
    console.error('Creator membership insert failed:', mErr);
  }

  window.location.href = `group-thread.html?id=${group.id}`;
});

document.addEventListener('cp-ready', (e) => {
  myUserId = e.detail.user.id;
  myUniversityId = e.detail.profile?.university_id;
  loadMyGroups();
});

</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
