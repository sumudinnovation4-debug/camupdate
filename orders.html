<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camplugie — Your food orders</title>
<link rel="stylesheet" href="style.css">
<style>
.food-order-card { margin: 14px 16px; padding: 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }
.food-order-card h3 { margin: 0 0 4px; font-size: 15px; }
.food-order-status { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface2); color: var(--text2); margin-bottom: 8px; }
.food-order-items { font-size: 12.5px; color: var(--text3); margin: 6px 0 10px; }
.food-order-note { font-size: 12px; color: var(--text2); margin: 0 0 10px; }
.food-order-card button { width: 100%; margin-top: 6px; }
.orders-tabs { display: flex; gap: 8px; padding: 12px 16px 0; }
.orders-tab { flex: 1; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); font: inherit; font-size: 13px; font-weight: 700; padding: 10px; border-radius: 10px; cursor: pointer; }
.orders-tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
</style>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#7C3AED">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Camplugie">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
</head>
<body>

<div class="app-shell" style="padding-bottom:30px">
  <header class="cp-page-header">
    <a class="icon-btn" href="cart.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <h1>Food orders</h1>
    <span style="width:38px"></span>
  </header>

  <div class="orders-tabs">
    <button class="orders-tab active" id="buyingTabBtn">Buying</button>
    <button class="orders-tab" id="sellingTabBtn">Selling</button>
  </div>

  <div id="ordersList"><p style="text-align:center;color:var(--text3);font-size:13px;margin-top:20px">Loading…</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="config.js"></script>
<script src="payments.js"></script>
<script>
window.CP = window.CP || {};
// Escapes anything user-controlled before it goes into HTML. Listing titles,
// usernames, comments and dispute notes are all free text a student typed —
// without this, "<img src=x onerror=...>" in a username runs in everyone's
// browser, including the admin dashboard.
window.CP.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const SUPABASE_URL = 'https://zgzamthhfykhjaldosvb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnemFtdGhoZnlraGphbGRvc3ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0Nzc2NjksImV4cCI6MjA5NDA1MzY2OX0.YpH9Zn2a2XVDZnZIlWd4d4CxhUbkURZ_H7Yegw9vih4';
window.sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
window.CP = window.CP || {};
window.CP.fmtNaira = (n) => '₦' + Number(n || 0).toLocaleString();
</script>
<script>
const STATUS_LABEL = {
  awaiting_payment: 'Awaiting payment', paid: 'Preparing your order',
  preparing: 'Preparing your order', delivered: 'Delivered — confirm to release payment',
  released: 'Complete', refunded: 'Refunded', cancelled: 'Cancelled',
};
// Seller sees their own side of the same statuses, worded for a vendor
const SELLER_STATUS_LABEL = {
  awaiting_payment: 'Awaiting payment', paid: 'New — needs preparing',
  preparing: 'Preparing', delivered: 'Delivered — waiting on buyer to confirm',
  released: 'Paid out', refunded: 'Refunded', cancelled: 'Cancelled',
};

let myUserId = null;
let activeTab = 'buying';

(async () => {
  const { data: { session } } = await window.sb.auth.getSession();
  if (!session) { window.location.href = 'auth.html'; return; }
  myUserId = session.user.id;
  loadOrders();
})();

document.getElementById('buyingTabBtn').addEventListener('click', () => {
  activeTab = 'buying';
  document.getElementById('buyingTabBtn').classList.add('active');
  document.getElementById('sellingTabBtn').classList.remove('active');
  loadOrders();
});
document.getElementById('sellingTabBtn').addEventListener('click', () => {
  activeTab = 'selling';
  document.getElementById('sellingTabBtn').classList.add('active');
  document.getElementById('buyingTabBtn').classList.remove('active');
  loadOrders();
});

async function loadOrders() {
  if (activeTab === 'buying') return loadBuyingOrders();
  return loadSellingOrders();
}

async function loadBuyingOrders() {
  const list = document.getElementById('ordersList');
  list.innerHTML = `<p style="text-align:center;color:var(--text3);font-size:13px;margin-top:20px">Loading…</p>`;
  const { data: orders, error } = await window.sb
    .from('food_orders').select('*, profiles:profiles!food_orders_seller_id_fkey(username, full_name)')
    .eq('buyer_id', myUserId).order('created_at', { ascending: false });

  if (error) { list.innerHTML = `<p style="text-align:center;color:var(--danger);font-size:13px;margin-top:20px">Couldn't load orders: ${CP.esc(error.message)}</p>`; return; }
  if (!orders || !orders.length) {
    list.innerHTML = `<p style="text-align:center;color:var(--text3);font-size:13px;margin-top:20px">No food orders yet.</p>`;
    return;
  }

  list.innerHTML = orders.map(o => `
    <div class="food-order-card" data-id="${o.id}">
      <span class="food-order-status">${STATUS_LABEL[o.status] || o.status}</span>
      <h3>${CP.esc(o.profiles?.full_name || o.profiles?.username || 'Vendor')}</h3>
      <div class="food-order-items">${(o.items || []).map(i => `${i.qty}× ${CP.esc(i.title)}`).join(', ')} · ${window.CP.fmtNaira(o.amount_kobo / 100)}</div>
      ${o.status === 'delivered' || o.status === 'paid' ? `<button class="form-submit" data-confirm="${o.id}">✅ Confirm received</button>` : ''}
      ${o.status === 'paid' ? `<button class="form-submit" data-cancel="${o.id}" style="background:var(--danger)">Cancel &amp; refund</button>` : ''}
    </div>
  `).join('');

  list.querySelectorAll('[data-confirm]').forEach(btn => btn.addEventListener('click', async (e) => {
    if (!confirm('Confirm you received this order? This releases payment to the vendor.')) return;
    e.target.disabled = true; e.target.textContent = 'Releasing…';
    try { await window.CPPay.releaseFoodOrder(e.target.dataset.confirm); loadOrders(); }
    catch (err) { alert(err.message || 'Could not release payment'); e.target.disabled = false; }
  }));
  list.querySelectorAll('[data-cancel]').forEach(btn => btn.addEventListener('click', async (e) => {
    if (!confirm('Cancel this order and get refunded?')) return;
    e.target.disabled = true; e.target.textContent = 'Refunding…';
    try { await window.CPPay.cancelAndRefundFood(e.target.dataset.cancel); loadOrders(); }
    catch (err) { alert(err.message || 'Refund failed'); e.target.disabled = false; }
  }));
}

async function loadSellingOrders() {
  const list = document.getElementById('ordersList');
  list.innerHTML = `<p style="text-align:center;color:var(--text3);font-size:13px;margin-top:20px">Loading…</p>`;
  const { data: orders, error } = await window.sb
    .from('food_orders').select('*, profiles:profiles!food_orders_buyer_id_fkey(username, full_name)')
    .eq('seller_id', myUserId).order('created_at', { ascending: false });

  if (error) { list.innerHTML = `<p style="text-align:center;color:var(--danger);font-size:13px;margin-top:20px">Couldn't load orders: ${CP.esc(error.message)}</p>`; return; }
  if (!orders || !orders.length) {
    list.innerHTML = `<p style="text-align:center;color:var(--text3);font-size:13px;margin-top:20px">No orders on your food listings yet.</p>`;
    return;
  }

  list.innerHTML = orders.map(o => `
    <div class="food-order-card" data-id="${o.id}">
      <span class="food-order-status">${SELLER_STATUS_LABEL[o.status] || o.status}</span>
      <h3>${CP.esc(o.profiles?.full_name || o.profiles?.username || 'Buyer')}</h3>
      <div class="food-order-items">${(o.items || []).map(i => `${i.qty}× ${CP.esc(i.title)}`).join(', ')} · ${window.CP.fmtNaira(o.amount_kobo / 100)}</div>
      ${o.dropoff_note ? `<p class="food-order-note">📍 Deliver to: ${o.dropoff_note}</p>` : ''}
      ${o.status === 'paid' ? `<button class="form-submit" data-deliver="${o.id}">🛵 Mark delivered</button>` : ''}
    </div>
  `).join('');

  list.querySelectorAll('[data-deliver]').forEach(btn => btn.addEventListener('click', async (e) => {
    e.target.disabled = true; e.target.textContent = 'Updating…';
    const { error: updateError } = await window.sb.from('food_orders').update({ status: 'delivered', updated_at: new Date().toISOString() }).eq('id', e.target.dataset.deliver);
    if (updateError) { alert(updateError.message || 'Could not update order'); e.target.disabled = false; e.target.textContent = '🛵 Mark delivered'; return; }
    loadOrders();
  }));
}
</script>
<script>
// Service worker: required for the Android install prompt and for the
// Play Store TWA build. Registered after load so it never delays first paint.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
<script src="incoming-call.js?v=1"></script>
</body>
</html>
