let pickupPin = null;
let dropoffPin = null;
let pickupMap, dropoffMap, pickupMarker, dropoffMarker;
let campusCenter = null;

function initPicker(mapId, statusId, onSet) {
  const startCenter = campusCenter ? [campusCenter.lat, campusCenter.lng] : [7.5189, 4.5286];
  const map = L.map(mapId, { zoomControl: false, attributionControl: false }).setView(startCenter, 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, subdomains: 'abc', attribution: '&copy; OpenStreetMap' }).addTo(map);
  L.control.attribution({ prefix: false, position: 'bottomright' }).addTo(map);
  let marker = null;
  map.on('click', (e) => {
    const pin = { lat: e.latlng.lat, lng: e.latlng.lng };
    if (marker) marker.setLatLng(e.latlng); else marker = L.marker(e.latlng).addTo(map);
    document.getElementById(statusId).textContent = `📍 Pin set — ${pin.lat.toFixed(5)}, ${pin.lng.toFixed(5)}`;
    document.getElementById(statusId).className = 'loc-picker-status set';
    onSet(pin, marker);
  });
  return { map, setPin: (pin) => {
    const latlng = [pin.lat, pin.lng];
    if (marker) marker.setLatLng(latlng); else marker = L.marker(latlng).addTo(map);
    map.setView(latlng, 16);
    document.getElementById(statusId).textContent = `📍 Pin set — ${pin.lat.toFixed(5)}, ${pin.lng.toFixed(5)}`;
    document.getElementById(statusId).className = 'loc-picker-status set';
  }};
}

function updateFeeDisplay() {
  const { fee, breakdown, distM } = computeFee(pickupPin, dropoffPin, campusCenter);
  document.getElementById('feeAutoBadge').style.display = (pickupPin && dropoffPin) ? 'inline-flex' : 'none';
  document.getElementById('feeBreakdown').innerHTML = breakdown.map(b =>
    `<div class="fee-breakdown-row"><span>${CP.esc(b.label)}</span><span>${window.CP.fmtNaira(b.amount)}</span></div>`
  ).join('') + `<div class="fee-breakdown-row total"><span>Total</span><span>${window.CP.fmtNaira(fee)}</span></div>`;
  return fee;
}

async function loadCampusCenter(universityId) {
  const { data } = await window.sb.from('universities').select('latitude, longitude').eq('id', universityId).maybeSingle();
  if (data?.latitude != null && data?.longitude != null) campusCenter = { lat: data.latitude, lng: data.longitude };
}

function bindRequestForm(userId, universityId) {
  pickupPin = null; dropoffPin = null;

  const pickupCtl = initPicker('pickupMap', 'pickupPinStatus', (pin) => { pickupPin = pin; document.getElementById('reqPickupLat').value = pin.lat; document.getElementById('reqPickupLng').value = pin.lng; updateFeeDisplay(); });
  const dropoffCtl = initPicker('dropoffMap', 'dropoffPinStatus', (pin) => { dropoffPin = pin; document.getElementById('reqDropoffLat').value = pin.lat; document.getElementById('reqDropoffLng').value = pin.lng; updateFeeDisplay(); });

  // If the pickup pin is already known from the linked listing, drop it immediately.
  if (linkedListing?.pickup_lat != null && linkedListing?.pickup_lng != null) {
    pickupPin = { lat: linkedListing.pickup_lat, lng: linkedListing.pickup_lng };
    pickupCtl.setPin(pickupPin);
    document.getElementById('reqPickupLat').value = pickupPin.lat;
    document.getElementById('reqPickupLng').value = pickupPin.lng;
  }

  document.getElementById('pickupLocateBtn').addEventListener('click', () => {
    if (!navigator.geolocation) { alert('Location not available on this device.'); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { pickupPin = { lat: pos.coords.latitude, lng: pos.coords.longitude }; pickupCtl.setPin(pickupPin); document.getElementById('reqPickupLat').value = pickupPin.lat; document.getElementById('reqPickupLng').value = pickupPin.lng; updateFeeDisplay(); },
      () => alert('Could not get your location — check permissions.')
    );
  });
  document.getElementById('dropoffLocateBtn').addEventListener('click', () => {
    if (!navigator.geolocation) { alert('Location not available on this device.'); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        dropoffPin = { lat: pos.coords.latitude, lng: pos.coords.longitude }; dropoffCtl.setPin(dropoffPin);
        document.getElementById('reqDropoffLat').value = dropoffPin.lat; document.getElementById('reqDropoffLng').value = dropoffPin.lng;
        if (!document.getElementById('reqDropoff').value) document.getElementById('reqDropoff').value = 'My current location';
        updateFeeDisplay();
      },
      () => alert('Could not get your location — check permissions.')
    );
  });

  updateFeeDisplay();

  document.getElementById('requestOrderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pickup_place = document.getElementById('reqPickup').value.trim();
    const dropoff_place = document.getElementById('reqDropoff').value.trim();
    const note = document.getElementById('reqNote').value.trim();
    const fee = updateFeeDisplay();
    const pickup_lat = parseFloat(document.getElementById('reqPickupLat').value) || null;
    const pickup_lng = parseFloat(document.getElementById('reqPickupLng').value) || null;
    const dropoff_lat = parseFloat(document.getElementById('reqDropoffLat').value) || null;
    const dropoff_lng = parseFloat(document.getElementById('reqDropoffLng').value) || null;

    const btn = e.target.querySelector('.form-submit');
    btn.disabled = true; btn.textContent = 'Posting…';

    const { error } = await window.sb.from('swift_orders').insert({
      university_id: universityId,
      buyer_id: userId,
      runner_id: null, // broadcast — open to any runner
      status: 'searching',
      errand_type: linkedListing ? 'listing_pickup' : 'errand',
      listing_id: linkedListing?.id || null,
      vendor_id: linkedListing?.seller_id || null,
      fee,
      pickup_place, dropoff_place,
      pickup_lat, pickup_lng, dropoff_lat, dropoff_lng,
      note: note || null,
      pickup_pin: genPin(),
      delivery_pin: genPin(),
      created_at: new Date().toISOString(),
    });

    btn.disabled = false; btn.textContent = 'Post request';
    if (error) { console.error('Order create error:', error); alert(`Could not post your request: ${error.message || 'please try again.'}`); return; }
    loadActiveOrder(userId);
  });
}

async function loadActiveOrder(userId) {
  const card = document.getElementById('activeOrderCard');
  const { data } = await window.sb
    .from('swift_orders').select('*')
    .eq('buyer_id', userId)
    .in('status', ACTIVE_STATUSES)
    .order('created_at', { ascending: false })
    .limit(1)
    .maybeSingle();

  if (!data) {
    card.style.display = 'block';
    card.className = 'swift-card';
    if (linkedListing && linkedListing.status !== 'sold') {
      card.innerHTML = renderListingLockedCard('The seller hasn\u2019t marked this as sold yet. Close the deal in chat first — once they mark it sold, you can request delivery here.');
      return;
    }
    if (linkedListing && linkedListing.status === 'sold' && linkedListing.sold_to !== userId) {
      card.innerHTML = renderListingLockedCard('This item was sold to someone else.');
      return;
    }
    card.className = '';
    card.innerHTML = renderRequestForm();
    bindRequestForm(userId, myUniversityId);
    return;
  }
  card.style.display = 'block';
  card.className = 'swift-card';

  if (data.status === 'delivered' && !data.buyer_rated) {
    card.innerHTML = `
      <div class="swift-status-pill">✅ Delivered</div>
      <h3>Rate your runner</h3>
      <p>How was your delivery?</p>
      ${starRow('buyerRate')}
      <textarea class="form-textarea" id="buyerRateComment" placeholder="Optional comment"></textarea>
      <button class="form-submit" id="buyerRateSubmit" style="margin-top:10px">Submit rating &amp; finish</button>
    `;
    let stars = 0;
    bindStarRow('buyerRateStars', (n) => { stars = n; });
    document.getElementById('buyerRateSubmit').addEventListener('click', async () => {
      if (!stars) { alert('Tap a star to rate.'); return; }
      const comment = document.getElementById('buyerRateComment').value.trim();
      await window.sb.from('swift_ratings').insert({
        order_id: data.id, rater_id: userId, ratee_id: data.runner_id, role: 'runner',
        stars, comment: comment || null, created_at: new Date().toISOString(),
      });
      await window.sb.from('swift_orders').update({ buyer_rated: true }).eq('id', data.id);
      await window.sb.from('swift_orders').update({ status: 'completed', completed_at: new Date().toISOString() }).eq('id', data.id);
      if (data.listing_id) {
        await window.sb.from('listings').update({ is_available: false, status: 'sold', sold_to: userId, sold_at: new Date().toISOString() }).eq('id', data.listing_id);
      }
      loadActiveOrder(userId);
    });
    return;
  }

  // A runner has claimed the job — buyer must fund escrow before pickup can start.
  if (data.status === 'accepted') {
    let { data: escrow } = await window.sb.from('escrow_orders').select('*').eq('swift_order_id', data.id).maybeSingle();
    if (!escrow) {
      const amount_kobo = window.CPPay.nairaToKobo(data.fee || 0);
      const { commission, payout } = { commission: Math.round(amount_kobo * 0.05), payout: amount_kobo - Math.round(amount_kobo * 0.05) };
      const { data: created } = await window.sb.from('escrow_orders').insert({
        kind: 'swift', swift_order_id: data.id, buyer_id: userId, seller_id: data.runner_id,
        amount_kobo, commission_kobo: commission, payout_kobo: payout,
        pickup_lat: data.pickup_lat, pickup_lng: data.pickup_lng,
        dropoff_lat: data.dropoff_lat, dropoff_lng: data.dropoff_lng,
        status: 'awaiting_payment',
      }).select().single();
      escrow = created;
    }
    if (escrow && escrow.status === 'awaiting_payment') {
      card.innerHTML = `
        <div class="swift-status-pill">🛵 Runner assigned</div>
        <h3>Pay to confirm delivery</h3>
        <p>${window.CP.fmtNaira(data.fee)} is held safely with us until you confirm delivery — your runner is only paid once the job is done.</p>
        <button class="form-submit" id="swiftPayBtn">Pay ${window.CP.fmtNaira(data.fee)}</button>
      `;
      document.getElementById('swiftPayBtn').addEventListener('click', async () => {
        const btn = document.getElementById('swiftPayBtn');
        btn.disabled = true; btn.textContent = 'Opening payment…';
        try {
          const { data: { session } } = await window.sb.auth.getSession();
          await window.CPPay.payEscrowOrder({ escrowOrderId: escrow.id, amountKobo: escrow.amount_kobo, email: session.user.email });
          loadActiveOrder(userId);
        } catch (e) {
          alert(e.message || 'Payment failed'); btn.disabled = false; btn.textContent = `Pay ${window.CP.fmtNaira(data.fee)}`;
        }
      });
      return;
    }
  }

  card.innerHTML = `
    <div class="swift-status-pill">🛵 ${STATUS_LABEL[data.status] || data.status}</div>
    <h3>${data.pickup_place || data.dropoff_place || 'Your delivery'}</h3>
    <p>${CP.esc(data.note || 'Track your delivery status here.')}</p>
    ${pinRow(data)}
    <div class="swift-map" id="buyerMap"></div>
    <p style="margin-top:10px;font-size:11.5px;color:var(--text3)">Give the pickup PIN to whoever's handing off the item, and the delivery PIN to your runner once it arrives.</p>
    ${disputeButton(data.id, userId, data.runner_id)}
  `;
  renderMap('buyerMap', data, data.runner_id, {
    role: 'buyer',
    activeLeg: data.status === 'picked_up' || data.status === 'delivered' ? 'dropoff' : 'pickup',
    pollRunnerId: data.runner_id,
  });
}

function renderApplicationForm() {
  return `
    <div class="swift-card">
      <h3>Become a Swift Runner</h3>
      <p>Deliver items around campus and earn on your own schedule. We'll review your application before you can go online.</p>
      <div class="transport-row" id="transportRow">
        ${TRANSPORTS.map(([key, label]) => `<button type="button" class="transport-pill${key === selectedTransport ? ' active' : ''}" data-key="${key}">${label}</button>`).join('')}
      </div>
      <form id="applyForm">
        <div class="form-group">
          <label class="form-label">Phone number</label>
          <input class="form-input" id="applyPhone" type="tel" placeholder="080…" required>
        </div>
        <div class="form-group">
          <label class="form-label">Anything we should know? (optional)</label>
          <textarea class="form-textarea" id="applyNote" placeholder="Availability, experience, etc."></textarea>
        </div>
        <button type="submit" class="form-submit">Submit application</button>
      </form>
    </div>
  `;
}

function renderPendingCard(app) {
  return `
    <div class="swift-card">
      <div class="swift-status-pill">⏳ Under review</div>
      <h3>Application submitted</h3>
      <p>We're reviewing your Swift Runner application (${TRANSPORTS.find(t => t[0] === app.transport_type)?.[1] || app.transport_type}). You'll be notified once it's approved.</p>
    </div>
  `;
}

function renderDeclinedCard(app) {
  return `
    <div class="swift-card">
      <div class="swift-status-pill" style="background:rgba(251,113,133,0.12);color:var(--danger)">✕ Not approved</div>
      <h3>Application declined</h3>
      <p>${app.decline_reason || "Your application wasn't approved this time."}</p>
      <button class="form-submit" id="reapplyBtn" style="margin-top:4px">Apply again</button>
    </div>
  `;
}

let locationWatchId = null;
let lastLocationSent = 0;

function startLocationBroadcast() {
  if (locationWatchId != null || !navigator.geolocation) return;
  locationWatchId = navigator.geolocation.watchPosition(
    (pos) => {
      const now = Date.now();
      if (now - lastLocationSent < 10000) return; // throttle to once/10s
      lastLocationSent = now;
      window.sb.from('swift_runners').update({
        current_lat: pos.coords.latitude, current_lng: pos.coords.longitude, updated_at: new Date().toISOString(),
      }).eq('user_id', myUserId).then(({ error }) => { if (error) console.error('Location update error:', error); });
    },
    (err) => console.warn('Location watch error:', err),
    { enableHighAccuracy: true, maximumAge: 5000 }
  );
}
function stopLocationBroadcast() {
  if (locationWatchId != null) { navigator.geolocation.clearWatch(locationWatchId); locationWatchId = null; }
}

async function renderRunnerDashboard(runner) {
  const { data: earningsRows } = await window.sb.from('swift_orders').select('fee').eq('runner_id', runner.id).not('completed_at', 'is', null);
  const totalEarned = (earningsRows || []).reduce((sum, o) => sum + (o.fee || 0), 0);

  const section = document.getElementById('runnerSection');
  section.innerHTML = `
    <div class="swift-card">
      <div class="swift-toggle-row">
        <div>
          <h3 style="margin-bottom:2px">You're a Swift Runner</h3>
          <p style="margin:0">${runner.is_online ? 'You are online and visible to buyers.' : 'You are offline.'}</p>
        </div>
        <label class="switch"><input type="checkbox" id="onlineToggle" ${runner.is_online ? 'checked' : ''}><span class="switch-track"></span></label>
      </div>
      <div class="swift-earnings-row">
        <div><b>${window.CP.fmtNaira(totalEarned)}</b><span>Total earned</span></div>
        <div><b>${(runner.avg_rating || 0).toFixed(1)}★</b><span>${runner.rating_count || 0} ratings</span></div>
      </div>
    </div>
    <div class="swift-card">
      <div class="swift-toggle-row">
        <div>
          <h3 style="margin-bottom:2px">Also selling something?</h3>
          <p style="margin:0">Runners can list products too — it's the same marketplace.</p>
        </div>
        <a class="btn btn-primary" href="create.html" style="flex:none;text-decoration:none;">+ List</a>
      </div>
    </div>
    <div class="swift-card">
      <h3>Incoming requests</h3>
      <div id="incomingOrders"><p style="color:var(--text3);font-size:13px;">Loading…</p></div>
    </div>
    <div id="runnerActiveOrderCard"></div>
  `;

  document.getElementById('onlineToggle').addEventListener('change', async (e) => {
    await window.sb.from('swift_runners').update({ is_online: e.target.checked, updated_at: new Date().toISOString() }).eq('user_id', myUserId);
    if (e.target.checked) startLocationBroadcast(); else stopLocationBroadcast();
  });
  if (runner.is_online) startLocationBroadcast();

  loadIncomingOrders(runner);
  loadRunnerActiveOrder(runner);
}

// Shared by the inline PIN form and the full-screen map's PIN box, so both
// paths behave identically. Returns true on success (caller can close the map).
async function confirmPickup(data, runner, entered) {
  if (String(entered) !== String(data.pickup_pin)) { alert('Wrong pickup PIN.'); return false; }
  await window.sb.from('swift_orders').update({ status: 'picked_up', updated_at: new Date().toISOString() }).eq('id', data.id);
  loadRunnerActiveOrder(runner);
  return true;
}

async function confirmDelivery(data, runner, entered) {
  if (String(entered) !== String(data.delivery_pin)) { alert('Wrong delivery PIN.'); return false; }
  await window.sb.from('swift_orders').update({ status: 'delivered', updated_at: new Date().toISOString() }).eq('id', data.id);
  // Correct PIN = proof of delivery -> auto-release escrow to the runner (minus 5% commission), no buyer tap needed.
  const { data: escrow } = await window.sb.from('escrow_orders').select('*').eq('swift_order_id', data.id).maybeSingle();
  if (escrow && escrow.status === 'paid_escrow') {
    try { await window.CPPay.swiftAutoRelease(escrow.id); }
    catch (err) { console.error('Auto-payout failed:', err); alert('Delivery confirmed, but payout failed — this order was flagged for manual payout.'); }
  }
  loadRunnerActiveOrder(runner);
  return true;
}

async function loadRunnerActiveOrder(runner) {
  const card = document.getElementById('runnerActiveOrderCard');
  if (!card) return;
  const { data } = await window.sb
    .from('swift_orders').select('*')
    .eq('runner_id', runner.id)
    .in('status', ['accepted', 'picked_up', 'delivered'])
    .order('created_at', { ascending: false })
    .limit(1)
    .maybeSingle();

  if (!data) { card.style.display = 'none'; card.innerHTML = ''; return; }
  card.style.display = 'block';
  card.className = 'swift-card';

  if (data.status === 'accepted') {
    const { data: escrow } = await window.sb.from('escrow_orders').select('status').eq('swift_order_id', data.id).maybeSingle();
    if (!escrow || escrow.status === 'awaiting_payment') {
      card.innerHTML = `
        <div class="swift-status-pill">⏳ Waiting on buyer</div>
        <h3>${data.pickup_place || 'Pickup location'}</h3>
        <p>The buyer hasn't funded escrow yet — you'll be able to enter the pickup PIN as soon as they pay.</p>
        ${disputeButton(data.id, myUserId, data.buyer_id)}
      `;
      return;
    }
    card.innerHTML = `
      <div class="swift-status-pill">📍 Heading to pickup</div>
      <h3>${data.pickup_place || 'Pickup location'}</h3>
      <p>Ask for the pickup PIN and enter it here to confirm you've collected the item.</p>
      <div class="pin-entry-row">
        <input type="text" id="pickupPinInput" placeholder="4-digit PIN" maxlength="4" inputmode="numeric">
        <button class="btn btn-primary" id="confirmPickupBtn">Confirm</button>
      </div>
      <div class="swift-map" id="runnerMap"></div>
      ${disputeButton(data.id, myUserId, data.buyer_id)}
    `;
    renderMap('runnerMap', data, null, {
      role: 'runner', activeLeg: 'pickup',
      onPinConfirm: (pin) => confirmPickup(data, runner, pin),
    });
    document.getElementById('confirmPickupBtn').addEventListener('click', () => {
      const entered = document.getElementById('pickupPinInput').value.trim();
      confirmPickup(data, runner, entered);
    });
    return;
  }

  if (data.status === 'picked_up') {
    card.innerHTML = `
      <div class="swift-status-pill">📦 Out for delivery</div>
      <h3>${data.dropoff_place || 'Drop-off location'}</h3>
      <p>Enter the delivery PIN from the buyer once you've handed it over.</p>
      <div class="pin-entry-row">
        <input type="text" id="deliveryPinInput" placeholder="4-digit PIN" maxlength="4" inputmode="numeric">
        <button class="btn btn-primary" id="confirmDeliveryBtn">Confirm</button>
      </div>
      <div class="swift-map" id="runnerMap"></div>
      ${disputeButton(data.id, myUserId, data.buyer_id)}
    `;
    renderMap('runnerMap', data, null, {
      role: 'runner', activeLeg: 'dropoff',
      onPinConfirm: (pin) => confirmDelivery(data, runner, pin),
    });
    document.getElementById('confirmDeliveryBtn').addEventListener('click', () => {
      const entered = document.getElementById('deliveryPinInput').value.trim();
      confirmDelivery(data, runner, entered);
    });
    return;
  }

  if (data.status === 'delivered' && !data.runner_rated) {
    card.innerHTML = `
      <div class="swift-status-pill">✅ Delivered</div>
      <h3>Rate the buyer</h3>
      ${starRow('runnerRate')}
      <textarea class="form-textarea" id="runnerRateComment" placeholder="Optional comment"></textarea>
      <button class="form-submit" id="runnerRateSubmit" style="margin-top:10px">Submit rating</button>
    `;
    let stars = 0;
    bindStarRow('runnerRateStars', (n) => { stars = n; });
    document.getElementById('runnerRateSubmit').addEventListener('click', async () => {
      if (!stars) { alert('Tap a star to rate.'); return; }
      const comment = document.getElementById('runnerRateComment').value.trim();
      await window.sb.from('swift_ratings').insert({
        order_id: data.id, rater_id: myUserId, ratee_id: data.buyer_id, role: 'buyer',
        stars, comment: comment || null, created_at: new Date().toISOString(),
      });
      await window.sb.from('swift_orders').update({ runner_rated: true }).eq('id', data.id);
      loadRunnerActiveOrder(runner);
    });
    return;
  }

  card.style.display = 'none';
}

async function loadIncomingOrders(runner) {
  const list = document.getElementById('incomingOrders');
  const { data, error } = await window.sb
    .from('swift_orders').select('*')
    .eq('university_id', myUniversityId)
    .in('status', ['searching', 'requested'])
    .or(`runner_id.eq.${runner.id},runner_id.is.null`)
    .order('created_at', { ascending: true })
    .limit(10);

  if (error) { console.error('Incoming orders error:', error); list.innerHTML = `<p style="color:var(--text3);font-size:13px;">Couldn't load requests.</p>`; return; }
  if (!data || !data.length) { list.innerHTML = `<p style="color:var(--text3);font-size:13px;">No delivery requests right now — check back soon.</p>`; return; }

  list.innerHTML = data.map(o => `
    <div class="order-req-card" data-id="${o.id}">
      <div class="order-req-top"><span>${o.pickup_place || 'Pickup on campus'}</span><span>${o.fee ? window.CP.fmtNaira(o.fee) : ''}</span></div>
      <div class="order-req-sub">${CP.esc(o.note || o.errand_type || 'Delivery request')} · ${window.CP.timeAgo(o.created_at)}</div>
      <div class="order-req-actions">
        <button class="btn btn-primary accept-order-btn">Accept</button>
        <button class="btn btn-ghost decline-order-btn">Decline</button>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.accept-order-btn').forEach(btn => btn.addEventListener('click', async (e) => {
    const orderId = e.target.closest('.order-req-card').dataset.id;
    const { error } = await window.sb.from('swift_orders').update({ runner_id: runner.id, status: 'accepted', updated_at: new Date().toISOString() }).eq('id', orderId);
    if (error) { alert("Couldn't accept — it may have been taken."); return; }
    loadIncomingOrders(runner);
    loadRunnerActiveOrder(runner);
  }));
  list.querySelectorAll('.decline-order-btn').forEach(btn => btn.addEventListener('click', (e) => {
    e.target.closest('.order-req-card').remove();
  }));
}

async function initRunnerSection() {
  const section = document.getElementById('runnerSection');

  const { data: runner } = await window.sb.from('swift_runners').select('*').eq('user_id', myUserId).maybeSingle();
  if (runner && runner.status !== 'banned') { renderRunnerDashboard(runner); return; }

  const { data: app } = await window.sb.from('swift_runner_applications').select('*').eq('user_id', myUserId).order('created_at', { ascending: false }).limit(1).maybeSingle();

  if (app && app.status === 'pending') { section.innerHTML = renderPendingCard(app); return; }
  if (app && app.status === 'declined') {
    section.innerHTML = renderDeclinedCard(app);
    document.getElementById('reapplyBtn').addEventListener('click', () => { section.innerHTML = renderApplicationForm(); bindApplyForm(); });
    return;
  }

  section.innerHTML = renderApplicationForm();
  bindApplyForm();
}

function bindApplyForm() {
  document.getElementById('transportRow').addEventListener('click', (e) => {
    const btn = e.target.closest('.transport-pill');
    if (!btn) return;
    selectedTransport = btn.dataset.key;
    document.querySelectorAll('.transport-pill').forEach(p => p.classList.toggle('active', p.dataset.key === selectedTransport));
  });

  document.getElementById('applyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const phone = document.getElementById('applyPhone').value.trim();
    const note = document.getElementById('applyNote').value.trim();
    if (!phone) return;

    const btn = e.target.querySelector('.form-submit');
    btn.disabled = true; btn.textContent = 'Submitting…';

    const { error } = await window.sb.from('swift_runner_applications').insert({
      user_id: myUserId, university_id: myUniversityId,
      phone, transport_type: selectedTransport, note: note || null,
      status: 'pending', created_at: new Date().toISOString(),
    });

    btn.disabled = false; btn.textContent = 'Submit application';
    if (error) { console.error('Application error:', error); alert('Could not submit — please try again.'); return; }
    initRunnerSection();
  });
}

document.addEventListener('cp-ready', async (e) => {
  myUserId = e.detail.user.id;
  myUniversityId = e.detail.profile?.university_id;
  if (!myUniversityId) return;

  linkedListing = await loadLinkedListing();
  await loadCampusCenter(myUniversityId);
  await loadCampusOpen(myUniversityId);
  await loadActiveOrder(myUserId);
  await initRunnerSection();
});

// Service worker: required for the Android install prompt and for the
// Play Store TWA build. Registered after load so it never delays first paint.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
