<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camplugie — Swift</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Clash+Display:wght@500;600;700&family=Satoshi:wght@400;500;700;900&display=swap');

/* ===== Design tokens (matches Camplugie's existing dark theme) ===== */
:root {
  --brand: #A78BFA;
  --brand-dark: #7C3AED;
  --brand-soft: rgba(167, 139, 250, 0.14);
  --accent: #FBBF24;
  --accent-soft: rgba(251, 191, 36, 0.14);
  --money: #34D399;
  --danger: #FB7185;

  --bg: #090714;
  --bg-gradient: radial-gradient(circle at 20% -10%, rgba(124,58,237,0.34), transparent 36%), linear-gradient(180deg, #0E0A1D 0%, #090714 100%);
  --surface: #12101D;
  --surface2: #1A1729;
  --surface3: #242039;
  --border: rgba(255,255,255,0.10);

  --text: #F8F6FF;
  --text2: #C9C3DE;
  --text3: #8D86AA;

  --nav-h: 58px;
  --bottom-h: 68px;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 14px 38px rgba(0,0,0,0.28);
  --shadow-lg: 0 24px 80px rgba(0,0,0,0.48);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg-gradient), var(--bg);
  color: var(--text);
  font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
}
h1, h2, h3, h4, .display {
  font-family: 'Clash Display', 'Satoshi', sans-serif;
  margin: 0;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
img { max-width: 100%; display: block; }

.app-shell {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  padding-bottom: calc(var(--bottom-h) + var(--safe-bottom) + 10px);
}

/* ===== Header ===== */
.cp-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(var(--safe-top) + 14px) 16px 12px;
  background: rgba(9, 7, 20, 0.88);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.cp-header-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cp-logo {
  width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(124,58,237,0.35);
}
.cp-logo img { width: 100%; height: 100%; object-fit: cover; }
.cp-header-text { min-width: 0; }
.cp-header-text .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.cp-header-text .brand-sub {
  font-size: 11.5px; color: var(--text3); font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cp-header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.icon-btn {
  position: relative;
  width: 38px; height: 38px; border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-badge {
  position: absolute; top: -4px; right: -4px;
  min-width: 16px; height: 16px; padding: 0 3px;
  border-radius: 999px;
  background: var(--danger);
  color: #fff;
  font-size: 10px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--bg);
}

/* ===== Search ===== */
.cp-search-wrap { padding: 14px 16px 4px; }
.cp-search {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0 16px;
  height: 44px;
}
.cp-search svg { width: 17px; height: 17px; color: var(--text3); flex-shrink: 0; }
.cp-search input {
  flex: 1; border: none; background: none; outline: none;
  font: inherit; font-size: 14.5px; color: var(--text);
  min-width: 0;
}
.cp-search input::placeholder { color: var(--text3); }

/* ===== Category chips ===== */
.cp-chiprow {
  display: flex; gap: 8px;
  overflow-x: auto; scrollbar-width: none;
  padding: 12px 16px 4px;
}
.cp-chiprow::-webkit-scrollbar { display: none; }
.cp-chip {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  border-radius: 999px;
  padding: 9px 16px;
  font-size: 13.5px; font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.cp-chip.active { background: var(--accent); color: #1A1200; border-color: var(--accent); }

/* ===== Promo banner ===== */
.cp-promo {
  margin: 14px 16px 0;
  border-radius: var(--radius);
  padding: 22px 20px;
  background: linear-gradient(135deg, var(--brand-dark), var(--brand) 120%);
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.cp-promo::after {
  content: '🎓';
  position: absolute;
  right: -6px; bottom: -18px;
  font-size: 92px;
  opacity: 0.16;
  transform: rotate(-8deg);
}
.cp-promo h2 {
  font-size: 21px; font-weight: 700; line-height: 1.25;
  color: #fff; max-width: 78%; position: relative; z-index: 1;
}
.cp-promo p {
  margin: 6px 0 16px; font-size: 13px; color: rgba(255,255,255,0.82);
  position: relative; z-index: 1;
}
.cp-promo-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: #12101D; color: var(--accent);
  border: none; border-radius: 10px;
  padding: 10px 16px;
  font-size: 13.5px; font-weight: 700;
  cursor: pointer;
  position: relative; z-index: 1;
}

/* ===== Yard teaser ===== */
.cp-yard-teaser {
  margin: 14px 16px 0;
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 13px 14px;
  cursor: pointer;
}
.cp-yard-avatars { display: flex; flex-shrink: 0; }
.cp-yard-avatars span {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  border: 2px solid var(--surface);
  margin-left: -10px;
}
.cp-yard-avatars span:first-child { margin-left: 0; }
.cp-yard-teaser-text { flex: 1; min-width: 0; }
.cp-yard-teaser-text .title { font-size: 13.5px; font-weight: 700; }
.cp-yard-teaser-text .sub { font-size: 11.5px; color: var(--text3); margin-top: 1px; }
.cp-yard-teaser .chev { color: var(--text3); flex-shrink: 0; }
.cp-yard-teaser .chev svg { width: 18px; height: 18px; }

/* ===== Section header ===== */
.cp-section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 22px 16px 10px;
}
.cp-section-head h3 { font-size: 16px; font-weight: 700; }
.cp-section-head a { font-size: 12.5px; font-weight: 700; color: var(--accent); }

/* ===== Featured sellers ===== */
.cp-sellers-row {
  display: flex; gap: 16px;
  overflow-x: auto; scrollbar-width: none;
  padding: 4px 16px 6px;
}
.cp-sellers-row::-webkit-scrollbar { display: none; }
.cp-seller {
  flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
  width: 64px; text-align: center;
}
.cp-seller-av {
  width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  border: 2px solid var(--brand);
}
.cp-seller span { font-size: 11px; color: var(--text2); font-weight: 600; line-height: 1.2; }

/* ===== Store grid / product cards ===== */
.cp-store-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 6px 16px 8px;
}
.store-card {
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  padding: 0;
  display: flex;
  flex-direction: column;
  transition: transform .12s ease;
}
.store-card:active { transform: scale(0.97); }
.store-card-media {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
  overflow: hidden;
}
.store-like {
  position: absolute; top: 8px; right: 8px;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(9,7,20,.55);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.store-like svg { width: 15px; height: 15px; }
.store-card-body { padding: 10px 11px 12px; }
.store-price { font-weight: 800; font-size: 16px; color: var(--text); }
.store-title {
  font-size: 12.5px; color: var(--text2); margin: 3px 0 9px; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.store-seller { display: flex; align-items: center; gap: 6px; }
.store-av {
  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
}
.store-seller-name { font-size: 11px; color: var(--text3); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Bottom nav ===== */
.cp-bottom-nav {
  position: fixed;
  left: 50%; transform: translateX(-50%);
  bottom: 0;
  width: 100%; max-width: 480px;
  height: calc(var(--bottom-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(18, 16, 29, 0.92);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-around;
  z-index: 30;
}
.cp-nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: var(--text3);
  font-size: 10.5px; font-weight: 600;
  cursor: pointer; padding: 6px 10px;
}
.cp-nav-item svg { width: 22px; height: 22px; }
.cp-nav-item.active { color: var(--accent); }
.cp-nav-fab {
  width: 46px; height: 46px; border-radius: 14px;
  background: var(--accent);
  color: #1A1200;
  display: flex; align-items: center; justify-content: center;
  margin-top: -18px;
  box-shadow: 0 8px 20px rgba(251,191,36,0.4);
  border: 4px solid var(--bg);
  cursor: pointer;
}
.cp-nav-fab svg { width: 22px; height: 22px; }

@media (min-width: 481px) {
  .cp-bottom-nav { border-radius: 20px 20px 0 0; }
}

/* ===== Shared page header (non-home pages) ===== */
.cp-page-header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: calc(var(--safe-top) + 14px) 16px 12px;
  background: rgba(9, 7, 20, 0.88);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.cp-page-header h1 { font-size: 18px; font-weight: 700; }
.cp-page-header .brand-sub { font-size: 11.5px; color: var(--text3); font-weight: 500; margin-top: 1px; }

/* ===== Post / feed card (Yard) ===== */
.post-card {
  margin: 12px 16px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}
.post-card.pinned { background: linear-gradient(135deg, var(--brand-dark), var(--brand) 130%); border: none; }
.post-card.pinned .post-meta, .post-card.pinned .post-body { color: rgba(255,255,255,0.9); }
.post-card.pinned .post-name { color: #fff; }
.post-eyebrow {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  color: rgba(255,255,255,0.85);
  margin-bottom: 10px;
}
.post-author { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: #fff; overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.post-name { font-weight: 700; font-size: 14px; }
.post-meta { font-size: 12px; color: var(--text3); margin-top: 1px; }
.post-body { font-size: 14px; line-height: 1.5; color: var(--text2); }
.post-actions { display: flex; align-items: center; gap: 18px; margin-top: 12px; }
.post-action { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; color: var(--text3); background: none; border: none; cursor: pointer; }
.post-action svg { width: 16px; height: 16px; }
.post-action.active { color: var(--accent); }
.post-action.liked { color: #EC4899; }

.post-media { margin: 10px 0; border-radius: 12px; overflow: hidden; }
.post-media img, .post-media video { width: 100%; max-height: 380px; object-fit: cover; display: block; }
.post-media.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.post-media.grid-2 img, .post-media.grid-2 video { max-height: 200px; }
.post-media.grid-3 { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.post-media.grid-3 > *:first-child { grid-row: span 2; }
.post-media.grid-3 img, .post-media.grid-3 video { max-height: 180px; height: 100%; }

/* Compose overlay */
.compose-overlay { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; }
.compose-header { display: flex; align-items: center; justify-content: space-between; padding: calc(var(--safe-top) + 14px) 16px 12px; border-bottom: 1px solid var(--border); }
.compose-header button.cancel { background: none; border: none; color: var(--text2); font-size: 14px; font-weight: 600; }
.compose-header button.post-submit { background: var(--accent); color: #1A1200; border: none; border-radius: 999px; padding: 9px 18px; font-size: 13.5px; font-weight: 800; cursor: pointer; }
.compose-header button.post-submit:disabled { opacity: .5; }
.compose-body { flex: 1; overflow-y: auto; padding: 16px; }
.compose-body textarea { width: 100%; border: none; background: none; outline: none; resize: none; color: var(--text); font: inherit; font-size: 16px; min-height: 100px; }
.compose-media-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.compose-media-thumb { position: relative; width: 84px; height: 84px; border-radius: 12px; overflow: hidden; background: var(--surface2); }
.compose-media-thumb img, .compose-media-thumb video { width: 100%; height: 100%; object-fit: cover; }
.compose-media-thumb .remove-media-btn { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: rgba(9,7,20,.75); color: #fff; border: none; font-size: 12px; cursor: pointer; }
.compose-footer { display: flex; gap: 16px; padding: 14px 16px calc(14px + var(--safe-bottom)); border-top: 1px solid var(--border); }
.compose-footer button { background: none; border: none; color: var(--brand); display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; cursor: pointer; }
.compose-footer svg { width: 20px; height: 20px; }

/* Comments overlay */
.comments-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(9,7,20,.85); display: flex; align-items: flex-end; }
.comments-sheet { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; margin: 0 auto; max-height: 80vh; display: flex; flex-direction: column; }
.comments-sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); }
.comments-sheet-header button { background: none; border: none; color: var(--text3); font-size: 20px; cursor: pointer; }
.comments-list { flex: 1; overflow-y: auto; padding: 8px 16px; }
.comment-row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.comment-row .avatar { width: 32px; height: 32px; font-size: 11px; flex-shrink: 0; }
.comment-row-text { flex: 1; }
.comment-row-text b { font-size: 12.5px; display: block; }
.comment-row-text span.time { font-size: 10.5px; color: var(--text3); }
.comment-row-text p { font-size: 13px; color: var(--text2); margin: 3px 0 0; }
.comments-input-row { display: flex; gap: 8px; padding: 12px 16px calc(12px + var(--safe-bottom)); border-top: 1px solid var(--border); }
.comments-input-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 11px 15px; font: inherit; font-size: 13.5px; color: var(--text); outline: none; }
.comments-input-row button { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.comments-input-row button svg { width: 16px; height: 16px; }

.cp-fab {
  position: fixed; right: 20px; bottom: calc(var(--bottom-h) + var(--safe-bottom) + 16px);
  width: 52px; height: 52px; border-radius: 16px;
  background: var(--accent); color: #1A1200;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 24px rgba(251,191,36,0.4);
  border: none; cursor: pointer; z-index: 25;
  left: 50%; margin-left: 178px;
}
.cp-fab svg { width: 24px; height: 24px; }

/* ===== Chat list (Chat page) ===== */
.chat-search-wrap { padding: 12px 16px 6px; }
.chat-list { padding: 4px 0 12px; }
.chat-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.chat-row .avatar { width: 50px; height: 50px; font-size: 15px; position: relative; }
.chat-row-text { flex: 1; min-width: 0; }
.chat-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chat-row-top .name { font-weight: 700; font-size: 14.5px; }
.chat-row-top .time { font-size: 11px; color: var(--text3); flex-shrink: 0; }
.chat-row-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 3px; }
.chat-row-bottom .preview {
  font-size: 13px; color: var(--text3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chat-unread {
  min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px;
  background: var(--accent); color: #1A1200;
  font-size: 10.5px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.chat-listing-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 700; color: var(--brand);
  background: var(--brand-soft); border-radius: 6px; padding: 2px 6px; margin-top: 4px;
}

/* ===== Profile ===== */
.profile-cover {
  height: 110px;
  background: linear-gradient(135deg, var(--brand-dark), var(--brand) 130%);
  position: relative;
}
.profile-head { padding: 0 16px; margin-top: -38px; }
.profile-avatar {
  width: 84px; height: 84px; border-radius: 50%;
  border: 4px solid var(--bg);
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 800; color: #fff; overflow: hidden;
}
.profile-name-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.profile-name-row h2 { font-size: 19px; }
.verified-badge { width: 16px; height: 16px; background: #2563EB; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 9px; flex-shrink: 0; }
.profile-handle { font-size: 13px; color: var(--text3); margin-top: 2px; }
.profile-bio { font-size: 13.5px; color: var(--text2); margin-top: 8px; line-height: 1.5; }
.profile-stats { display: flex; gap: 22px; margin-top: 14px; padding: 0 16px; }
.profile-stat { }
.profile-stat b { font-size: 16px; font-weight: 800; display: block; }
.profile-stat span { font-size: 11.5px; color: var(--text3); }
.profile-actions { display: flex; gap: 10px; padding: 16px 16px 4px; }
.btn {
  font: inherit; font-size: 13.5px; font-weight: 700; border-radius: 12px;
  padding: 11px 14px; cursor: pointer; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-primary { background: var(--brand); color: #fff; border: none; flex: 1; }
.btn-ghost { background: var(--surface2); color: var(--text); }
.profile-menu { padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
.profile-menu-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 13px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
}
.profile-menu-item svg { width: 18px; height: 18px; color: var(--text3); flex-shrink: 0; }
.profile-menu-item .chev { margin-left: auto; width: 16px; height: 16px; color: var(--text3); }

/* ===== Create listing (Sell) ===== */
.form-wrap { padding: 16px; }
.type-toggle { display: flex; gap: 8px; margin-bottom: 18px; }
.type-toggle .btn { flex: 1; background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.type-toggle .btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text2); margin-bottom: 7px; }
.form-input, .form-textarea, .form-select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px 14px; font: inherit; font-size: 14px; color: var(--text); outline: none;
}
.form-textarea { resize: vertical; min-height: 90px; }
.upload-box {
  border: 1.5px dashed var(--border); border-radius: var(--radius-sm);
  padding: 26px 14px; text-align: center; color: var(--text3); font-size: 13px; font-weight: 600;
  cursor: pointer;
}
.upload-box svg { width: 26px; height: 26px; margin: 0 auto 8px; }
.upload-box.has-photos { padding: 14px; }
.photo-preview-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.photo-thumb { position: relative; width: 72px; height: 72px; border-radius: 10px; overflow: hidden; background: var(--surface2); }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-thumb .remove-photo-btn {
  position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%;
  background: rgba(9,7,20,.75); color: #fff; border: none; font-size: 12px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.photo-thumb .upload-progress {
  position: absolute; inset: 0; background: rgba(9,7,20,.6); color: #fff; font-size: 10.5px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.form-submit { width: 100%; background: var(--accent); color: #1A1200; border: none; border-radius: var(--radius-sm); padding: 15px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 6px; }

/* ===== Public profile view ===== */
.pv-message-btn { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; width: calc(100% - 32px); max-width: 448px; z-index: 20; }

/* ===== Auth ===== */
.auth-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: calc(var(--safe-top) + 32px) 24px 32px; display: flex; flex-direction: column; }
.auth-logo { width: 56px; height: 56px; border-radius: 16px; overflow: hidden; margin-bottom: 18px; box-shadow: 0 8px 22px rgba(124,58,237,0.4); }
.auth-logo img { width: 100%; height: 100%; object-fit: cover; }
.auth-shell h1 { font-size: 25px; font-weight: 700; }
.auth-shell .auth-sub { font-size: 14px; color: var(--text3); margin-top: 6px; }
.auth-tabs { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin: 24px 0 22px; }
.auth-tab { flex: 1; border: none; background: none; color: var(--text3); font: inherit; font-size: 13.5px; font-weight: 700; padding: 10px; border-radius: 9px; cursor: pointer; }
.auth-tab.active { background: var(--brand); color: #fff; }
.auth-view { display: none; flex-direction: column; gap: 16px; }
.auth-view.active { display: flex; }
.auth-foot { margin-top: 22px; text-align: center; font-size: 13px; color: var(--text3); }
.auth-foot a { color: var(--accent); font-weight: 700; }
.password-field { position: relative; }
.password-field .form-input { padding-right: 42px; }
.password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px; }
.password-toggle svg { width: 17px; height: 17px; }

/* University picker */
.uni-picker { position: relative; }
.uni-picker-input {
  display: flex; align-items: center; gap: 10px;
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px 14px; cursor: pointer;
}
.uni-picker-input input { flex: 1; border: none; background: none; outline: none; font: inherit; font-size: 14px; color: var(--text); }
.uni-picker-input svg { width: 16px; height: 16px; color: var(--text3); flex-shrink: 0; }
.uni-list {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  max-height: 220px; overflow-y: auto; box-shadow: var(--shadow-lg);
  display: none;
}
.uni-list.open { display: block; }
.uni-option { padding: 12px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; border-bottom: 1px solid var(--border); }
.uni-option:last-child { border-bottom: none; }
.uni-option:hover { background: var(--surface2); }
.uni-locked {
  display: flex; align-items: center; gap: 10px;
  background: var(--brand-soft); border: 1px solid var(--brand); border-radius: var(--radius-sm);
  padding: 12px 14px;
}
.uni-locked svg { width: 16px; height: 16px; color: var(--brand); flex-shrink: 0; }
.uni-locked .name { font-size: 14px; font-weight: 700; flex: 1; }
.uni-locked .note { font-size: 11px; color: var(--text3); }
.field-hint { font-size: 11.5px; color: var(--text3); margin-top: 6px; line-height: 1.4; }

/* ===== Notifications (Chats + Activity) ===== */
.notif-tabs { display: flex; gap: 6px; padding: 10px 16px 4px; }
.notif-tab {
  flex: 1; text-align: center; border: none; background: var(--surface2); color: var(--text2);
  font: inherit; font-size: 13px; font-weight: 700; padding: 10px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); position: relative;
}
.notif-tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.notif-tab .dot { position: absolute; top: 6px; right: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
.notif-panel { display: none; }
.notif-panel.active { display: block; }

.activity-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
}
.activity-icon {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  background: var(--surface2);
}
.activity-icon.money { background: rgba(52,211,153,0.16); }
.activity-icon.social { background: var(--brand-soft); }
.activity-text { flex: 1; font-size: 13.5px; color: var(--text2); line-height: 1.4; }
.activity-text b { color: var(--text); }
.activity-time { font-size: 11.5px; color: var(--text3); margin-top: 3px; }
.activity-row.unread { background: var(--brand-soft); }

/* ===== Landing page ===== */
.landing {
  max-width: 480px; margin: 0 auto; min-height: 100vh;
  background: radial-gradient(circle at 30% 0%, rgba(255,255,255,0.10), transparent 45%), linear-gradient(160deg, #6D28D9 0%, #7C3AED 42%, #9333EA 100%);
  padding: calc(var(--safe-top) + 16px) 20px 40px;
  position: relative; overflow: hidden;
}
.landing::before {
  content: '🎓'; position: absolute; top: 8%; left: -6%; font-size: 130px; opacity: 0.06; transform: rotate(-12deg);
}
.landing::after {
  content: '🎓'; position: absolute; bottom: 30%; right: -8%; font-size: 150px; opacity: 0.05; transform: rotate(10deg);
}
.landing-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: relative; z-index: 1; }
.landing-pill {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.14); color: #fff;
  border-radius: 999px; padding: 9px 14px; font-size: 12.5px; font-weight: 700;
  white-space: nowrap;
}
.landing-login { color: #fff; font-size: 14px; font-weight: 700; padding: 9px 6px; }
.landing-google-sm {
  display: flex; align-items: center; gap: 8px;
  background: #fff; color: var(--brand-dark);
  border-radius: 999px; padding: 9px 16px; font-size: 12.5px; font-weight: 700;
  white-space: nowrap; border: none; cursor: pointer;
}
.landing-google-sm img, .landing-google-lg img { width: 16px; height: 16px; }

.landing-hero { text-align: center; margin-top: 28px; position: relative; z-index: 1; }
.landing-hero img { width: 168px; margin: 0 auto; }

.landing-headline {
  font-size: 27px; font-weight: 800; color: #fff; text-align: center;
  line-height: 1.25; margin-top: 36px; position: relative; z-index: 1;
}
.landing-sub {
  font-size: 14.5px; color: rgba(255,255,255,0.82); text-align: center; line-height: 1.6;
  margin-top: 14px; position: relative; z-index: 1;
}
.landing-google-lg {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; background: #fff; color: var(--brand-dark);
  border: none; border-radius: 999px; padding: 16px; margin-top: 24px;
  font-size: 15px; font-weight: 800; cursor: pointer; position: relative; z-index: 1;
  box-shadow: 0 10px 26px rgba(0,0,0,0.2);
}

.landing-stats {
  display: flex; margin-top: 28px; background: rgba(255,255,255,0.10);
  border-radius: 18px; padding: 20px 10px; position: relative; z-index: 1;
}
.landing-stat { flex: 1; text-align: center; }
.landing-stat b { display: block; font-size: 21px; font-weight: 800; color: #fff; }
.landing-stat span { font-size: 12px; color: rgba(255,255,255,0.75); }

.landing-section-title {
  font-size: 20px; font-weight: 800; color: #fff; text-align: center;
  margin-top: 40px; position: relative; z-index: 1;
}
.landing-feature {
  display: flex; align-items: center; gap: 14px;
  background: rgba(255,255,255,0.08); border-radius: 16px;
  padding: 15px 16px; margin-top: 12px; position: relative; z-index: 1;
}
.landing-feature-icon {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  background: rgba(255,255,255,0.14);
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.landing-feature-text b { display: block; color: #fff; font-size: 14.5px; font-weight: 700; }
.landing-feature-text span { color: rgba(255,255,255,0.7); font-size: 12.5px; }

.landing-foot { text-align: center; margin-top: 34px; position: relative; z-index: 1; }
.landing-foot a { color: #fff; font-weight: 700; font-size: 13.5px; }

/* ===== Settings ===== */
.settings-section { padding: 18px 16px 4px; }
.settings-section-title { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.settings-group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.settings-row {
  display: flex; align-items: center; gap: 12px;
  padding: 14px; border-bottom: 1px solid var(--border);
}
.settings-row:last-child { border-bottom: none; }
.settings-row-text { flex: 1; min-width: 0; }
.settings-row-text b { display: block; font-size: 14px; font-weight: 700; }
.settings-row-text span { font-size: 12px; color: var(--text3); }
.settings-row .chev { width: 16px; height: 16px; color: var(--text3); flex-shrink: 0; }
.settings-row.link { cursor: pointer; }
.settings-row.danger b { color: var(--danger); }

.switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch-track {
  position: absolute; inset: 0; background: var(--surface3); border-radius: 999px; cursor: pointer;
  transition: background .15s;
}
.switch-track::before {
  content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px;
  background: #fff; border-radius: 50%; transition: transform .15s;
}
.switch input:checked + .switch-track { background: var(--brand); }
.switch input:checked + .switch-track::before { transform: translateX(18px); }

/* ===== Market (full browse page) ===== */
.market-tabs {
  display: flex; gap: 6px; padding: 12px 16px 4px;
  overflow-x: auto; scrollbar-width: none;
}
.market-tabs::-webkit-scrollbar { display: none; }
.market-tab {
  flex-shrink: 0; border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  font: inherit; font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 999px; cursor: pointer;
}
.market-tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.market-sort-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 2px; }
.market-sort-row select { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 12.5px; }
.market-count { font-size: 12px; color: var(--text3); }

/* ===== Swift ===== */
.swift-banner {
  margin: 14px 16px 0; padding: 13px 14px; border-radius: var(--radius-sm);
  background: rgba(251,191,36,0.12); border: 1px solid var(--accent); color: var(--accent);
  font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 8px;
}
.swift-card {
  margin: 14px 16px 0; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
}
.swift-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.swift-card p { font-size: 13px; color: var(--text2); margin: 0 0 12px; line-height: 1.5; }
.swift-status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700;
  border-radius: 999px; padding: 5px 12px; margin-bottom: 10px;
}
.swift-pin-row { display: flex; gap: 10px; margin-top: 10px; }
.swift-pin { flex: 1; background: var(--surface2); border-radius: 10px; padding: 10px; text-align: center; }
.swift-pin b { display: block; font-size: 18px; letter-spacing: .1em; }
.swift-pin span { font-size: 10.5px; color: var(--text3); }
.transport-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.transport-pill {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
}
.transport-pill.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.swift-toggle-row { display: flex; align-items: center; justify-content: space-between; }
.swift-earnings-row { display: flex; gap: 12px; margin-top: 14px; }
.swift-earnings-row div { flex: 1; background: var(--surface2); border-radius: 12px; padding: 12px; text-align: center; }
.swift-earnings-row b { display: block; font-size: 17px; font-weight: 800; }
.swift-earnings-row span { font-size: 11px; color: var(--text3); }
.order-req-card {
  background: var(--surface2); border-radius: 12px; padding: 12px; margin-top: 10px;
}
.order-req-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
.order-req-sub { font-size: 12px; color: var(--text3); margin-top: 3px; }
.order-req-actions { display: flex; gap: 8px; margin-top: 10px; }
.order-req-actions .btn { flex: 1; padding: 9px; font-size: 12.5px; }
.star-row { display: flex; gap: 6px; margin: 10px 0; }
.star-btn { background: none; border: none; font-size: 26px; cursor: pointer; opacity: .35; padding: 0; }
.star-btn.active { opacity: 1; }
.pin-entry-row { display: flex; gap: 8px; margin-top: 10px; }
.pin-entry-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 11px; font: inherit; font-size: 16px; letter-spacing: .2em; text-align: center; color: var(--text); }
.pin-entry-row button { flex-shrink: 0; }

/* ===== Listing detail ===== */
.listing-media {
  width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;
  font-size: 90px; position: relative;
}
.listing-body { padding: 18px 16px; }
.listing-price { font-size: 26px; font-weight: 800; }
.listing-title { font-size: 17px; font-weight: 700; margin-top: 6px; }
.listing-badges { display: flex; gap: 6px; margin-top: 8px; }
.listing-badge { font-size: 11px; font-weight: 700; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; color: var(--text2); }
.listing-desc { font-size: 13.5px; color: var(--text2); line-height: 1.6; margin-top: 14px; }
.listing-seller-row {
  display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.listing-seller-row .info { flex: 1; }
.listing-seller-row b { font-size: 13.5px; display: block; }
.listing-seller-row span { font-size: 11.5px; color: var(--text3); }
.listing-actions { display: flex; gap: 10px; margin-top: 18px; }
.listing-actions .btn { flex: 1; padding: 13px; font-size: 14px; }

/* ===== Swift map + dispute ===== */
.swift-map { width: 100%; height: 180px; border-radius: var(--radius-sm); overflow: hidden; margin-top: 12px; background: var(--surface2); position: relative; cursor: pointer; }
/* OSM's raw tiles are light — invert just the tile layer (not markers/popups) so maps match our dark theme */
.swift-map .leaflet-tile-pane, .dmap-canvas .leaflet-tile-pane, .loc-picker-map .leaflet-tile-pane {
  filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9) saturate(0.7);
}
.leaflet-control-attribution {
  background: rgba(9,7,20,.65) !important; color: var(--text3) !important;
  font-size: 8.5px !important; padding: 1px 6px !important; line-height: 1.4 !important; border-radius: 4px 0 0 0 !important;
}
.leaflet-control-attribution a { color: var(--text3) !important; }
.swift-map-hint {
  position: absolute; right: 8px; bottom: 8px; z-index: 5; pointer-events: none;
  background: rgba(9,7,20,.78); color: #fff; font-size: 10.5px; font-weight: 800;
  padding: 6px 11px; border-radius: 999px; display: flex; align-items: center; gap: 4px;
}

/* ===== Full-screen delivery map (Uber-style) ===== */
.dmap-overlay { position: fixed; inset: 0; z-index: 260; background: var(--bg); }
.dmap-canvas { position: absolute; inset: 0; }
.dmap-topbar {
  position: absolute; top: calc(var(--safe-top) + 12px); left: 12px; right: 12px; z-index: 10;
  display: flex; align-items: center; gap: 10px;
}
.dmap-back-btn {
  width: 42px; height: 42px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border);
  color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 2px 12px rgba(0,0,0,.35); flex-shrink: 0;
}
.dmap-back-btn svg { width: 18px; height: 18px; }
.dmap-status-chip {
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 10px 16px;
  font-size: 12.5px; font-weight: 700; box-shadow: 0 2px 12px rgba(0,0,0,.35);
}
.dmap-locate-btn {
  position: absolute; top: calc(var(--safe-top) + 64px); right: 12px; z-index: 10;
  width: 42px; height: 42px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border);
  color: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 2px 12px rgba(0,0,0,.35);
}
.dmap-locate-btn svg { width: 19px; height: 19px; }
.dmap-sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface);
  border-radius: 20px 20px 0 0; padding: 10px 16px calc(16px + var(--safe-bottom));
  box-shadow: 0 -8px 26px rgba(0,0,0,.4); overflow-y: auto;
  height: 58vh; max-height: 80vh; touch-action: none;
}
.dmap-sheet.dmap-sheet-snapping { transition: height .28s cubic-bezier(.2,.9,.3,1); }
.dmap-sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 999px; margin: 0 auto 12px; cursor: grab; touch-action: none; }
.dmap-eta-chip {
  display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 12.5px; font-weight: 700;
}
.dmap-eta-chip b { color: var(--accent); font-size: 14px; }
.dmap-eta-chip span { color: var(--text3); font-weight: 500; }
.dmap-stop { display: flex; align-items: flex-start; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--border); cursor: pointer; }
.dmap-stop:last-of-type { border-bottom: none; }
.dmap-stop-dot {
  width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0; margin-top: 1px;
}
.dmap-stop-dot.pickup { background: rgba(251,191,36,0.18); color: var(--accent); }
.dmap-stop-dot.dropoff { background: rgba(52,211,153,0.18); color: var(--money); }
.dmap-stop-text { flex: 1; min-width: 0; }
.dmap-stop-text b { font-size: 13.5px; display: block; }
.dmap-stop-text span { font-size: 11.5px; color: var(--text3); }
.dmap-stop.active { background: var(--surface2); border-radius: 10px; }
.dmap-stop.active .dmap-stop-text b { color: var(--accent); }
.dmap-stop-nav-btn {
  flex-shrink: 0; align-self: center; background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
  border-radius: 10px; padding: 8px 11px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.dmap-stop.active .dmap-stop-nav-btn { background: var(--accent); border-color: var(--accent); color: #1A1200; }
.dmap-pin-row { display: flex; gap: 8px; margin-top: 12px; }
.dmap-pin-row input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 11px;
  font: inherit; font-size: 16px; letter-spacing: .2em; text-align: center; color: var(--text);
}
.swift-report-btn {
  margin-top: 12px; width: 100%; background: none; border: 1px solid var(--danger); color: var(--danger);
  border-radius: var(--radius-sm); padding: 11px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
}
.locate-btn {

/* ===== Ambassador ===== */
.amb-hero {

}

.amb-stats-row { display: flex; gap: 10px; padding: 14px 16px 4px; }

.amb-status-badge.pending { background: rgba(251,191,36,0.14); color: var(--accent); }
.amb-status-badge.verified { background: rgba(52,211,153,0.14); color: var(--money); }
.amb-status-badge.paid { background: rgba(52,211,153,0.14); color: var(--money); }

/* ===== Groups ===== */
.group-row .avatar { width: 46px; height: 46px; border-radius: 14px; font-size: 15px; }
.group-row-text { flex: 1; min-width: 0; }

.group-row-text span { font-size: 12px; color: var(--text3); }
.group-discover-card { margin: 10px 16px 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px; display: flex; align-items: center; gap: 12px; }

.group-discover-card .info { flex: 1; min-width: 0; }
.group-discover-card .info b { font-size: 13.5px; display: block; }
.group-discover-card .info span { font-size: 11.5px; color: var(--text3); }
.group-discover-card button { flex-shrink: 0; background: var(--brand); color: #fff; border: none; border-radius: 999px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
.groups-tabs { display: flex; gap: 6px; padding: 12px 16px 4px; }

.call-row-text span { font-size: 11.5px; color: var(--text3); }

/* ===== Verify email ===== */
.verify-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--brand-soft); display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 18px; }

.call-overlay {
  position: fixed; inset: 0; z-index: 200; background: linear-gradient(180deg, var(--brand-dark), #0E0A1D 70%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 24px;
}

.call-mute-btn { background: rgba(255,255,255,0.16); }

/* ===== Chat thread ===== */
.thread-header-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.thread-header-info .avatar { width: 34px; height: 34px; font-size: 12px; }
.thread-header-info b { font-size: 14.5px; display: block; }
.thread-header-info span { font-size: 11px; color: var(--text3); }
.thread-listing-chip {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 16px 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: var(--text2);
}
.thread-listing-chip .info { text-decoration: none; color: inherit; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread-sold-tag { font-size: 10.5px; font-weight: 800; color: var(--money); background: rgba(52,211,153,0.14); border-radius: 999px; padding: 3px 9px; flex-shrink: 0; }
.mark-sold-btn { background: var(--money); color: #06281B; border: none; border-radius: 8px; padding: 6px 11px; font-size: 11.5px; font-weight: 800; cursor: pointer; flex-shrink: 0; }
.request-delivery-row { margin: 8px 16px 0; }
.request-delivery-row a, .request-delivery-row .disabled-hint {
  display: block; text-align: center; border-radius: var(--radius-sm); padding: 11px; font-size: 12.5px; font-weight: 700; text-decoration: none;
}
.request-delivery-row a { background: var(--brand); color: #fff; }
.request-delivery-row .disabled-hint { background: var(--surface); border: 1px dashed var(--border); color: var(--text3); font-weight: 600; }

.thread-messages { padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 3px; min-height: 55vh; background: radial-gradient(circle at 50% 0%, rgba(167,139,250,0.05), transparent 60%); }
.thread-date-sep { text-align: center; margin: 14px 0 8px; }
.thread-date-sep span { background: var(--surface2); color: var(--text3); font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 999px; }
.thread-system-msg { text-align: center; margin: 8px 0; }
.thread-system-msg span { background: var(--brand-soft); color: var(--brand); font-size: 11.5px; font-weight: 700; padding: 6px 14px; border-radius: 999px; display: inline-block; }
.msg-bubble { max-width: 76%; padding: 8px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.4; position: relative; }
.msg-row { display: flex; margin-top: 3px; }
.msg-row.mine { justify-content: flex-end; }
.msg-row.mine .msg-bubble { background: var(--brand); color: #fff; border-bottom-right-radius: 3px; }
.msg-row.theirs .msg-bubble { background: var(--surface2); color: var(--text); border-bottom-left-radius: 3px; }
.msg-time { font-size: 9.5px; color: rgba(255,255,255,0.6); margin-top: 3px; text-align: right; }
.msg-row.theirs .msg-time { color: var(--text3); }
.thread-composer {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; display: flex; gap: 8px; align-items: center;
  padding: 10px 12px calc(10px + var(--safe-bottom));
  background: rgba(18,16,29,0.94); backdrop-filter: blur(14px); border-top: 1px solid var(--border);
}
.thread-composer input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px;
  padding: 12px 16px; font: inherit; font-size: 14px; color: var(--text); outline: none;
}
.thread-send-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--brand); color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.thread-send-btn svg { width: 18px; height: 18px; }

/* ===== Cart ===== */
.cart-row { display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border); align-items: center; }
.cart-thumb { width: 56px; height: 56px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.cart-row-text { flex: 1; min-width: 0; }
.cart-row-text b { font-size: 13.5px; display: block; }
.cart-row-text span { font-size: 12px; color: var(--text3); }
.cart-remove-btn { background: none; border: none; color: var(--danger); font-size: 12px; font-weight: 700; cursor: pointer; }
.cart-summary { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 16px; margin-top: 10px; }
.cart-summary-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 12px; }
.cart-summary-row b { font-size: 18px; }


/* ===== Call screen (voice + video) ===== */
.call-screen {
  position: fixed; inset: 0; z-index: 200;
  background: linear-gradient(180deg, var(--brand-dark), #0E0A1D 70%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #fff; text-align: center; padding: 24px;
}
.call-screen.video-on { background: #000; }

#remoteVideo, #localVideo { display: none; }
.call-screen.video-on #remoteVideo {
  display: block; position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; background: #000;
}
.call-screen.video-on #localVideo {
  display: block; position: absolute; top: calc(16px + var(--safe-top)); right: 14px;
  width: 104px; height: 142px; object-fit: cover; border-radius: 14px;
  border: 2px solid rgba(255,255,255,.22); z-index: 3; background: #111; transform: scaleX(-1);
}

.call-info { position: relative; z-index: 2; transition: opacity .3s; }
.call-screen.video-on .call-info {
  position: absolute; top: calc(18px + var(--safe-top)); left: 16px; text-align: left;
}
.call-screen.video-on .call-info .avatar { display: none; }
.call-screen.video-on .call-info h2 { font-size: 16px; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
.call-screen.video-on .call-info p { text-shadow: 0 2px 10px rgba(0,0,0,.7); }

.call-info .avatar {
  width: 104px; height: 104px; font-size: 34px; margin: 0 auto 18px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.14); font-weight: 800;
}
.call-info .avatar.ringing { animation: ringpulse 1.6s ease-in-out infinite; }
@keyframes ringpulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,.28); }
  50% { box-shadow: 0 0 0 20px rgba(255,255,255,0); }
}
.call-info h2 { font-size: 22px; }
.call-info p { color: rgba(255,255,255,0.75); font-size: 14px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.call-quality { margin-top: 10px; font-size: 11.5px; color: rgba(255,255,255,.6); }
.call-quality.bad { color: var(--accent); }

.call-controls, .call-answer {
  position: absolute; bottom: calc(34px + var(--safe-bottom)); left: 0; right: 0;
  display: flex; justify-content: center; gap: 14px; z-index: 4; flex-wrap: wrap;
}
.call-answer { gap: 60px; }
.call-ctl {
  width: 58px; border: none; background: none; color: #fff;
  display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer;
  font: inherit; font-size: 10.5px; font-weight: 600;
}
.call-ctl svg { width: 22px; height: 22px; }
.call-ctl > svg {
  box-sizing: content-box; padding: 16px; border-radius: 50%;
  background: rgba(255,255,255,0.16); transition: background .15s, transform .12s;
}
.call-ctl:active > svg { transform: scale(.92); }

  if (s < 86400) return Math.floor(s / 3600) + 'h';

/**

 * otherUserId, checking both buyer/seller directions so two people never end
 * up with duplicate threads. Pass listingId to tie it to a specific item.
 * Returns the conversation id, then the caller should redirect to
 * chat-thread.html?id=<id>.
 */
window.CP.openOrCreateConversation = async function (meId, otherUserId, listingId = null) {
  if (!meId || !otherUserId || meId === otherUserId) return null;

  let existingQuery = window.sb.from('conversations').select('id')
    .or(`and(buyer_id.eq.${meId},seller_id.eq.${otherUserId}),and(buyer_id.eq.${otherUserId},seller_id.eq.${meId})`);
  existingQuery = listingId ? existingQuery.eq('listing_id', listingId) : existingQuery.is('listing_id', null);

  const { data: existing } = await existingQuery.maybeSingle();
  if (existing) return existing.id;

  const { data: created, error } = await window.sb.from('conversations')
    .insert({ buyer_id: meId, seller_id: otherUserId, listing_id: listingId })
    .select('id').single();

  if (error) { console.error('Conversation create error:', error); return null; }
  return created.id;
};

// Include on every protected page (Home, Yard, Notifications, Profile, Create).

// ---- Global incoming-call ring (every page that loads this guard) ----
(async () => {
  const { data: { session } } = await window.sb.auth.getSession();
  if (!session || window.location.pathname.endsWith('call.html')) return;

  let ringAudio = null;
  function startRingtone() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const beep = () => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 660; g.gain.value = 0.08;
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + 0.7);
      };
      beep();
      ringAudio = { ctx, loop: setInterval(beep, 1600) };
    } catch (_) {}
  }
  function stopRingtone() {
    if (!ringAudio) return;
    clearInterval(ringAudio.loop);
    try { ringAudio.ctx.close(); } catch (_) {}
    ringAudio = null;
  }

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  window.sb.channel(`ring-${session.user.id}`)
    .on('broadcast', { event: 'incoming' }, ({ payload }) => {
      if (document.getElementById('incomingCallOverlay')) return; // already ringing
      const name = payload.callerName || 'Camplugie user';
      const overlay = document.createElement('div');
      overlay.id = 'incomingCallOverlay';
      overlay.className = 'incoming-call';
      overlay.innerHTML = `
        <div class="avatar">${esc(name.slice(0, 2).toUpperCase())}</div>
        <h2>${esc(name)}</h2>
        <p>${payload.video ? 'Incoming video call…' : 'Incoming Camplugie call…'}</p>
        <div class="row">
          <button class="call-ctl end" id="declineCallBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.42 12.42 0 0 0 3.81.61 2 2 0 0 1 2 2V21a2 2 0 0 1-2 2h-1C7.61 23 1 16.39 1 8V7a2 2 0 0 1 2-2h3.5a2 2 0 0 1 2 2 12.42 12.42 0 0 0 .61 3.81 2 2 0 0 1-.45 2.11z"/></svg>
            <span>Decline</span>
          </button>
          <button class="call-ctl accept" id="acceptCallBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span>Answer</span>
          </button>
        </div>`;
      document.body.appendChild(overlay);
      startRingtone();
      if (navigator.vibrate) navigator.vibrate([400, 250, 400, 250, 400]);

      const cleanup = () => { stopRingtone(); overlay.remove(); if (navigator.vibrate) navigator.vibrate(0); };

      document.getElementById('acceptCallBtn').addEventListener('click', () => {
        cleanup();
        window.location.href = `call.html?peer=${payload.callerId}&name=${encodeURIComponent(name)}` +
          `&role=callee&channel=${payload.callChannel}&mode=${payload.video ? 'video' : 'audio'}&auto=1`;
      });

      document.getElementById('declineCallBtn').addEventListener('click', async () => {
        const ch = window.sb.channel(payload.callChannel);
        await ch.subscribe();
        ch.send({ type: 'broadcast', event: 'signal', payload: { kind: 'declined', from: session.user.id } });
        setTimeout(() => window.sb.removeChannel(ch), 500);
        cleanup();
      });

      setTimeout(() => { if (document.body.contains(overlay)) cleanup(); }, 35000);
    })
    .subscribe();
})();

<script>
const ACTIVE_STATUSES = ['pending', 'requested', 'searching', 'accepted', 'picked_up', 'delivered'];

let activeMap = null;
let mapPoll = null;

function destroyMap() {
  if (mapPoll) { clearInterval(mapPoll); mapPoll = null; }
  if (activeMap) { activeMap.remove(); activeMap = null; }
}

// Draws a small Leaflet map thumbnail with a dropoff pin and (optionally) a live runner pin,
// polling swift_runners.current_lat/current_lng every 8s while the card is visible.
// Tapping the thumbnail opens the full-screen Uber-style map (see openDeliveryMap below).
function renderMap(containerId, order, pollRunnerId, expandOpts) {
  destroyMap();
  const el = document.getElementById(containerId);
  if (!el) return;
  const dropoff = (order.dropoff_lat && order.dropoff_lng) ? [order.dropoff_lat, order.dropoff_lng] : null;
  const pickup = (order.pickup_lat && order.pickup_lng) ? [order.pickup_lat, order.pickup_lng] : null;
  const center = dropoff || pickup || [7.5189, 4.5286]; // falls back to a campus-ish default

  activeMap = L.map(containerId, { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, tap: false }).setView(center, 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, subdomains: 'abc', attribution: '&copy; OpenStreetMap' }).addTo(activeMap);
  L.control.attribution({ prefix: false, position: 'bottomright' }).addTo(activeMap);

  let runnerMarker = null;
  if (dropoff) L.marker(dropoff, { icon: dmapIcon('🏁', '#34D399') }).addTo(activeMap).bindPopup('Drop-off');
  if (pickup) L.marker(pickup, { icon: dmapIcon('🏪', '#FBBF24') }).addTo(activeMap).bindPopup('Pickup');

  async function pollRunner() {
    if (!pollRunnerId) return;
    const { data } = await window.sb.from('swift_runners').select('current_lat, current_lng').eq('id', pollRunnerId).maybeSingle();
    if (!data?.current_lat) return;
    const pos = [data.current_lat, data.current_lng];
    if (runnerMarker) { runnerMarker.setLatLng(pos); } else { runnerMarker = L.circleMarker(pos, { radius: 8, color: '#FBBF24', fillColor: '#FBBF24', fillOpacity: 1 }).addTo(activeMap).bindPopup('Runner'); }
  }
  if (pollRunnerId) { pollRunner(); mapPoll = setInterval(pollRunner, 8000); }

  // Make the small preview map behave like a button that opens the full map.
  if (expandOpts) {
    const hint = document.createElement('div');
    hint.className = 'swift-map-hint';
    hint.innerHTML = '⛶ Open live map';
    el.appendChild(hint);
    el.addEventListener('click', () => openDeliveryMap(order, expandOpts));
  }
}

/* ===== Full-screen Uber-style delivery map ===== */

function haversineKm(a, b) {
  if (!a || !b) return null;
  const R = 6371, dLat = (b[0] - a[0]) * Math.PI / 180, dLng = (b[1] - a[1]) * Math.PI / 180;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}

function mapsDirectionsUrl(lat, lng) {
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
}

function dmapIcon(emoji, color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:32px;height:32px;border-radius:50% 50% 50% 0;background:${color};transform:rotate(45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.45);border:2px solid #fff;"><span style="transform:rotate(-45deg);font-size:14px;">${emoji}</span></div>`,
    iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -30],
  });
}

let dmapMap = null;
let dmapPoll = null;

function closeDeliveryMap() {
  if (dmapPoll) { window.sb.removeChannel(dmapPoll); dmapPoll = null; }
  if (dmapMap) { dmapMap.remove(); dmapMap = null; }
  const overlay = document.getElementById('dmapOverlay');
  if (overlay) overlay.remove();
}

// Real road-following route + ETA, via OSRM's public demo router (free, no
// API key). This is a shared demo server meant for testing/low-volume use —
// fine for now, but if Swift grows past a few hundred deliveries a day,
// swap this for a paid router (Mapbox Directions, OpenRouteService, etc.)
// or self-host OSRM, since the public one rate-limits and gives no uptime
// guarantee. pickup/dropoff are [lat, lng]; OSRM wants lng,lat.
async function fetchRoute(from, to) {
  const url = `https://router.project-osrm.org/route/v1/driving/${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('routing request failed');
  const data = await res.json();
  const route = data.routes?.[0];
  if (!route) throw new Error('no route found');
  return {
    latlngs: route.geometry.coordinates.map(([lng, lat]) => [lat, lng]),
    durationSec: route.duration,
    distanceM: route.distance,
  };
}

function fmtEta(durationSec, distanceM) {
  const mins = Math.max(1, Math.round(durationSec / 60));
  const km = distanceM / 1000;
  return `${mins} min${mins === 1 ? '' : 's'} · ${km < 1 ? `${Math.round(distanceM)} m` : `${km.toFixed(1)} km`}`;
}

// Draws the actual road route on the map (falls back to a straight dashed
// line if the routing request fails) and, if an ETA chip element is given,
// fills it in. Returns the drawn layer so callers can remove/redraw it.
async function drawRoute(map, from, to, etaEl) {
  try {
    const { latlngs, durationSec, distanceM } = await fetchRoute(from, to);
    const line = L.polyline(latlngs, { color: '#A78BFA', weight: 4, opacity: .85 }).addTo(map);
    if (etaEl) { etaEl.style.display = 'flex'; etaEl.innerHTML = `<b>🕐 ${fmtEta(durationSec, distanceM)}</b><span>away</span>`; }
    return line;
  } catch (err) {
    console.error('Route fetch failed, falling back to straight line:', err);
    const line = L.polyline([from, to], { color: '#8D86AA', weight: 2, dashArray: '6,8', opacity: .7 }).addTo(map);
    if (etaEl) etaEl.style.display = 'none';
    return line;
  }
}

// Glides a marker to its new position instead of snapping — this is most of
// what makes a live tracker feel like Uber/DoorDash instead of a refreshing
// page. durationMs should be a bit less than the poll interval so each glide
// finishes before the next update arrives.
function animateMarkerTo(marker, newPos, durationMs) {
  const start = marker.getLatLng();
  const startTime = performance.now();
  (function step(now) {
    const t = Math.min(1, (now - startTime) / durationMs);
    marker.setLatLng([
      start.lat + (newPos[0] - start.lat) * t,
      start.lng + (newPos[1] - start.lng) * t,
    ]);
    if (t < 1) requestAnimationFrame(step);
  })(startTime);
}

// Makes the bottom sheet actually draggable — peek/half/full snap points,
// like Uber/DoorDash/most delivery apps. Previously the little handle bar
// was just decorative.
function initSheetDrag(sheet) {
  const handle = sheet.querySelector('.dmap-sheet-handle');
  const PEEK = 110;
  const HALF = Math.round(window.innerHeight * 0.40);
  const FULL = Math.round(window.innerHeight * 0.58);
  const MAX = Math.round(window.innerHeight * 0.80);
  let startY = 0, startH = 0, dragging = false;

  const onMove = (e) => {
    if (!dragging) return;
    const h = Math.min(MAX, Math.max(PEEK, startH + (startY - e.clientY)));
    sheet.style.height = h + 'px';
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    const h = sheet.getBoundingClientRect().height;
    const nearest = [PEEK, HALF, FULL].reduce((a, b) => Math.abs(b - h) < Math.abs(a - h) ? b : a);
    sheet.classList.add('dmap-sheet-snapping');
    sheet.style.height = nearest + 'px';
    setTimeout(() => sheet.classList.remove('dmap-sheet-snapping'), 300);
  };
  handle.addEventListener('pointerdown', (e) => {
    dragging = true;
    startY = e.clientY;
    startH = sheet.getBoundingClientRect().height;
    sheet.classList.remove('dmap-sheet-snapping');
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

/**
 * Opens a full-screen, Uber/delivery-app style map so a runner can see and
 * jump between BOTH the seller (pickup) and buyer (dropoff) stops in one view —
 * with one tap to launch turn-by-turn directions in Google Maps for either leg.
 *
 * order — the swift_orders row (needs pickup_lat/lng, dropoff_lat/lng, place names).
 * opts.role         — 'runner' or 'buyer'.
 * opts.activeLeg     — 'pickup' or 'dropoff', which stop is highlighted/centered first.
 * opts.pollRunnerId  — swift_runners.id to live-poll and show a runner marker (buyer tracking).
 * opts.onPinConfirm  — (leg, pin) => Promise, called when a PIN is submitted from the sheet.
 */
function openDeliveryMap(order, opts = {}) {
  const { role = 'runner', activeLeg = 'pickup', pollRunnerId = null, onPinConfirm = null } = opts;
  closeDeliveryMap();

  const pickup = (order.pickup_lat && order.pickup_lng) ? [order.pickup_lat, order.pickup_lng] : null;
  const dropoff = (order.dropoff_lat && order.dropoff_lng) ? [order.dropoff_lat, order.dropoff_lng] : null;

  const overlay = document.createElement('div');
  overlay.className = 'dmap-overlay';
  overlay.id = 'dmapOverlay';
  overlay.innerHTML = `
    <div class="dmap-canvas" id="dmapCanvas"></div>
    <div class="dmap-topbar">
      <button class="dmap-back-btn" id="dmapBackBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <div class="dmap-status-chip">${STATUS_LABEL[order.status] || 'On the way'}</div>
    </div>
    <button class="dmap-locate-btn" id="dmapLocateBtn" title="Center on me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <div class="dmap-sheet" id="dmapSheet">
      <div class="dmap-sheet-handle"></div>
      <div class="dmap-eta-chip" id="dmapEtaChip" style="display:none"></div>
      ${pickup ? `
      <div class="dmap-stop${activeLeg === 'pickup' ? ' active' : ''}" data-leg="pickup">
        <div class="dmap-stop-dot pickup">🏪</div>
        <div class="dmap-stop-text">
          <b>${order.pickup_place || 'Seller — pickup'}</b>
          <span>${role === 'runner' ? 'Collect the item from the seller here' : 'Where your item is picked up from'}</span>
        </div>
        <button class="dmap-stop-nav-btn" data-lat="${pickup[0]}" data-lng="${pickup[1]}">↗ Navigate</button>
      </div>` : ''}
      ${dropoff ? `
      <div class="dmap-stop${activeLeg === 'dropoff' ? ' active' : ''}" data-leg="dropoff">
        <div class="dmap-stop-dot dropoff">🏁</div>
        <div class="dmap-stop-text">
          <b>${order.dropoff_place || 'Buyer — drop-off'}</b>
          <span>${role === 'runner' ? 'Hand the item to the buyer here' : 'Where it gets delivered to you'}</span>
        </div>
        <button class="dmap-stop-nav-btn" data-lat="${dropoff[0]}" data-lng="${dropoff[1]}">↗ Navigate</button>
      </div>` : ''}
      ${role === 'runner' && onPinConfirm ? `
      <div class="dmap-pin-row">
        <input type="text" id="dmapPinInput" placeholder="${activeLeg === 'pickup' ? 'Pickup' : 'Delivery'} PIN" maxlength="4" inputmode="numeric">
        <button class="btn btn-primary" id="dmapPinConfirmBtn">Confirm</button>
      </div>` : ''}
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById('dmapBackBtn').addEventListener('click', closeDeliveryMap);
  overlay.querySelectorAll('.dmap-stop-nav-btn').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    window.open(mapsDirectionsUrl(btn.dataset.lat, btn.dataset.lng), '_blank');
  }));

  const startCenter = (activeLeg === 'dropoff' ? dropoff : pickup) || pickup || dropoff || [7.5189, 4.5286];
  const map = L.map('dmapCanvas', { zoomControl: false, attributionControl: false }).setView(startCenter, 16);
  dmapMap = map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, subdomains: 'abc', attribution: '&copy; OpenStreetMap' }).addTo(map);
  L.control.attribution({ prefix: false, position: 'bottomright' }).addTo(map);

  const bounds = [];
  if (pickup) { L.marker(pickup, { icon: dmapIcon('🏪', '#FBBF24') }).addTo(map).bindPopup('Seller — pickup'); bounds.push(pickup); }
  if (dropoff) { L.marker(dropoff, { icon: dmapIcon('🏁', '#34D399') }).addTo(map).bindPopup('Buyer — drop-off'); bounds.push(dropoff); }

  const etaChip = document.getElementById('dmapEtaChip');
  // Route from wherever we're tracking FROM: the live runner if we have one
  // to follow, otherwise straight from pickup to dropoff.
  let routeLine = null;
  if (pickup && dropoff && !pollRunnerId) {
    drawRoute(map, pickup, dropoff, etaChip).then(line => { routeLine = line; });
  }

  let runnerMarker = null;
  let lastRoutedFrom = null; // avoid re-requesting a route for tiny position jitter

  async function handleRunnerPos(pos) {
    if (runnerMarker) animateMarkerTo(runnerMarker, pos, 2500);
    else runnerMarker = L.marker(pos, { icon: dmapIcon('🛵', '#A78BFA') }).addTo(map).bindPopup('Runner');

    // Route from the runner's live position to whichever stop is active —
    // this is what makes the line "count down" as they get closer, instead
    // of always showing the full pickup→dropoff route.
    const target = activeLeg === 'dropoff' ? dropoff : pickup;
    if (target) {
      const movedEnough = !lastRoutedFrom || Math.hypot(pos[0] - lastRoutedFrom[0], pos[1] - lastRoutedFrom[1]) > 0.0008; // ~90m
      if (movedEnough) {
        lastRoutedFrom = pos;
        if (routeLine) map.removeLayer(routeLine);
        routeLine = await drawRoute(map, pos, target, etaChip);
      }
    }
  }

  if (pollRunnerId) {
    // Initial placement, then live push updates via Realtime — the runner's
    // own device writes current_lat/current_lng at most every 10s (see
    // startLocationBroadcast below), and this picks each write up
    // immediately instead of waiting on a poll interval.
    window.sb.from('swift_runners').select('current_lat, current_lng').eq('id', pollRunnerId).maybeSingle()
      .then(({ data }) => { if (data?.current_lat) handleRunnerPos([data.current_lat, data.current_lng]); });

    dmapPoll = window.sb.channel(`runner-pos-${pollRunnerId}`)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'swift_runners', filter: `id=eq.${pollRunnerId}` }, (payload) => {
        const row = payload.new;
        if (row?.current_lat) handleRunnerPos([row.current_lat, row.current_lng]);
      })
      .subscribe();
  }

  if (bounds.length > 1) map.fitBounds(bounds, { padding: [70, 70] });

  initSheetDrag(document.getElementById('dmapSheet'));

  document.getElementById('dmapLocateBtn').addEventListener('click', () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition((pos) => map.setView([pos.coords.latitude, pos.coords.longitude], 16));
  });

  overlay.querySelectorAll('.dmap-stop').forEach(row => row.addEventListener('click', (e) => {
    if (e.target.closest('.dmap-stop-nav-btn')) return;
    const leg = row.dataset.leg;
    const target = leg === 'pickup' ? pickup : dropoff;
    if (target) map.setView(target, 16);
    overlay.querySelectorAll('.dmap-stop').forEach(r => r.classList.toggle('active', r === row));
  }));

  if (role === 'runner' && onPinConfirm) {
    document.getElementById('dmapPinConfirmBtn').addEventListener('click', async () => {
      const entered = document.getElementById('dmapPinInput').value.trim();
      if (!entered) return;
      const ok = await onPinConfirm(entered);
      if (ok) closeDeliveryMap();
    });
  }
}

function haversineMeters(a, b) {
  if (!a || !b || a.lat == null || b.lat == null) return null;
  const R = 6371000, toRad = (x) => (x * Math.PI) / 180;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function prettyDistance(m) {
  if (m == null) return '';
  if (m < 950) return `${Math.round(m / 10) * 10} m`;
  return `${(m / 1000).toFixed(1)} km`;
}

const BASE_FEE = 1000;         // flat base, always applies
const PER_KM_FEE = 150;        // added per km beyond the first free km
const OFF_CAMPUS_SURCHARGE = 1000; // added if pickup or drop-off is outside the campus radius
const CAMPUS_RADIUS_METERS = 2000; // "on campus" = within this radius of the university's pinned center

// Computes the delivery fee from the two pins. Falls back to just the base
// fee if we don't have both points yet, or if the university has no center
// coordinates set (see the campus radius note below).
function computeFee(pickup, dropoff, campusCenter) {
  let fee = BASE_FEE;
  const breakdown = [{ label: 'Base fee', amount: BASE_FEE }];

  const distM = haversineMeters(pickup, dropoff);
  if (distM != null) {
    const extraKm = Math.max(0, distM / 1000 - 1);
    const distanceFee = Math.ceil(extraKm) * PER_KM_FEE;
    if (distanceFee > 0) { fee += distanceFee; breakdown.push({ label: `Distance (${prettyDistance(distM)})`, amount: distanceFee }); }
  }

  if (campusCenter) {
    const pickupOutside = pickup && haversineMeters(pickup, campusCenter) > CAMPUS_RADIUS_METERS;
    const dropoffOutside = dropoff && haversineMeters(dropoff, campusCenter) > CAMPUS_RADIUS_METERS;
    if (pickupOutside || dropoffOutside) { fee += OFF_CAMPUS_SURCHARGE; breakdown.push({ label: 'Off-campus surcharge', amount: OFF_CAMPUS_SURCHARGE }); }
  }

  return { fee, breakdown, distM };
}
