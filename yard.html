<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camplugie — The Yard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Clash+Display:wght@500;600;700&family=Satoshi:wght@400;500;700;900&display=swap');

/* ===== Design tokens (matches Camplugie's existing dark theme) ===== */
:root {
  --brand: #A78BFA;
  --brand-dark: #7C3AED;
  --brand-soft: rgba(167, 139, 250, 0.14);
  --accent: #FBBF24;
  --accent-soft: rgba(251, 191, 36, 0.14);
  --money: #34D399;
  --danger: #FB7185;

  --bg: #090714;
  --bg-gradient: radial-gradient(circle at 20% -10%, rgba(124,58,237,0.34), transparent 36%), linear-gradient(180deg, #0E0A1D 0%, #090714 100%);
  --surface: #12101D;
  --surface2: #1A1729;
  --surface3: #242039;
  --border: rgba(255,255,255,0.10);

  --text: #F8F6FF;
  --text2: #C9C3DE;
  --text3: #8D86AA;

  --nav-h: 58px;
  --bottom-h: 68px;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 14px 38px rgba(0,0,0,0.28);
  --shadow-lg: 0 24px 80px rgba(0,0,0,0.48);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg-gradient), var(--bg);
  color: var(--text);
  font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
}
h1, h2, h3, h4, .display {
  font-family: 'Clash Display', 'Satoshi', sans-serif;
  margin: 0;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
img { max-width: 100%; display: block; }

.app-shell {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  padding-bottom: calc(var(--bottom-h) + var(--safe-bottom) + 10px);
}

/* ===== Header ===== */
.cp-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(var(--safe-top) + 14px) 16px 12px;
  background: rgba(9, 7, 20, 0.88);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.cp-header-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cp-logo {
  width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(124,58,237,0.35);
}
.cp-logo img { width: 100%; height: 100%; object-fit: cover; }
.cp-header-text { min-width: 0; }
.cp-header-text .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.cp-header-text .brand-sub {
  font-size: 11.5px; color: var(--text3); font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cp-header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.icon-btn {
  position: relative;
  width: 38px; height: 38px; border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-badge {
  position: absolute; top: -4px; right: -4px;
  min-width: 16px; height: 16px; padding: 0 3px;
  border-radius: 999px;
  background: var(--danger);
  color: #fff;
  font-size: 10px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--bg);
}

/* ===== Search ===== */
.cp-search-wrap { padding: 14px 16px 4px; }
.cp-search {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0 16px;
  height: 44px;
}
.cp-search svg { width: 17px; height: 17px; color: var(--text3); flex-shrink: 0; }
.cp-search input {
  flex: 1; border: none; background: none; outline: none;
  font: inherit; font-size: 14.5px; color: var(--text);
  min-width: 0;
}
.cp-search input::placeholder { color: var(--text3); }

/* ===== Category chips ===== */
.cp-chiprow {
  display: flex; gap: 8px;
  overflow-x: auto; scrollbar-width: none;
  padding: 12px 16px 4px;
}
.cp-chiprow::-webkit-scrollbar { display: none; }
.cp-chip {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  border-radius: 999px;
  padding: 9px 16px;
  font-size: 13.5px; font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.cp-chip.active { background: var(--accent); color: #1A1200; border-color: var(--accent); }

/* ===== Promo banner ===== */
.cp-promo {
  margin: 14px 16px 0;
  border-radius: var(--radius);
  padding: 22px 20px;
  background: linear-gradient(135deg, var(--brand-dark), var(--brand) 120%);
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.cp-promo::after {
  content: '🎓';
  position: absolute;
  right: -6px; bottom: -18px;
  font-size: 92px;
  opacity: 0.16;
  transform: rotate(-8deg);
}
.cp-promo h2 {
  font-size: 21px; font-weight: 700; line-height: 1.25;
  color: #fff; max-width: 78%; position: relative; z-index: 1;
}
.cp-promo p {
  margin: 6px 0 16px; font-size: 13px; color: rgba(255,255,255,0.82);
  position: relative; z-index: 1;
}
.cp-promo-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: #12101D; color: var(--accent);
  border: none; border-radius: 10px;
  padding: 10px 16px;
  font-size: 13.5px; font-weight: 700;
  cursor: pointer;
  position: relative; z-index: 1;
}

/* ===== Yard teaser ===== */
.cp-yard-teaser {
  margin: 14px 16px 0;
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 13px 14px;
  cursor: pointer;
}
.cp-yard-avatars { display: flex; flex-shrink: 0; }
.cp-yard-avatars span {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  border: 2px solid var(--surface);
  margin-left: -10px;
}
.cp-yard-avatars span:first-child { margin-left: 0; }
.cp-yard-teaser-text { flex: 1; min-width: 0; }
.cp-yard-teaser-text .title { font-size: 13.5px; font-weight: 700; }
.cp-yard-teaser-text .sub { font-size: 11.5px; color: var(--text3); margin-top: 1px; }
.cp-yard-teaser .chev { color: var(--text3); flex-shrink: 0; }
.cp-yard-teaser .chev svg { width: 18px; height: 18px; }

/* ===== Section header ===== */
.cp-section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 22px 16px 10px;
}
.cp-section-head h3 { font-size: 16px; font-weight: 700; }
.cp-section-head a { font-size: 12.5px; font-weight: 700; color: var(--accent); }

/* ===== Featured sellers ===== */
.cp-sellers-row {
  display: flex; gap: 16px;
  overflow-x: auto; scrollbar-width: none;
  padding: 4px 16px 6px;
}
.cp-sellers-row::-webkit-scrollbar { display: none; }
.cp-seller {
  flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
  width: 64px; text-align: center;
}
.cp-seller-av {
  width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  border: 2px solid var(--brand);
}
.cp-seller span { font-size: 11px; color: var(--text2); font-weight: 600; line-height: 1.2; }

/* ===== Store grid / product cards ===== */
.cp-store-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 6px 16px 8px;
}
.store-card {
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  padding: 0;
  display: flex;
  flex-direction: column;
  transition: transform .12s ease;
}
.store-card:active { transform: scale(0.97); }
.store-card-media {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
  overflow: hidden;
}
.store-like {
  position: absolute; top: 8px; right: 8px;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(9,7,20,.55);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.store-like svg { width: 15px; height: 15px; }
.store-card-body { padding: 10px 11px 12px; }
.store-price { font-weight: 800; font-size: 16px; color: var(--text); }
.store-title {
  font-size: 12.5px; color: var(--text2); margin: 3px 0 9px; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.store-seller { display: flex; align-items: center; gap: 6px; }
.store-av {
  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
}
.store-seller-name { font-size: 11px; color: var(--text3); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Bottom nav ===== */
.cp-bottom-nav {
  position: fixed;
  left: 50%; transform: translateX(-50%);
  bottom: 0;
  width: 100%; max-width: 480px;
  height: calc(var(--bottom-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(18, 16, 29, 0.92);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-around;
  z-index: 30;
}
.cp-nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: var(--text3);
  font-size: 10.5px; font-weight: 600;
  cursor: pointer; padding: 6px 10px;
}
.cp-nav-item svg { width: 22px; height: 22px; }
.cp-nav-item.active { color: var(--accent); }
.cp-nav-fab {
  width: 46px; height: 46px; border-radius: 14px;
  background: var(--accent);
  color: #1A1200;
  display: flex; align-items: center; justify-content: center;
  margin-top: -18px;
  box-shadow: 0 8px 20px rgba(251,191,36,0.4);
  border: 4px solid var(--bg);
  cursor: pointer;
}
.cp-nav-fab svg { width: 22px; height: 22px; }

@media (min-width: 481px) {
  .cp-bottom-nav { border-radius: 20px 20px 0 0; }
}

/* ===== Shared page header (non-home pages) ===== */
.cp-page-header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: calc(var(--safe-top) + 14px) 16px 12px;
  background: rgba(9, 7, 20, 0.88);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.cp-page-header h1 { font-size: 18px; font-weight: 700; }
.cp-page-header .brand-sub { font-size: 11.5px; color: var(--text3); font-weight: 500; margin-top: 1px; }

/* ===== Post / feed card (Yard) — X-style ===== */
.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: #fff; overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }

.post-card {
  display: flex; gap: 11px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: none; border-radius: 0; margin: 0;
  cursor: default;
}
.post-card .avatar { width: 42px; height: 42px; flex-shrink: 0; }
.post-main { flex: 1; min-width: 0; }
.post-header-row { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
.post-header-row .post-name { font-weight: 800; font-size: 15px; color: var(--text); }
.post-header-row .post-handle, .post-header-row .post-dot, .post-header-row .post-time { color: var(--text3); font-size: 14px; }
.post-eyebrow {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 800; color: var(--accent);
  margin-bottom: 4px;
}
.post-body { font-size: 15px; line-height: 1.35; color: var(--text); margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
.post-actions {
  display: flex; align-items: center; justify-content: space-between;
  max-width: 320px; margin-top: 10px; margin-left: -8px;
}
.post-action {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--text3);
  background: none; border: none; cursor: pointer;
  padding: 6px 8px; border-radius: 999px;
}
.post-action svg { width: 17px; height: 17px; }
.post-action.zap-btn.liked { color: var(--accent); font-weight: 800; }
.post-action.comment-btn:active { color: var(--brand); }
.post-action.repost-active { color: var(--money); }

/* Pinned/official posts keep a highlighted treatment, distinct from the plain feed rows */
.post-card.pinned {
  background: linear-gradient(135deg, var(--brand-dark), var(--brand) 130%);
  border-radius: var(--radius); margin: 10px 16px 0; border: none; padding: 14px;
}
.post-card.pinned .post-header-row .post-name,
.post-card.pinned .post-header-row .post-handle,
.post-card.pinned .post-header-row .post-dot,
.post-card.pinned .post-header-row .post-time { color: rgba(255,255,255,0.92); }
.post-card.pinned .post-body { color: rgba(255,255,255,0.95); }
.post-card.pinned .post-eyebrow { color: #fff; }
.post-card.pinned .post-action { color: rgba(255,255,255,0.75); }

/* ---- Media: single image/video, or a Facebook-style swipeable carousel for multiple ---- */
.post-media-wrap { margin-top: 10px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
.post-media-single img { width: 100%; max-height: 420px; object-fit: cover; display: block; }

.media-carousel { position: relative; }
.media-carousel-track {
  display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.media-carousel-track::-webkit-scrollbar { display: none; }
.media-carousel-slide { flex: 0 0 100%; scroll-snap-align: center; }
.media-carousel-slide img { width: 100%; max-height: 420px; object-fit: cover; display: block; }
.media-carousel-dots {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 5px; background: rgba(9,7,20,.5); padding: 5px 8px; border-radius: 999px;
}
.media-carousel-dots span { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.5); transition: background .15s, width .15s; }
.media-carousel-dots span.active { background: #fff; width: 14px; border-radius: 3px; }
.media-count-badge {
  position: absolute; top: 8px; right: 8px; background: rgba(9,7,20,.6); color: #fff;
  font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
}

/* ---- Custom video player (no native controls) ---- */
.custom-video-wrap { position: relative; background: #000; aspect-ratio: 16/10; }
.custom-video-wrap video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
.video-tap-target { position: absolute; inset: 0; }
.video-center-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 52px; height: 52px; border-radius: 50%; background: rgba(9,7,20,.55);
  display: flex; align-items: center; justify-content: center; pointer-events: none;
  opacity: 0; transition: opacity .15s;
}
.custom-video-wrap.paused .video-center-btn { opacity: 1; }
.video-center-btn svg { width: 22px; height: 22px; color: #fff; }
.video-mute-btn {
  position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%;
  background: rgba(9,7,20,.55); border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.video-mute-btn svg { width: 15px; height: 15px; }
.video-progress-row { position: absolute; left: 8px; right: 8px; bottom: 8px; height: 3px; background: rgba(255,255,255,0.25); border-radius: 3px; cursor: pointer; }
.video-progress-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; }

/* Compose overlay */
.compose-overlay { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; }
.compose-header { display: flex; align-items: center; justify-content: space-between; padding: calc(var(--safe-top) + 14px) 16px 12px; border-bottom: 1px solid var(--border); }
.compose-header button.cancel { background: none; border: none; color: var(--text2); font-size: 14px; font-weight: 600; }
.compose-header button.post-submit { background: var(--accent); color: #1A1200; border: none; border-radius: 999px; padding: 9px 18px; font-size: 13.5px; font-weight: 800; cursor: pointer; }
.compose-header button.post-submit:disabled { opacity: .5; }
.compose-body { flex: 1; overflow-y: auto; padding: 16px; }
.compose-body textarea { width: 100%; border: none; background: none; outline: none; resize: none; color: var(--text); font: inherit; font-size: 16px; min-height: 100px; }
.compose-media-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.compose-media-thumb { position: relative; width: 84px; height: 84px; border-radius: 12px; overflow: hidden; background: var(--surface2); }
.compose-media-thumb img, .compose-media-thumb video { width: 100%; height: 100%; object-fit: cover; }
.compose-media-thumb .remove-media-btn { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: rgba(9,7,20,.75); color: #fff; border: none; font-size: 12px; cursor: pointer; }
.compose-footer { display: flex; gap: 16px; padding: 14px 16px calc(14px + var(--safe-bottom)); border-top: 1px solid var(--border); }
.compose-footer button { background: none; border: none; color: var(--brand); display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; cursor: pointer; }
.compose-footer svg { width: 20px; height: 20px; }

/* Comments overlay */
.comments-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(9,7,20,.85); display: flex; align-items: flex-end; }
.comments-sheet { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; margin: 0 auto; max-height: 80vh; display: flex; flex-direction: column; }
.comments-sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); }
.comments-sheet-header button { background: none; border: none; color: var(--text3); font-size: 20px; cursor: pointer; }
.comments-list { flex: 1; overflow-y: auto; padding: 8px 16px; }
.comment-row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.comment-row .avatar { width: 32px; height: 32px; font-size: 11px; flex-shrink: 0; }
.comment-row-text { flex: 1; }
.comment-row-text b { font-size: 12.5px; display: block; }
.comment-row-text span.time { font-size: 10.5px; color: var(--text3); }
.comment-row-text p { font-size: 13px; color: var(--text2); margin: 3px 0 0; }
.comments-input-row { display: flex; gap: 8px; padding: 12px 16px calc(12px + var(--safe-bottom)); border-top: 1px solid var(--border); }
.comments-input-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 11px 15px; font: inherit; font-size: 13.5px; color: var(--text); outline: none; }
.comments-input-row button { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.comments-input-row button svg { width: 16px; height: 16px; }

.cp-fab {
  position: fixed; right: 20px; bottom: calc(var(--bottom-h) + var(--safe-bottom) + 16px);
  width: 52px; height: 52px; border-radius: 16px;
  background: var(--accent); color: #1A1200;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 24px rgba(251,191,36,0.4);
  border: none; cursor: pointer; z-index: 25;
  left: 50%; margin-left: 178px;
}
.cp-fab svg { width: 24px; height: 24px; }

/* ===== Chat list (Chat page) ===== */
.chat-search-wrap { padding: 12px 16px 6px; }
.chat-list { padding: 4px 0 12px; }
.chat-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.chat-row .avatar { width: 50px; height: 50px; font-size: 15px; position: relative; }
.chat-row-text { flex: 1; min-width: 0; }
.chat-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chat-row-top .name { font-weight: 700; font-size: 14.5px; }
.chat-row-top .time { font-size: 11px; color: var(--text3); flex-shrink: 0; }
.chat-row-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 3px; }
.chat-row-bottom .preview {
  font-size: 13px; color: var(--text3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chat-unread {
  min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px;
  background: var(--accent); color: #1A1200;
  font-size: 10.5px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.chat-listing-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 700; color: var(--brand);
  background: var(--brand-soft); border-radius: 6px; padding: 2px 6px; margin-top: 4px;
}

/* ===== Profile ===== */
.profile-cover {
  height: 110px;
  background: linear-gradient(135deg, var(--brand-dark), var(--brand) 130%);
  position: relative;
}
.profile-head { padding: 0 16px; margin-top: -38px; }
.profile-avatar {
  width: 84px; height: 84px; border-radius: 50%;
  border: 4px solid var(--bg);
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 800; color: #fff; overflow: hidden;
}
.profile-name-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.profile-name-row h2 { font-size: 19px; }
.verified-badge { width: 16px; height: 16px; background: #2563EB; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 9px; flex-shrink: 0; }
.profile-handle { font-size: 13px; color: var(--text3); margin-top: 2px; }
.profile-bio { font-size: 13.5px; color: var(--text2); margin-top: 8px; line-height: 1.5; }
.profile-stats { display: flex; gap: 22px; margin-top: 14px; padding: 0 16px; }
.profile-stat { }
.profile-stat b { font-size: 16px; font-weight: 800; display: block; }
.profile-stat span { font-size: 11.5px; color: var(--text3); }
.profile-actions { display: flex; gap: 10px; padding: 16px 16px 4px; }
.btn {
  font: inherit; font-size: 13.5px; font-weight: 700; border-radius: 12px;
  padding: 11px 14px; cursor: pointer; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-primary { background: var(--brand); color: #fff; border: none; flex: 1; }
.btn-ghost { background: var(--surface2); color: var(--text); }
.profile-menu { padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
.profile-menu-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 13px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
}
.profile-menu-item svg { width: 18px; height: 18px; color: var(--text3); flex-shrink: 0; }
.profile-menu-item .chev { margin-left: auto; width: 16px; height: 16px; color: var(--text3); }

/* ===== Create listing (Sell) ===== */
.form-wrap { padding: 16px; }
.type-toggle { display: flex; gap: 8px; margin-bottom: 18px; }
.type-toggle .btn { flex: 1; background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.type-toggle .btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text2); margin-bottom: 7px; }
.form-input, .form-textarea, .form-select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px 14px; font: inherit; font-size: 14px; color: var(--text); outline: none;
}
.form-textarea { resize: vertical; min-height: 90px; }
.upload-box {
  border: 1.5px dashed var(--border); border-radius: var(--radius-sm);
  padding: 26px 14px; text-align: center; color: var(--text3); font-size: 13px; font-weight: 600;
  cursor: pointer;
}
.upload-box svg { width: 26px; height: 26px; margin: 0 auto 8px; }
.upload-box.has-photos { padding: 14px; }
.photo-preview-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.photo-thumb { position: relative; width: 72px; height: 72px; border-radius: 10px; overflow: hidden; background: var(--surface2); }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-thumb .remove-photo-btn {
  position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%;
  background: rgba(9,7,20,.75); color: #fff; border: none; font-size: 12px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.photo-thumb .upload-progress {
  position: absolute; inset: 0; background: rgba(9,7,20,.6); color: #fff; font-size: 10.5px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.form-submit { width: 100%; background: var(--accent); color: #1A1200; border: none; border-radius: var(--radius-sm); padding: 15px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 6px; }

/* ===== Public profile view ===== */
.pv-message-btn { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; width: calc(100% - 32px); max-width: 448px; z-index: 20; }

/* ===== Auth ===== */
.auth-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: calc(var(--safe-top) + 32px) 24px 32px; display: flex; flex-direction: column; }
.auth-logo { width: 56px; height: 56px; border-radius: 16px; overflow: hidden; margin-bottom: 18px; box-shadow: 0 8px 22px rgba(124,58,237,0.4); }
.auth-logo img { width: 100%; height: 100%; object-fit: cover; }
.auth-shell h1 { font-size: 25px; font-weight: 700; }
.auth-shell .auth-sub { font-size: 14px; color: var(--text3); margin-top: 6px; }
.auth-tabs { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin: 24px 0 22px; }
.auth-tab { flex: 1; border: none; background: none; color: var(--text3); font: inherit; font-size: 13.5px; font-weight: 700; padding: 10px; border-radius: 9px; cursor: pointer; }
.auth-tab.active { background: var(--brand); color: #fff; }
.auth-view { display: none; flex-direction: column; gap: 16px; }
.auth-view.active { display: flex; }
.auth-foot { margin-top: 22px; text-align: center; font-size: 13px; color: var(--text3); }
.auth-foot a { color: var(--accent); font-weight: 700; }
.password-field { position: relative; }
.password-field .form-input { padding-right: 42px; }
.password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px; }
.password-toggle svg { width: 17px; height: 17px; }

/* University picker */
.uni-picker { position: relative; }
.uni-picker-input {
  display: flex; align-items: center; gap: 10px;
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px 14px; cursor: pointer;
}
.uni-picker-input input { flex: 1; border: none; background: none; outline: none; font: inherit; font-size: 14px; color: var(--text); }
.uni-picker-input svg { width: 16px; height: 16px; color: var(--text3); flex-shrink: 0; }
.uni-list {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  max-height: 220px; overflow-y: auto; box-shadow: var(--shadow-lg);
  display: none;
}
.uni-list.open { display: block; }
.uni-option { padding: 12px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; border-bottom: 1px solid var(--border); }
.uni-option:last-child { border-bottom: none; }
.uni-option:hover { background: var(--surface2); }
.uni-locked {
  display: flex; align-items: center; gap: 10px;
  background: var(--brand-soft); border: 1px solid var(--brand); border-radius: var(--radius-sm);
  padding: 12px 14px;
}
.uni-locked svg { width: 16px; height: 16px; color: var(--brand); flex-shrink: 0; }
.uni-locked .name { font-size: 14px; font-weight: 700; flex: 1; }
.uni-locked .note { font-size: 11px; color: var(--text3); }
.field-hint { font-size: 11.5px; color: var(--text3); margin-top: 6px; line-height: 1.4; }

/* ===== Notifications (Chats + Activity) ===== */
.notif-tabs { display: flex; gap: 6px; padding: 10px 16px 4px; }
.notif-tab {
  flex: 1; text-align: center; border: none; background: var(--surface2); color: var(--text2);
  font: inherit; font-size: 13px; font-weight: 700; padding: 10px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); position: relative;
}
.notif-tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.notif-tab .dot { position: absolute; top: 6px; right: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
.notif-panel { display: none; }
.notif-panel.active { display: block; }

.activity-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
}
.activity-icon {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  background: var(--surface2);
}
.activity-icon.money { background: rgba(52,211,153,0.16); }
.activity-icon.social { background: var(--brand-soft); }
.activity-text { flex: 1; font-size: 13.5px; color: var(--text2); line-height: 1.4; }
.activity-text b { color: var(--text); }
.activity-time { font-size: 11.5px; color: var(--text3); margin-top: 3px; }
.activity-row.unread { background: var(--brand-soft); }

/* ===== Landing page ===== */
.landing {
  max-width: 480px; margin: 0 auto; min-height: 100vh;
  background: radial-gradient(circle at 30% 0%, rgba(255,255,255,0.10), transparent 45%), linear-gradient(160deg, #6D28D9 0%, #7C3AED 42%, #9333EA 100%);
  padding: calc(var(--safe-top) + 16px) 20px 40px;
  position: relative; overflow: hidden;
}
.landing::before {
  content: '🎓'; position: absolute; top: 8%; left: -6%; font-size: 130px; opacity: 0.06; transform: rotate(-12deg);
}
.landing::after {
  content: '🎓'; position: absolute; bottom: 30%; right: -8%; font-size: 150px; opacity: 0.05; transform: rotate(10deg);
}
.landing-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: relative; z-index: 1; }
.landing-pill {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.14); color: #fff;
  border-radius: 999px; padding: 9px 14px; font-size: 12.5px; font-weight: 700;
  white-space: nowrap;
}
.landing-login { color: #fff; font-size: 14px; font-weight: 700; padding: 9px 6px; }
.landing-google-sm {
  display: flex; align-items: center; gap: 8px;
  background: #fff; color: var(--brand-dark);
  border-radius: 999px; padding: 9px 16px; font-size: 12.5px; font-weight: 700;
  white-space: nowrap; border: none; cursor: pointer;
}
.landing-google-sm img, .landing-google-lg img { width: 16px; height: 16px; }

.landing-hero { text-align: center; margin-top: 28px; position: relative; z-index: 1; }
.landing-hero img { width: 168px; margin: 0 auto; }

.landing-headline {
  font-size: 27px; font-weight: 800; color: #fff; text-align: center;
  line-height: 1.25; margin-top: 36px; position: relative; z-index: 1;
}
.landing-sub {
  font-size: 14.5px; color: rgba(255,255,255,0.82); text-align: center; line-height: 1.6;
  margin-top: 14px; position: relative; z-index: 1;
}
.landing-google-lg {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; background: #fff; color: var(--brand-dark);
  border: none; border-radius: 999px; padding: 16px; margin-top: 24px;
  font-size: 15px; font-weight: 800; cursor: pointer; position: relative; z-index: 1;
  box-shadow: 0 10px 26px rgba(0,0,0,0.2);
}

.landing-stats {
  display: flex; margin-top: 28px; background: rgba(255,255,255,0.10);
  border-radius: 18px; padding: 20px 10px; position: relative; z-index: 1;
}
.landing-stat { flex: 1; text-align: center; }
.landing-stat b { display: block; font-size: 21px; font-weight: 800; color: #fff; }
.landing-stat span { font-size: 12px; color: rgba(255,255,255,0.75); }

.landing-section-title {
  font-size: 20px; font-weight: 800; color: #fff; text-align: center;
  margin-top: 40px; position: relative; z-index: 1;
}
.landing-feature {
  display: flex; align-items: center; gap: 14px;
  background: rgba(255,255,255,0.08); border-radius: 16px;
  padding: 15px 16px; margin-top: 12px; position: relative; z-index: 1;
}
.landing-feature-icon {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  background: rgba(255,255,255,0.14);
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.landing-feature-text b { display: block; color: #fff; font-size: 14.5px; font-weight: 700; }
.landing-feature-text span { color: rgba(255,255,255,0.7); font-size: 12.5px; }

.landing-foot { text-align: center; margin-top: 34px; position: relative; z-index: 1; }
.landing-foot a { color: #fff; font-weight: 700; font-size: 13.5px; }

/* ===== Settings ===== */
.settings-section { padding: 18px 16px 4px; }
.settings-section-title { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.settings-group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.settings-row {
  display: flex; align-items: center; gap: 12px;
  padding: 14px; border-bottom: 1px solid var(--border);
}
.settings-row:last-child { border-bottom: none; }
.settings-row-text { flex: 1; min-width: 0; }
.settings-row-text b { display: block; font-size: 14px; font-weight: 700; }
.settings-row-text span { font-size: 12px; color: var(--text3); }
.settings-row .chev { width: 16px; height: 16px; color: var(--text3); flex-shrink: 0; }
.settings-row.link { cursor: pointer; }
.settings-row.danger b { color: var(--danger); }

.switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch-track {
  position: absolute; inset: 0; background: var(--surface3); border-radius: 999px; cursor: pointer;
  transition: background .15s;
}
.switch-track::before {
  content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px;
  background: #fff; border-radius: 50%; transition: transform .15s;
}
.switch input:checked + .switch-track { background: var(--brand); }
.switch input:checked + .switch-track::before { transform: translateX(18px); }

/* ===== Market (full browse page) ===== */
.market-tabs {
  display: flex; gap: 6px; padding: 12px 16px 4px;
  overflow-x: auto; scrollbar-width: none;
}
.market-tabs::-webkit-scrollbar { display: none; }
.market-tab {
  flex-shrink: 0; border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  font: inherit; font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 999px; cursor: pointer;
}
.market-tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.market-sort-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 2px; }
.market-sort-row select { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 12.5px; }
.market-count { font-size: 12px; color: var(--text3); }

/* ===== Swift ===== */
.swift-banner {
  margin: 14px 16px 0; padding: 13px 14px; border-radius: var(--radius-sm);
  background: rgba(251,191,36,0.12); border: 1px solid var(--accent); color: var(--accent);
  font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 8px;
}
.swift-card {
  margin: 14px 16px 0; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
}
.swift-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.swift-card p { font-size: 13px; color: var(--text2); margin: 0 0 12px; line-height: 1.5; }
.swift-status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700;
  border-radius: 999px; padding: 5px 12px; margin-bottom: 10px;
}
.swift-pin-row { display: flex; gap: 10px; margin-top: 10px; }
.swift-pin { flex: 1; background: var(--surface2); border-radius: 10px; padding: 10px; text-align: center; }
.swift-pin b { display: block; font-size: 18px; letter-spacing: .1em; }
.swift-pin span { font-size: 10.5px; color: var(--text3); }
.transport-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.transport-pill {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
}
.transport-pill.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.swift-toggle-row { display: flex; align-items: center; justify-content: space-between; }
.swift-earnings-row { display: flex; gap: 12px; margin-top: 14px; }
.swift-earnings-row div { flex: 1; background: var(--surface2); border-radius: 12px; padding: 12px; text-align: center; }
.swift-earnings-row b { display: block; font-size: 17px; font-weight: 800; }
.swift-earnings-row span { font-size: 11px; color: var(--text3); }
.order-req-card {
  background: var(--surface2); border-radius: 12px; padding: 12px; margin-top: 10px;
}
.order-req-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
.order-req-sub { font-size: 12px; color: var(--text3); margin-top: 3px; }
.order-req-actions { display: flex; gap: 8px; margin-top: 10px; }
.order-req-actions .btn { flex: 1; padding: 9px; font-size: 12.5px; }
.star-row { display: flex; gap: 6px; margin: 10px 0; }
.star-btn { background: none; border: none; font-size: 26px; cursor: pointer; opacity: .35; padding: 0; }
.star-btn.active { opacity: 1; }
.pin-entry-row { display: flex; gap: 8px; margin-top: 10px; }
.pin-entry-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 11px; font: inherit; font-size: 16px; letter-spacing: .2em; text-align: center; color: var(--text); }
.pin-entry-row button { flex-shrink: 0; }

/* ===== Listing detail ===== */
.listing-media {
  width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;
  font-size: 90px; position: relative;
}
.listing-body { padding: 18px 16px; }
.listing-price { font-size: 26px; font-weight: 800; }
.listing-title { font-size: 17px; font-weight: 700; margin-top: 6px; }
.listing-badges { display: flex; gap: 6px; margin-top: 8px; }
.listing-badge { font-size: 11px; font-weight: 700; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; color: var(--text2); }
.listing-desc { font-size: 13.5px; color: var(--text2); line-height: 1.6; margin-top: 14px; }
.listing-seller-row {
  display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.listing-seller-row .info { flex: 1; }
.listing-seller-row b { font-size: 13.5px; display: block; }
.listing-seller-row span { font-size: 11.5px; color: var(--text3); }
.listing-actions { display: flex; gap: 10px; margin-top: 18px; }
.listing-actions .btn { flex: 1; padding: 13px; font-size: 14px; }

/* ===== Swift map + dispute ===== */
.swift-map { width: 100%; height: 180px; border-radius: var(--radius-sm); overflow: hidden; margin-top: 12px; background: var(--surface2); }
.swift-report-btn {
  margin-top: 12px; width: 100%; background: none; border: 1px solid var(--danger); color: var(--danger);
  border-radius: var(--radius-sm); padding: 11px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
}
.locate-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
  border-radius: 10px; padding: 11px 12px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
}

/* ===== Location picker (Leaflet) ===== */
.loc-picker-map { width: 100%; height: 160px; border-radius: var(--radius-sm); overflow: hidden; margin-top: 8px; background: var(--surface2); cursor: crosshair; }
.loc-picker-hint { font-size: 11px; color: var(--text3); margin-top: 5px; }
.loc-picker-status { font-size: 11.5px; font-weight: 700; margin-top: 5px; }
.loc-picker-status.set { color: var(--money); }
.loc-picker-status.unset { color: var(--text3); }
.fee-breakdown { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 6px; }
.fee-breakdown-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text2); padding: 3px 0; }
.fee-breakdown-row.total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; font-weight: 800; color: var(--text); font-size: 14px; }
.fee-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; margin-left: 6px; }

/* ===== Admin ===== */
.admin-denied { text-align: center; padding: 60px 24px; color: var(--text3); }
.admin-stats-row { display: flex; gap: 10px; padding: 14px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.admin-stats-row::-webkit-scrollbar { display: none; }
.admin-stat-card { flex-shrink: 0; min-width: 108px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px; }
.admin-stat-card b { display: block; font-size: 20px; font-weight: 800; }
.admin-stat-card span { font-size: 11px; color: var(--text3); }
.admin-tabs { display: flex; gap: 6px; padding: 14px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.admin-tabs::-webkit-scrollbar { display: none; }

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnemFtdGhoZnlraGphbGRvc3ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0Nzc2NjksImV4cCI6MjA5NDA1MzY2OX0.YpH9Zn2a2XVDZnZIlWd4d4CxhUbkURZ_H7Yegw9vih4';

window.sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Shared select strings — mirrors src/lib/listings.js and src/lib/posts.js

window.CP.POST_SELECT = '*, profiles!posts_author_id_fkey(id, username, full_name, avatar_url, is_hub, is_hub_service)';

window.CP.fmtNaira = (n) => '₦' + Number(n || 0).toLocaleString();

window.CP.timeAgo = (iso) => {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 604800) return Math.floor(s / 86400) + 'd';
  return new Date(iso).toLocaleDateString();
};

window.CP.initials = (name) => (name || 'U').slice(0, 2).toUpperCase();

// Escapes anything user-controlled before it goes into HTML. Listing titles,
// usernames, comments and dispute notes are all free text a student typed —
// without this, "<img src=x onerror=...>" in a username runs in everyone's
// browser, including the admin dashboard.
window.CP.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));


/**
 * Opens (or creates) a direct conversation between the current user and
 * otherUserId, checking both buyer/seller directions so two people never end
 * up with duplicate threads. Pass listingId to tie it to a specific item.
 * Returns the conversation id, then the caller should redirect to
 * chat-thread.html?id=<id>.
 */
window.CP.openOrCreateConversation = async function (meId, otherUserId, listingId = null) {
  if (!meId || !otherUserId || meId === otherUserId) return null;

  let existingQuery = window.sb.from('conversations').select('id')
    .or(`and(buyer_id.eq.${meId},seller_id.eq.${otherUserId}),and(buyer_id.eq.${otherUserId},seller_id.eq.${meId})`);
  existingQuery = listingId ? existingQuery.eq('listing_id', listingId) : existingQuery.is('listing_id', null);

  const { data: existing } = await existingQuery.maybeSingle();
  if (existing) return existing.id;

  const { data: created, error } = await window.sb.from('conversations')
    .insert({ buyer_id: meId, seller_id: otherUserId, listing_id: listingId })
    .select('id').single();

  if (error) { console.error('Conversation create error:', error); return null; }
  return created.id;
};

// Include on every protected page (Home, Yard, Notifications, Profile, Create).

  const isOnboardingPage = window.location.pathname.endsWith('onboarding.html');
  if (!isOnboardingPage && profile && !profile.university_id) {

  window.sb.from('profiles').update({ last_seen_at: new Date().toISOString() })

// Sign out helper, wired up from Profile page
window.CP_signOut = async () => {

// ---- Global incoming-call ring (every page that loads this guard) ----
(async () => {
  const { data: { session } } = await window.sb.auth.getSession();
  if (!session || window.location.pathname.endsWith('call.html')) return;

  let ringAudio = null;
  function startRingtone() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const beep = () => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 660; g.gain.value = 0.08;
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + 0.7);
      };
      beep();
      ringAudio = { ctx, loop: setInterval(beep, 1600) };
    } catch (_) {}
  }
  function stopRingtone() {
    if (!ringAudio) return;
    clearInterval(ringAudio.loop);
    try { ringAudio.ctx.close(); } catch (_) {}
    ringAudio = null;
  }

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  window.sb.channel(`ring-${session.user.id}`)
    .on('broadcast', { event: 'incoming' }, ({ payload }) => {
      if (document.getElementById('incomingCallOverlay')) return; // already ringing
      const name = payload.callerName || 'Camplugie user';
      const overlay = document.createElement('div');
      overlay.id = 'incomingCallOverlay';
      overlay.className = 'incoming-call';
      overlay.innerHTML = `
        <div class="avatar">${esc(name.slice(0, 2).toUpperCase())}</div>
        <h2>${esc(name)}</h2>
        <p>${payload.video ? 'Incoming video call…' : 'Incoming Camplugie call…'}</p>
        <div class="row">
          <button class="call-ctl end" id="declineCallBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.42 12.42 0 0 0 3.81.61 2 2 0 0 1 2 2V21a2 2 0 0 1-2 2h-1C7.61 23 1 16.39 1 8V7a2 2 0 0 1 2-2h3.5a2 2 0 0 1 2 2 12.42 12.42 0 0 0 .61 3.81 2 2 0 0 1-.45 2.11z"/></svg>
            <span>Decline</span>
          </button>
          <button class="call-ctl accept" id="acceptCallBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span>Answer</span>
          </button>
        </div>`;
      document.body.appendChild(overlay);
      startRingtone();
      if (navigator.vibrate) navigator.vibrate([400, 250, 400, 250, 400]);

      const cleanup = () => { stopRingtone(); overlay.remove(); if (navigator.vibrate) navigator.vibrate(0); };

      document.getElementById('acceptCallBtn').addEventListener('click', () => {
        cleanup();
        window.location.href = `call.html?peer=${payload.callerId}&name=${encodeURIComponent(name)}` +
          `&role=callee&channel=${payload.callChannel}&mode=${payload.video ? 'video' : 'audio'}&auto=1`;
      });

      document.getElementById('declineCallBtn').addEventListener('click', async () => {
        const ch = window.sb.channel(payload.callChannel);
        await ch.subscribe();
        ch.send({ type: 'broadcast', event: 'signal', payload: { kind: 'declined', from: session.user.id } });
        setTimeout(() => window.sb.removeChannel(ch), 500);
        cleanup();
      });

      setTimeout(() => { if (document.body.contains(overlay)) cleanup(); }, 35000);
    })
    .subscribe();
})();
</script>

(async () => {
  window.CP_requireAuth = () => {
    if (window.CP_USER) return true;
    const returnTo = window.location.pathname.split('/').pop() + window.location.search;
    window.location.href = 'auth.html?returnTo=' + encodeURIComponent(returnTo);
    return false;
  };

  let session;
  try {
    ({ data: { session } } = await window.sb.auth.getSession());
  } catch (err) {
    console.error('getSession() failed — continuing as guest:', err);
    window.CP_USER = null;
    window.CP_PROFILE = null;
    window.CP_READY_DETAIL = { user: null, profile: null };
    document.dispatchEvent(new CustomEvent('cp-ready', { detail: window.CP_READY_DETAIL }));
    return;
  }

  if (!session) {
    window.CP_USER = null;
    window.CP_PROFILE = null;
    // Guests resolve after a single await, which can finish before a later
    // script on the page registers its 'cp-ready' listener — caching the
    // detail lets onCpReady() catch up instead of waiting forever (looks
    // exactly like a page stuck on "Loading…" otherwise).
    window.CP_READY_DETAIL = { user: null, profile: null };
    document.dispatchEvent(new CustomEvent('cp-ready', { detail: window.CP_READY_DETAIL }));
    return;
  }

  window.CP_USER = session.user;

  const { data: profile, error } = await window.sb
    .from('profiles')
    .select('*, universities(id, name)')
    .eq('id', session.user.id)
    .single();

  if (error) console.error('Profile load error:', error);
  window.CP_PROFILE = profile || null;

  // Banned accounts get bounced everywhere except the banned-notice page itself.
  const isBannedPage = window.location.pathname.endsWith('banned.html');
  if (!isBannedPage && profile?.is_banned) {
    window.location.href = 'banned.html';

  // Google sign-ins skip the signup form's university step — send them to

  // onboarding page itself to avoid a redirect loop.)
  const isOnboardingPage = window.location.pathname.endsWith('onboarding.html');
  if (!isOnboardingPage && profile && !profile.university_id) {
    window.location.href = 'onboarding.html';
    return;
  }

  // Fill in university name wherever it's referenced in the header
  const uniName = profile?.universities?.name || profile?.institution_name || 'Your Campus';
  document.querySelectorAll('[data-uni-name]').forEach(el => { el.textContent = uniName; });

  document.dispatchEvent(new CustomEvent('cp-ready', { detail: (window.CP_READY_DETAIL = { user: session.user, profile }) }));
})();

// Runs `handler` once the auth guard above has resolved — even if that
// already happened before this line ran. Always use this instead of
// document.addEventListener('cp-ready', ...) directly.
window.onCpReady = (handler) => {
  if (window.CP_READY_DETAIL) { handler({ detail: window.CP_READY_DETAIL }); return; }
  document.addEventListener('cp-ready', handler, { once: true });
};

<script>
let myUserId = null;
let currentUniversityId = null;

let mediaInstanceCounter = 0;

function renderMedia(p) {
  const urls = p.media_urls || [];
  const types = p.media_types || [];
  if (!urls.length) return '';

  // Single video — custom player, no native controls
  if (urls.length === 1 && types[0] === 'video') {
    const id = `vid-${++mediaInstanceCounter}`;
    return `
      <div class="post-media-wrap">
        <div class="custom-video-wrap paused" id="${id}">
          <video src="${urls[0]}" playsinline muted loop></video>
          <div class="video-tap-target"></div>
          <div class="video-center-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          </div>
          <button class="video-mute-btn" aria-label="Unmute">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          </button>
          <div class="video-progress-row"><div class="video-progress-fill"></div></div>
        </div>
      </div>
    `;
  }

  // Single image
  if (urls.length === 1) {
    return `<div class="post-media-wrap"><div class="post-media-single"><img src="${urls[0]}" alt="" loading="lazy"></div></div>`;
  }

  // Multiple items — swipeable carousel (images and/or videos use simple <video> without custom
  // controls inside a carousel, to keep swipe gesture unambiguous from video scrubbing)
  const id = `carousel-${++mediaInstanceCounter}`;
  const slides = urls.map((url, i) => {
    const isVideo = types[i] === 'video';
    return `<div class="media-carousel-slide">${isVideo ? `<video src="${url}" playsinline muted loop controls></video>` : `<img src="${url}" alt="" loading="lazy">`}</div>`;
  }).join('');
  const dots = urls.map((_, i) => `<span class="${i === 0 ? 'active' : ''}"></span>`).join('');

  return `
    <div class="post-media-wrap">
      <div class="media-carousel" id="${id}">
        <div class="media-carousel-track">${slides}</div>
        <div class="media-count-badge">1/${urls.length}</div>
        <div class="media-carousel-dots">${dots}</div>
      </div>
    </div>
  `;
}

  const likeCount = p.like_count || 0;
  const commentCount = p.comment_count || 0;
  const repostCount = p.repost_count || 0;
  const hasLiked = likedIds.has(p.id);

  return `
    <div class="post-card${isPinned ? ' pinned' : ''}" data-id="${p.id}">
      <div class="avatar">${window.CP.initials(name)}</div>
      <div class="post-main">

        </div>
        ${p.body || p.content ? `<div class="post-body">${CP.esc(p.body || p.content)}</div>` : ''}
        ${renderMedia(p)}
        <div class="post-actions">
          <button class="post-action comment-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            ${commentCount || ''}
          </button>
          <button class="post-action repost-btn${repostCount ? ' repost-active' : ''}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            ${repostCount || ''}
          </button>
          <button class="post-action zap-btn${hasLiked ? ' liked' : ''}" data-liked="${hasLiked}">
            ⚡ <span class="zap-count">${likeCount}</span>
          </button>
          <button class="post-action share-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          </button>
        </div>
      </div>
    </div>
  `;
}

async function loadFeed(universityId) {
  const feed = document.getElementById('feed');
  feed.innerHTML = `<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px;">Loading feed…</div>`;
  try {
    await loadFeedInner(universityId, feed);
  } catch (err) {
    // Anything that throws (rather than returning an { error }) used to leave
    // the feed showing "Loading feed…" forever. Always land on a real message.
    console.error('Feed load threw:', err);
    feed.innerHTML = `<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px;">Couldn't load the feed.<br><span style="font-size:11px;opacity:.7">${CP.esc(err.message || err)}</span></div>`;
  }
}

async function loadFeedInner(universityId, feed) {
  let { data, error } = await window.sb
    .from('posts')
    .select(window.CP.POST_SELECT)
    .eq('university_id', universityId)
    .order('featured', { ascending: false })
    .order('created_at', { ascending: false })
    .limit(30);

  // Fall back gracefully if the 'featured' column doesn't exist yet on this
  // database (run the migration to get pinning; this keeps the feed working either way).
  if (error && /featured/i.test(error.message || '')) {
    console.warn('posts.featured column missing — loading feed without pin-sort. Run the admin migration to enable pinning.');
    ({ data, error } = await window.sb
      .from('posts')
      .select(window.CP.POST_SELECT)
      .eq('university_id', universityId)
      .order('created_at', { ascending: false })
      .limit(30));
  }

  if (error) {
    console.error('Feed load error:', error);
    feed.innerHTML = `<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px;">Couldn't load the feed.<br><span style="font-size:11px;opacity:.7">${CP.esc(error.message || '')}</span></div>`;
    return;
  }
  if (!data || !data.length) { feed.innerHTML = `<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px;">No posts yet — be the first to post in The Yard 🎓</div>`; return; }

  // Fetch which of these posts the current user has liked, as a separate query
  // (safer than an embedded join, which breaks if the FK relationship name doesn't match).
  let likedIds = new Set();
  if (myUserId) {
    const { data: likes, error: likesError } = await window.sb
      .from('post_likes').select('post_id').eq('user_id', myUserId).in('post_id', data.map(p => p.id));
    if (likesError) console.error('Likes lookup error (non-fatal):', likesError);
    else likedIds = new Set((likes || []).map(l => l.post_id));
  }

  feed.innerHTML = data.map(p => renderPost(p, likedIds)).join('');
  initMediaInteractions();
}

// ---- Custom video player + carousel behavior ----
let videoObserver;

function initMediaInteractions() {
  // Autoplay muted videos when scrolled into view, pause otherwise (X/Instagram-style)
  if (videoObserver) videoObserver.disconnect();
  videoObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const wrap = entry.target;
      const video = wrap.querySelector('video');
      if (!video) return;
      if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
        video.play().then(() => wrap.classList.remove('paused')).catch(() => {});
      } else {
        video.pause();
        wrap.classList.add('paused');
      }
    });
  }, { threshold: [0, 0.6] });

  document.querySelectorAll('.custom-video-wrap').forEach(wrap => {
    const video = wrap.querySelector('video');
    const tapTarget = wrap.querySelector('.video-tap-target');
    const muteBtn = wrap.querySelector('.video-mute-btn');
    const progressRow = wrap.querySelector('.video-progress-row');
    const progressFill = wrap.querySelector('.video-progress-fill');

    tapTarget.addEventListener('click', () => {
      if (video.paused) { video.play(); wrap.classList.remove('paused'); }
      else { video.pause(); wrap.classList.add('paused'); }
    });
    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      video.muted = !video.muted;
      muteBtn.innerHTML = video.muted
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a9 9 0 0 1 0 12"/></svg>`;
    });
    video.addEventListener('timeupdate', () => {
      if (video.duration) progressFill.style.width = `${(video.currentTime / video.duration) * 100}%`;
    });
    progressRow.addEventListener('click', (e) => {
      e.stopPropagation();
      const rect = progressRow.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      if (video.duration) video.currentTime = ratio * video.duration;
    });

    videoObserver.observe(wrap);
  });

  // Carousel dot sync + "1/N" counter as the user swipes
  document.querySelectorAll('.media-carousel').forEach(carousel => {
    const track = carousel.querySelector('.media-carousel-track');
    const dots = carousel.querySelectorAll('.media-carousel-dots span');
    const badge = carousel.querySelector('.media-count-badge');
    let ticking = false;
    track.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const index = Math.round(track.scrollLeft / track.clientWidth);
        dots.forEach((d, i) => d.classList.toggle('active', i === index));
        if (badge) badge.textContent = `${index + 1}/${dots.length}`;
        ticking = false;
      });
    });
  });
}

window.onCpReady((e) => {
  myUserId = e.detail.user?.id || null;
  currentUniversityId = e.detail.profile?.university_id || null;

  if (!e.detail.user) {
    initGuestFeedBrowsing();
    return;
  }

  if (!currentUniversityId) return;
  loadFeed(currentUniversityId);
});

// Guests have no profile (so no locked-in university) — let them pick one to
// browse The Yard, same as Market. Remembered in localStorage.
async function initGuestFeedBrowsing() {
  const composeFab = document.getElementById('composeFab');
  if (composeFab) composeFab.style.display = 'none';

  const banner = document.createElement('div');
  banner.style.cssText = 'background:var(--surface2);border-radius:12px;padding:12px 14px;margin:10px 14px;font-size:13px;color:var(--text2);display:flex;flex-direction:column;gap:8px;';
  banner.innerHTML = `
    <div><b style="color:var(--text)">Browsing as a guest.</b> Sign up to post, like, or comment.</div>
    <select id="guestUniPickerYard" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px;font:inherit;color:var(--text)">
      <option value="">Loading campuses…</option>
    </select>
    <a href="auth.html?view=signup" class="btn" style="text-align:center;text-decoration:none;">Sign up free</a>
  `;
  document.body.insertBefore(banner, document.body.firstChild.nextSibling || document.body.firstChild);

  const picker = document.getElementById('guestUniPickerYard');
  const feed = document.getElementById('feed');

  // Prefer the school already chosen on browse.html (?uni=... or localStorage)
  // and load the feed from it immediately, so the feed never waits on the
  // universities query just to fill in the picker's labels.
  const params = new URLSearchParams(window.location.search);
  const preferred = params.get('uni') || localStorage.getItem('cp_guest_university_id') || '';
  if (preferred) {
    currentUniversityId = preferred;
    loadFeed(preferred);
  }

  let unis = null;
  try {
    const res = await window.sb.from('universities').select('id, name').order('name');
    if (res.error) throw res.error;
    unis = res.data || [];
  } catch (err) {
    console.error('University load error:', err);
    picker.remove();
    if (!preferred) feed.innerHTML = `<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px;">Couldn't load campuses. Please refresh, or pick a school again.</div>`;
    return;
  }

  picker.innerHTML = unis.map(u => `<option value="${u.id}">${CP.esc(u.name)}</option>`).join('');
  const chosen = (preferred && unis.some(u => u.id === preferred)) ? preferred : (unis[0]?.id || '');
  picker.value = chosen;

  if (chosen && chosen !== preferred) {
    currentUniversityId = chosen;
    loadFeed(chosen);
  } else {
    currentUniversityId = chosen || null;
  }

  picker.addEventListener('change', () => {
    currentUniversityId = picker.value;
    localStorage.setItem('cp_guest_university_id', picker.value);
    loadFeed(currentUniversityId);
  });
}

// ---- Likes (optimistic UI + real upsert/delete) ----
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.zap-btn');
  if (!btn) return;
  if (!window.CP_requireAuth()) return;
  const postId = btn.closest('.post-card')?.dataset.id;
  if (!postId) return;

  const wasLiked = btn.dataset.liked === 'true';
  const countEl = btn.querySelector('.zap-count');
  const currentCount = parseInt(countEl.textContent, 10) || 0;

  btn.dataset.liked = String(!wasLiked);
  btn.classList.toggle('liked', !wasLiked);
  countEl.textContent = Math.max(0, currentCount + (wasLiked ? -1 : 1));

  if (wasLiked) {
    const { error } = await window.sb.from('post_likes').delete().eq('post_id', postId).eq('user_id', myUserId);
    if (error) console.error('Unlike error:', error);
  } else {
    const { error } = await window.sb.from('post_likes').upsert({ post_id: postId, user_id: myUserId });
    if (error) console.error('Like error:', error);
  }
});

// ================= Compose =================
let composeFiles = []; // { file, type: 'image'|'video' }

function openCompose() { if (!window.CP_requireAuth()) return; document.getElementById('composeOverlay').style.display = 'flex'; }
function closeCompose() {
  document.getElementById('composeOverlay').style.display = 'none';
  document.getElementById('composeText').value = '';
  composeFiles = [];
  renderComposeMedia();
  updateSubmitState();
}

document.getElementById('composeFab').addEventListener('click', openCompose);
document.getElementById('composeCancelBtn').addEventListener('click', closeCompose);

document.getElementById('composeText').addEventListener('input', updateSubmitState);
function updateSubmitState() {
  const text = document.getElementById('composeText').value.trim();
  document.getElementById('composeSubmitBtn').disabled = !text && composeFiles.length === 0;
}

document.getElementById('composeImageBtn').addEventListener('click', () => document.getElementById('composeImageInput').click());
document.getElementById('composeVideoBtn').addEventListener('click', () => document.getElementById('composeVideoInput').click());

document.getElementById('composeImageInput').addEventListener('change', (e) => {
  const room = 5 - composeFiles.length;
  Array.from(e.target.files || []).slice(0, room).forEach(file => composeFiles.push({ file, type: 'image' }));
  e.target.value = '';
  renderComposeMedia(); updateSubmitState();
});
document.getElementById('composeVideoInput').addEventListener('change', (e) => {
  if (composeFiles.length >= 5) return;
  const file = e.target.files?.[0];
  if (file) composeFiles.push({ file, type: 'video' });
  e.target.value = '';
  renderComposeMedia(); updateSubmitState();
});

function renderComposeMedia() {
  const row = document.getElementById('composeMediaRow');
  row.innerHTML = composeFiles.map((m, i) => `
    <div class="compose-media-thumb" data-index="${i}">
      ${m.type === 'video'
        ? `<video src="${URL.createObjectURL(m.file)}" muted></video>`
        : `<img src="${URL.createObjectURL(m.file)}" alt="">`}
      <button type="button" class="remove-media-btn" data-index="${i}">✕</button>
    </div>
  `).join('');
  row.querySelectorAll('.remove-media-btn').forEach(btn => {
    btn.addEventListener('click', () => { composeFiles.splice(Number(btn.dataset.index), 1); renderComposeMedia(); updateSubmitState(); });
  });
}

document.getElementById('composeSubmitBtn').addEventListener('click', async () => {
  if (!window.CP_requireAuth()) return;
  if (!myUserId || !currentUniversityId) return;
  const body = document.getElementById('composeText').value.trim();
  const submitBtn = document.getElementById('composeSubmitBtn');
  submitBtn.disabled = true;

  let media_urls = [];
  let media_types = [];
  if (composeFiles.length) {
    try {
      submitBtn.textContent = `Uploading… 0/${composeFiles.length}`;
      let done = 0;
      for (const m of composeFiles) {
        const url = m.type === 'video'
          ? await uploadVideoToCloudinary(m.file)
          : await window.CP.uploadToCloudinary(m.file, { folder: `camplugie/posts/${myUserId}` });
        media_urls.push(url);
        media_types.push(m.type);
        done++; submitBtn.textContent = `Uploading… ${done}/${composeFiles.length}`;
      }
    } catch (err) {
      console.error('Media upload error:', err);
      submitBtn.disabled = false; submitBtn.textContent = 'Post';
      alert(err.message || 'Could not upload media — please try again.');
      return;
    }
  }

  submitBtn.textContent = 'Posting…';

  let postType = 'text';
  if (media_types.includes('video')) postType = 'video';
  else if (media_types.includes('image')) postType = 'image';
  if (media_types.length > 0 && body) postType = 'mixed';

  const { error } = await window.sb.from('posts').insert({
    author_id: myUserId, university_id: currentUniversityId,
    content: body || null, media_urls, media_types, post_type: postType,
    created_at: new Date().toISOString(),
  });

  submitBtn.textContent = 'Post';
  if (error) { console.error('Post create error:', error); submitBtn.disabled = false; alert(`Could not post: ${error.message || 'unknown error'}`); return; }

  closeCompose();
  loadFeed(currentUniversityId);
});

// Video upload — Cloudinary needs the /video/upload endpoint, not /image/upload
function uploadVideoToCloudinary(file) {
  return new Promise((resolve, reject) => {
    if (file.size > 40 * 1024 * 1024) { reject(new Error('Video must be under 40MB.')); return; }
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', window.CP.CLOUDINARY_UPLOAD_PRESET);
    formData.append('folder', `camplugie/posts/${myUserId}`);
    fetch(`https://api.cloudinary.com/v1_1/${window.CP.CLOUDINARY_CLOUD_NAME}/video/upload`, { method: 'POST', body: formData })
      .then(async r => {
        const payload = await r.json().catch(() => ({}));
        console.log('Cloudinary video upload response:', r.status, payload);
        if (payload.secure_url) { resolve(payload.secure_url); return; }
        const cloudinaryMsg = payload?.error?.message;
        reject(new Error(cloudinaryMsg ? `Cloudinary: ${cloudinaryMsg}` : `Video upload failed (HTTP ${r.status}). Check that the "${window.CP.CLOUDINARY_UPLOAD_PRESET}" preset allows unsigned uploads and video resource type.`));
      })
      .catch(() => reject(new Error('Network upload failed — couldn\u2019t reach Cloudinary. Check your internet connection.')));
  });
}

// ================= Comments =================
let activePostId = null;

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.comment-btn');
  if (!btn) return;
  activePostId = btn.closest('.post-card')?.dataset.id;
  if (activePostId) openComments(activePostId);
});

document.getElementById('closeCommentsBtn').addEventListener('click', () => {
  document.getElementById('commentsOverlay').style.display = 'none';
});

async function openComments(postId) {
  document.getElementById('commentsOverlay').style.display = 'flex';
  const list = document.getElementById('commentsList');
  list.innerHTML = `<div class="admin-empty">Loading…</div>`;

  const { data, error } = await window.sb
    .from('post_comments').select('*, profiles!post_comments_author_id_fkey(full_name, username)')
    .eq('post_id', postId).order('created_at', { ascending: true });

  document.getElementById('commentsSub').textContent = `${data?.length || 0} comments`;

  if (error) { list.innerHTML = `<div class="admin-empty">Couldn't load comments.</div>`; return; }
  if (!data || !data.length) { list.innerHTML = `<div class="admin-empty">No comments yet — say something 👋</div>`; return; }

  list.innerHTML = data.map(c => `
    <div class="comment-row">
      <div class="avatar">${window.CP.initials(c.profiles?.full_name || c.profiles?.username)}</div>
      <div class="comment-row-text">
        <b>${CP.esc(c.profiles?.full_name || c.profiles?.username || 'User')} <span class="time">· ${window.CP.timeAgo(c.created_at)}</span></b>
        <p>${CP.esc(c.content)}</p>
      </div>
    </div>
  `).join('');
  list.scrollTop = list.scrollHeight;
}

document.getElementById('commentSendBtn').addEventListener('click', sendComment);
document.getElementById('commentInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendComment(); });

async function sendComment() {
  if (!window.CP_requireAuth()) return;
  const input = document.getElementById('commentInput');
  const content = input.value.trim();
  if (!content || !activePostId || !myUserId) return;
  input.value = '';

  const { error } = await window.sb.from('post_comments').insert({ post_id: activePostId, author_id: myUserId, content });
  if (error) { console.error('Comment error:', error); alert('Could not post comment.'); return; }

  // Keep the on-screen comment count in sync without a full feed reload
  const card = document.querySelector(`.post-card[data-id="${activePostId}"]`);
  const commentBtn = card?.querySelector('.comment-btn');
  if (commentBtn) {
    const current = parseInt(commentBtn.textContent.replace(/\D/g, ''), 10) || 0;
    commentBtn.lastChild.textContent = ` ${current + 1}`;
  }
  openComments(activePostId);
}
